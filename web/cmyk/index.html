<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RGB → CMYK</title>
<style>
  :root { --bg:#fff; --ink:#1d1d1f; --mute:#6e6e73; --line:#dcdcd8; --soft:#f6f6f4; --accent:#1d1d1f; --accent-ink:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161617; --ink:#ececec; --mute:#98989d; --line:#3a3a3d; --soft:#1f1f21; --accent:#ececec; --accent-ink:#161617; }
  }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.lead { color:var(--mute); margin:0 0 24px; }
  #drop { display:block; border:2px dashed var(--line); border-radius:12px; padding:40px 16px; text-align:center; cursor:pointer; background:var(--soft); }
  #drop.over { border-color:var(--ink); }
  #drop strong { display:block; font-size:1.1rem; }
  #drop span { color:var(--mute); }
  #file { display:none; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:16px 0; }
  button, a.btn { font:inherit; padding:8px 18px; border-radius:8px; border:0; background:var(--accent); color:var(--accent-ink); cursor:pointer; text-decoration:none; }
  button:disabled { opacity:.4; cursor:default; }
  #report { white-space:pre-wrap; background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:16px; }
  #report:empty { display:none; }
  #report section + section { border-top:1px solid var(--line); margin-top:12px; padding-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>RGB → CMYK 印刷 PDF</h1>
  <p class="lead">以 Ghostscript 轉成 Japan Color 2011 Coated，並做基本印刷預檢。檔案只在這台電腦處理，不會上傳。</p>

  <label id="drop" for="file">
    <strong id="name">拖放 PDF 到這裡，或點一下選擇檔案</strong>
    <span>Word 檔請先在 Word「另存新檔 → PDF」，版面最準</span>
  </label>
  <input id="file" type="file" accept=".pdf,application/pdf">

  <div class="row">
    <label><input id="forceK" type="checkbox" checked> 黑色／灰色文字與線條改為單色黑（K100）</label>
  </div>
  <div class="row">
    <button id="go" disabled>轉換</button>
    <a id="dl" class="btn" hidden>下載 CMYK PDF</a>
    <span id="status"></span>
  </div>
  <div id="report"></div>
</div>
<script>
const $ = id => document.getElementById(id);
let file = null;
function pick(f) {
  if (!f) return;
  file = f;
  $('name').textContent = f.name;
  $('go').disabled = false;
  $('dl').hidden = true;
  $('report').textContent = '';
}
$('file').onchange = e => pick(e.target.files[0]);
const drop = $('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); pick(e.dataTransfer.files[0]); };

$('go').onclick = async () => {
  const body = new FormData();
  body.append('file', file);
  body.append('forceK', $('forceK').checked ? '1' : '0');
  $('go').disabled = true;
  $('dl').hidden = true;
  $('report').textContent = '';
  const t0 = Date.now();
  const tick = setInterval(() => $('status').textContent = `轉換中… ${Math.round((Date.now() - t0) / 1000)} 秒`, 500);
  try {
    const res = await (await fetch('/api/cmyk', { method: 'POST', body })).json();
    $('report').replaceChildren(...res.report.map(t => Object.assign(document.createElement('section'), { textContent: t })));
    if (res.ok) {
      $('dl').href = res.download;
      $('dl').hidden = false;
    }
    $('status').textContent = res.ok ? '完成' : '失敗';
  } catch (e) {
    $('status').textContent = '無法連到背景服務：' + e;
  } finally {
    clearInterval(tick);
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
