<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RGB → CMYK</title>
<link rel="stylesheet" href="/tool.css">
<style>
#report { white-space:pre-wrap; }
  #report section + section { border-top:1px solid var(--line); margin-top:12px; padding-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>RGB → CMYK 印刷 PDF</h1>
  <p class="lead">以 Ghostscript 轉成 Japan Color 2011 Coated，並做基本印刷預檢。檔案只在這台電腦處理，不會上傳。</p>

  <label id="drop" for="file">
    <strong id="name">拖放 PDF 到這裡，或點一下選擇檔案</strong>
    <span>Word 檔請先在 Word「另存新檔 → PDF」，版面最準</span>
  </label>
  <input id="file" type="file" accept=".pdf,application/pdf">

  <div class="row">
    <label><input id="forceK" type="checkbox" checked> 黑色／灰色文字與線條改為單色黑（K100）</label>
  </div>
  <div class="row">
    <button id="go" disabled>轉換</button>
    <a id="dl" class="btn" hidden>下載 PDF</a>
    <span id="msg"></span>
  </div>
  <div id="report" class="panel"></div>
</div>
<script>
const $ = id => document.getElementById(id);
let file = null;
function pick(f) {
  if (!f) return;
  file = f;
  $('name').textContent = f.name;
  $('go').disabled = false;
  $('dl').hidden = true;
  $('report').textContent = '';
}
$('file').onchange = e => pick(e.target.files[0]);
const drop = $('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); pick(e.dataTransfer.files[0]); };

$('go').onclick = async () => {
  const body = new FormData();
  body.append('file', file);
  body.append('forceK', $('forceK').checked ? '1' : '0');
  $('go').disabled = true;
  $('dl').hidden = true;
  $('report').textContent = '';
  const t0 = Date.now();
  const tick = setInterval(() => $('msg').textContent = `轉換中… ${Math.round((Date.now() - t0) / 1000)} 秒`, 500);
  try {
    const res = await (await fetch('/api/cmyk', { method: 'POST', body })).json();
    $('report').replaceChildren(...res.report.map(t => Object.assign(document.createElement('section'), { textContent: t })));
    if (res.ok) {
      $('dl').href = res.download;
      $('dl').hidden = false;
    }
    $('msg').textContent = res.ok ? '完成' : '失敗';
  } catch (e) {
    $('msg').textContent = '無法連到背景服務：' + e;
  } finally {
    clearInterval(tick);
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
