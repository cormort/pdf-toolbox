<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>頁面整理</title>
<style>
  :root { --bg:#f6f6f4; --bar:#fff; --ink:#1d1d1f; --mute:#6e6e73; --line:#dcdcd8; --card:#fff; --sel:#0a66d8; --cut:#d4351c; --accent:#1d1d1f; --accent-ink:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161617; --bar:#1f1f21; --ink:#ececec; --mute:#98989d; --line:#3a3a3d; --card:#262628; --sel:#4b9bff; --cut:#ff6b57; --accent:#ececec; --accent-ink:#161617; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px 12px; background:var(--bar); border-bottom:1px solid var(--line); }
  button, .btn { font:inherit; padding:5px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  .primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .grow { flex:1; }
  #status { color:var(--mute); }
  #empty { margin:15vh auto; max-width:420px; text-align:center; color:var(--mute); border:2px dashed var(--line); border-radius:12px; padding:40px 16px; }
  #empty strong { display:block; color:var(--ink); font-size:1.1rem; margin-bottom:4px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:18px 22px; padding:16px; }
  .pg { position:relative; background:var(--card); border:2px solid transparent; border-radius:8px; padding:8px; text-align:center; cursor:pointer; user-select:none; }
  .pg.sel { border-color:var(--sel); }
  .pg.drop-before { box-shadow:-5px 0 0 var(--sel); }
  .pg.drop-after { box-shadow:5px 0 0 var(--sel); }
  .thumb { height:150px; display:flex; align-items:center; justify-content:center; }
  .thumb img { max-width:130px; max-height:130px; box-shadow:0 1px 3px rgba(0,0,0,.25); background:#fff; transition:transform .15s; }
  .cap { font-size:12px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-top:4px solid var(--file); padding-top:4px; margin-top:4px; }
  .cap b { color:var(--ink); }
  /* 頁與頁之間的分割點：點一下切換 */
  .cut { position:absolute; top:0; bottom:0; right:-18px; width:14px; border:0; padding:0; background:none; cursor:pointer; }
  .cut::after { content:""; position:absolute; top:10%; bottom:10%; left:6px; border-left:2px dashed transparent; }
  .cut:hover::after { border-color:var(--line); }
  .cut.on::after { border-color:var(--cut); }
  .cut.on::before { content:"✂"; position:absolute; top:-4px; left:0; color:var(--cut); font-size:13px; }
</style>
</head>
<body>
<header>
  <label class="btn">加入 PDF<input id="add" type="file" accept=".pdf,application/pdf" multiple hidden></label>
  <button id="rotL" title="向左旋轉（Shift+R）">⟲ 左轉</button>
  <button id="rotR" title="向右旋轉（R）">⟳ 右轉</button>
  <button id="del" title="刪除（Delete）">刪除</button>
  <button id="everyN">每 N 頁分割…</button>
  <button id="clearCuts">清除分割</button>
  <button id="undo" title="復原（Ctrl+Z）">復原</button>
  <button id="clear">清空</button>
  <span class="grow"></span>
  <span id="status"></span>
  <label><input id="marks" type="checkbox" checked> 每個原始檔加書籤</label>
  <button id="saveSel">匯出選取頁</button>
  <button id="save" class="primary">匯出</button>
</header>
<div id="empty"><strong>拖放 PDF 到這裡，或按「加入 PDF」</strong>可以一次加入多個檔案。拖拉縮圖排序；點縮圖之間的空隙設定分割點；Ctrl／Shift 可多選。</div>
<main id="grid"></main>
<script type="module">
import * as pdfjs from '/vendor/pdfjs-4.10.38/pdf.min.mjs';
// pdf-lib 用閱讀器帶的那份（sync.sh 從 pdfviewer_v2 同步），不另外 vendor
import { PDFDocument, PDFName, PDFHexString, degrees } from '/viewer/lib/pdf-lib/pdf-lib.esm.min.js';
pdfjs.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs-4.10.38/pdf.worker.min.mjs';

const $ = id => document.getElementById(id);
const COLORS = ['#0a66d8', '#e8710a', '#188038', '#a142f4', '#d01884', '#12a4af', '#b06000', '#5f6368'];
const files = [];   // { name, bytes, color, lib }
let pages = [];     // { f, p, rot, cut, sel }：第 f 個檔的第 p 頁（0 起算），cut＝這頁之後分割
const history = [];
const thumbs = new Map(); // "f:p" → object URL
let anchor = -1;

function snapshot() {
  history.push(JSON.stringify(pages));
  if (history.length > 100) history.shift();
}
function undo() {
  if (history.length) { pages = JSON.parse(history.pop()); render(); }
}
const selected = () => pages.filter(pg => pg.sel);
const stem = name => name.replace(/\.pdf$/i, '');

// ---- 加入檔案、產生縮圖 ----
async function addFiles(list, at = pages.length) {
  const added = [];
  for (const file of list) {
    if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') continue;
    const bytes = new Uint8Array(await file.arrayBuffer());
    let doc;
    try {
      doc = await pdfjs.getDocument({ data: bytes.slice() }).promise;
    } catch (e) {
      alert(`無法開啟「${file.name}」：${e.message}`);
      continue;
    }
    const f = files.push({ name: file.name, bytes, color: COLORS[files.length % COLORS.length] }) - 1;
    for (let p = 0; p < doc.numPages; p++) added.push({ f, p, rot: 0, cut: false, sel: false });
    queueThumbs(f, doc);
  }
  if (!added.length) return;
  snapshot();
  pages.splice(at, 0, ...added);
  render();
}

const queue = [];
let busy = false;
function queueThumbs(f, doc) {
  for (let p = 0; p < doc.numPages; p++) queue.push({ f, p, doc });
  if (!busy) drain();
}
async function drain() {
  busy = true;
  while (queue.length) {
    const { f, p, doc } = queue.shift();
    $('status').textContent = `產生縮圖… 剩 ${queue.length}`;
    const page = await doc.getPage(p + 1);
    const base = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: 260 / Math.max(base.width, base.height) });
    const canvas = Object.assign(document.createElement('canvas'), { width: vp.width, height: vp.height });
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    const url = URL.createObjectURL(await new Promise(r => canvas.toBlob(r)));
    thumbs.set(`${f}:${p}`, url);
    for (const img of document.querySelectorAll(`img[data-key="${f}:${p}"]`)) img.src = url;
    page.cleanup();
  }
  $('status').textContent = '';
  busy = false;
  render();
}

// ---- 畫面 ----
function render() {
  $('empty').hidden = pages.length > 0;
  $('grid').replaceChildren(...pages.map((pg, i) => {
    const el = document.createElement('div');
    el.className = 'pg' + (pg.sel ? ' sel' : '');
    el.draggable = true;
    el.dataset.i = i;
    el.style.setProperty('--file', files[pg.f].color);
    const key = `${pg.f}:${pg.p}`;
    const img = Object.assign(document.createElement('img'), { alt: '', draggable: false });
    img.dataset.key = key;
    if (thumbs.has(key)) img.src = thumbs.get(key);
    img.style.transform = `rotate(${pg.rot}deg)`;
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    thumb.append(img);
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.title = `${files[pg.f].name} 第 ${pg.p + 1} 頁`;
    cap.innerHTML = `<b>${i + 1}</b>　`;
    cap.append(`${stem(files[pg.f].name)} p.${pg.p + 1}`);
    el.append(thumb, cap);
    if (i < pages.length - 1) {
      const cut = document.createElement('button');
      cut.className = 'cut' + (pg.cut ? ' on' : '');
      cut.title = pg.cut ? '取消分割' : '在這裡分割';
      cut.dataset.cut = i;
      el.append(cut);
    }
    return el;
  }));
  const n = selected().length;
  for (const id of ['rotL', 'rotR', 'del', 'saveSel']) $(id).disabled = !n;
  for (const id of ['save', 'everyN', 'clear']) $(id).disabled = !pages.length;
  $('clearCuts').disabled = !pages.some(pg => pg.cut);
  $('undo').disabled = !history.length;
  const parts = pages.filter((pg, i) => pg.cut && i < pages.length - 1).length + 1;
  $('save').textContent = parts > 1 ? `匯出 ${parts} 個檔案` : '匯出';
  $('status').textContent ||= pages.length ? `${pages.length} 頁${n ? `，已選 ${n} 頁` : ''}` : '';
}

// ---- 選取、分割點 ----
$('grid').addEventListener('click', e => {
  const cut = e.target.closest('.cut');
  if (cut) {
    snapshot();
    const pg = pages[+cut.dataset.cut];
    pg.cut = !pg.cut;
    return render();
  }
  const el = e.target.closest('.pg');
  if (!el) {
    pages.forEach(pg => pg.sel = false);
    return render();
  }
  const i = +el.dataset.i;
  if (e.shiftKey && anchor >= 0) {
    const [a, b] = [Math.min(anchor, i), Math.max(anchor, i)];
    pages.forEach((pg, k) => pg.sel = k >= a && k <= b);
  } else if (e.ctrlKey || e.metaKey) {
    pages[i].sel = !pages[i].sel;
    anchor = i;
  } else {
    pages.forEach((pg, k) => pg.sel = k === i);
    anchor = i;
  }
  render();
});

function rotate(delta) {
  snapshot();
  for (const pg of selected()) pg.rot = (pg.rot + delta + 360) % 360;
  render();
}
function remove() {
  if (!selected().length) return;
  snapshot();
  pages = pages.filter(pg => !pg.sel);
  render();
}
$('rotL').onclick = () => rotate(-90);
$('rotR').onclick = () => rotate(90);
$('del').onclick = remove;
$('undo').onclick = undo;
$('clearCuts').onclick = () => { snapshot(); pages.forEach(pg => pg.cut = false); render(); };
$('clear').onclick = () => { snapshot(); pages = []; render(); };
$('everyN').onclick = () => {
  const n = parseInt(prompt('每幾頁分割成一個檔案？', '10'), 10);
  if (!(n > 0)) return;
  snapshot();
  pages.forEach((pg, i) => pg.cut = (i + 1) % n === 0);
  render();
};
$('add').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };

document.addEventListener('keydown', e => {
  if (e.target.closest?.('input, textarea')) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key === 'z') { e.preventDefault(); undo(); }
  else if (mod && e.key === 'a') { e.preventDefault(); pages.forEach(pg => pg.sel = true); render(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); remove(); }
  else if (e.key.toLowerCase() === 'r' && !mod && selected().length) rotate(e.shiftKey ? -90 : 90);
});

// ---- 拖拉：縮圖排序，或從外面拖入檔案 ----
let dragging = false;
const grid = $('grid');
function dropIndex(e) {
  const el = e.target.closest('.pg');
  if (!el) return pages.length;
  const r = el.getBoundingClientRect();
  return +el.dataset.i + (e.clientX > r.left + r.width / 2 ? 1 : 0);
}
function clearMarks() {
  for (const el of grid.querySelectorAll('.drop-before, .drop-after')) el.classList.remove('drop-before', 'drop-after');
}
grid.addEventListener('dragstart', e => {
  const el = e.target.closest('.pg');
  const i = +el.dataset.i;
  if (!pages[i].sel) pages.forEach((pg, k) => pg.sel = k === i);
  dragging = true;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', 'pages');
});
grid.addEventListener('dragend', () => { dragging = false; clearMarks(); render(); });
document.addEventListener('dragover', e => {
  e.preventDefault();
  clearMarks();
  const el = e.target.closest('.pg');
  if (!el) return;
  const r = el.getBoundingClientRect();
  el.classList.add(e.clientX > r.left + r.width / 2 ? 'drop-after' : 'drop-before');
});
document.addEventListener('drop', e => {
  e.preventDefault();
  clearMarks();
  const at = dropIndex(e);
  if (!dragging) return addFiles([...e.dataTransfer.files], at);
  snapshot();
  const moving = selected();
  const before = pages.slice(0, at).filter(pg => !pg.sel);
  const after = pages.slice(at).filter(pg => !pg.sel);
  pages = [...before, ...moving, ...after];
  dragging = false;
  render();
});

// ---- 匯出 ----
async function libDoc(f) {
  files[f].lib ||= await PDFDocument.load(files[f].bytes);
  return files[f].lib;
}

// 每個原始檔的每段連續頁面加一個書籤，指到該段第一頁
function addOutline(doc, items) {
  const ctx = doc.context;
  const root = ctx.nextRef();
  const refs = items.map(() => ctx.nextRef());
  items.forEach((it, i) => {
    const d = { Title: PDFHexString.fromText(it.title), Parent: root, Dest: [doc.getPage(it.page).ref, 'XYZ', null, null, null] };
    if (i > 0) d.Prev = refs[i - 1];
    if (i < refs.length - 1) d.Next = refs[i + 1];
    ctx.assign(refs[i], ctx.obj(d));
  });
  ctx.assign(root, ctx.obj({ Type: 'Outlines', First: refs[0], Last: refs.at(-1), Count: refs.length }));
  doc.catalog.set(PDFName.of('Outlines'), root);
  doc.catalog.set(PDFName.of('PageMode'), PDFName.of('UseOutlines'));
}

async function build(list) {
  const out = await PDFDocument.create();
  // 同一來源檔的頁一次複製，共用的字型等資源才不會重複一份
  const copies = new Map();
  for (const f of new Set(list.map(pg => pg.f))) {
    const idx = list.filter(pg => pg.f === f).map(pg => pg.p);
    copies.set(f, await out.copyPages(await libDoc(f), idx));
  }
  const marks = [];
  list.forEach((pg, i) => {
    const page = copies.get(pg.f).shift();
    page.setRotation(degrees((page.getRotation().angle + pg.rot) % 360));
    out.addPage(page);
    if (i === 0 || list[i - 1].f !== pg.f) marks.push({ title: stem(files[pg.f].name), page: i });
  });
  if ($('marks').checked && new Set(list.map(pg => pg.f)).size > 1) addOutline(out, marks);
  return out.save();
}

function download(bytes, name) {
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' })), download: name });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

async function exportParts(parts, suffix) {
  const base = stem(files[parts[0][0].f].name);
  $('status').textContent = '匯出中…';
  try {
    if (parts.length === 1) return download(await build(parts[0]), `${base}_${suffix}.pdf`);
    const names = parts.map((_, i) => `${base}_${String(i + 1).padStart(2, '0')}.pdf`);
    // 多個檔案：Edge 可以一次寫進選定的資料夾，不支援時逐一下載
    if (window.showDirectoryPicker) {
      const dir = await showDirectoryPicker({ mode: 'readwrite' });
      for (const [i, part] of parts.entries()) {
        const w = await (await dir.getFileHandle(names[i], { create: true })).createWritable();
        await w.write(await build(part));
        await w.close();
      }
      alert(`已存成 ${parts.length} 個檔案。`);
    } else {
      for (const [i, part] of parts.entries()) download(await build(part), names[i]);
    }
  } catch (e) {
    if (e.name !== 'AbortError') alert('匯出失敗：' + e.message);
  } finally {
    $('status').textContent = '';
    render();
  }
}
$('save').onclick = () => {
  const parts = [[]];
  pages.forEach((pg, i) => {
    parts.at(-1).push(pg);
    if (pg.cut && i < pages.length - 1) parts.push([]);
  });
  exportParts(parts, '整理');
};
$('saveSel').onclick = () => exportParts([selected()], '選取');

window.organizer = { addFiles, build, get pages() { return pages; } }; // 自動化測試用
render();
</script>
</body>
</html>
