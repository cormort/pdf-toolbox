<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>頁面尺寸統一</title>
<style>
  :root { --bg:#fff; --ink:#1d1d1f; --mute:#6e6e73; --line:#dcdcd8; --soft:#f6f6f4; --accent:#1d1d1f; --accent-ink:#fff; --warn:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161617; --ink:#ececec; --mute:#98989d; --line:#3a3a3d; --soft:#1f1f21; --accent:#ececec; --accent-ink:#161617; --warn:#ff8a80; }
  }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.lead { color:var(--mute); margin:0 0 24px; }
  #drop { display:block; border:2px dashed var(--line); border-radius:12px; padding:32px 16px; text-align:center; cursor:pointer; background:var(--soft); }
  #drop.over { border-color:var(--ink); }
  #drop strong { display:block; font-size:1.1rem; }
  #file { display:none; }
  .field { margin:16px 0; }
  .field > span { display:block; font-weight:600; margin-bottom:4px; }
  .field small { display:block; color:var(--mute); }
  .opts { display:flex; flex-wrap:wrap; gap:6px 20px; }
  select { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:20px 0; }
  button, a.btn { font:inherit; padding:8px 18px; border-radius:8px; border:0; background:var(--accent); color:var(--accent-ink); cursor:pointer; text-decoration:none; }
  button:disabled { opacity:.4; cursor:default; }
  #msg.warn { color:var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <h1>頁面尺寸統一</h1>
  <p class="lead">把每一頁統一成同一個尺寸（內容等比縮放、置中），適合把大小不一的掃描頁或附件整理成 A4 再送印。
    小頁面也會被放大填滿；不想放大就先用原尺寸處理。</p>

  <label id="drop" for="file"><strong id="name">拖放 PDF 到這裡，或點一下選擇檔案</strong></label>
  <input id="file" type="file" accept=".pdf,application/pdf">

  <div class="field">
    <span>目標尺寸</span>
    <select id="paper">
      <option value="A4" selected>A4（210 × 297 mm）</option>
      <option value="A3">A3（297 × 420 mm）</option>
      <option value="A5">A5（148 × 210 mm）</option>
      <option value="B5">B5（182 × 257 mm）</option>
      <option value="Letter">Letter（8.5 × 11 in）</option>
      <option value="Legal">Legal（8.5 × 14 in）</option>
    </select>
  </div>
  <div class="field">
    <span>方向</span>
    <div class="opts">
      <label><input type="radio" name="land" value="0" checked> 直式</label>
      <label><input type="radio" name="land" value="1"> 橫式</label>
    </div>
    <small>選橫式時所有頁面都會轉成橫的（不會自動判斷單頁方向）。</small>
  </div>
  <div class="row">
    <button id="go" disabled>統一尺寸</button>
    <a id="dl" class="btn" hidden>下載 PDF</a>
    <span id="msg"></span>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let file = null;
function pick(f) {
  if (!f) return;
  file = f;
  $('name').textContent = f.name;
  $('go').disabled = false;
  $('dl').hidden = true;
  $('msg').textContent = '';
  $('msg').className = '';
}
$('file').onchange = e => pick(e.target.files[0]);
const drop = $('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); pick(e.dataTransfer.files[0]); };

$('go').onclick = async () => {
  const body = new FormData();
  body.append('file', file);
  body.append('paper', $('paper').value);
  body.append('landscape', document.querySelector('[name=land]:checked').value);
  $('go').disabled = true;
  $('dl').hidden = true;
  $('msg').className = '';
  $('msg').textContent = '處理中…';
  try {
    const res = await (await fetch('/api/resize', { method: 'POST', body })).json();
    $('msg').textContent = res.ok ? res.message : res.message;
    $('msg').className = res.ok ? '' : 'warn';
    if (res.ok) { $('dl').href = res.download; $('dl').hidden = false; }
  } catch (e) {
    $('msg').textContent = '無法連到背景服務：' + e;
    $('msg').className = 'warn';
  } finally {
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
