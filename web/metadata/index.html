<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中繼資料</title>
<link rel="stylesheet" href="/tool.css">
<style>
legend { padding:0 6px; color:var(--mute); }
  .f { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
  .f label { flex:0 0 8.5em; color:var(--mute); }
  .f input { flex:1; max-width:none; box-sizing:border-box; font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--bg); color:var(--ink); }
  #extra { color:var(--mute); font-size:.9rem; margin:6px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>中繼資料</h1>
  <p class="lead">讀出、修改或清除 PDF 的標題、作者、產生軟體等資訊，以及內嵌的 XMP。寄件前清一清比較不洩漏來源。
    清除後輸出檔只會留下寫入工具自己的產生軟體名稱與時間戳（任何 PDF 寫入器都會蓋），原本的作者、公司、軟體路徑都會消失。</p>

  <label id="drop" for="file"><strong id="name">拖放 PDF 到這裡，或點一下選擇檔案</strong>
    <span>作者、公司、產生軟體都藏在這裡，寄件前清一清</span>
  </label>
  <input id="file" type="file" accept=".pdf,application/pdf">

  <fieldset id="box" class="panel" hidden>
    <legend id="legend"></legend>
    <div id="fields"></div>
    <p id="extra"></p>
  </fieldset>

  <div class="row">
    <button id="save" disabled>套用變更</button>
    <button id="clear" class="danger" disabled>清除全部中繼資料</button>
    <a id="dl" class="btn" hidden>下載 PDF</a>
    <span id="msg"></span>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const KEYS = ['Title', 'Author', 'Subject', 'Keywords', 'Creator', 'Producer', 'CreationDate', 'ModDate'];
let file = null;

function pick(f) {
  if (!f) return;
  file = f;
  $('name').textContent = f.name;
  $('dl').hidden = true;
  $('msg').className = '';
  read();
}
$('file').onchange = e => pick(e.target.files[0]);
const drop = $('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); pick(e.dataTransfer.files[0]); };

async function send(action, label) {
  const body = new FormData();
  body.append('file', file);
  body.append('action', action);
  for (const k of KEYS) if ($(k)) body.append(k, $(k).value);
  const t0 = Date.now();
  const tick = setInterval(() => $('msg').textContent = `${label}… ${Math.round((Date.now() - t0) / 1000)} 秒`, 500);
  try {
    const res = await (await fetch('/api/metadata', { method: 'POST', body })).json();
    if (!res.ok) throw new Error(res.message);
    return res;
  } finally {
    clearInterval(tick);
  }
}

async function read() {
  try {
    const res = await send('read', '讀取中');
    $('fields').replaceChildren(...KEYS.map(k => {
      const row = document.createElement('div');
      row.className = 'f';
      const label = document.createElement('label');
      label.textContent = k;
      label.htmlFor = k;
      const input = document.createElement('input');
      input.id = k;
      input.type = 'text';
      input.value = res.fields[k] || '';
      row.append(label, input);
      return row;
    }));
    $('legend').textContent = `${res.pageCount} 頁` + (res.hasXMP ? '，含 XMP 中繼資料' : '，沒有 XMP');
    $('extra').textContent = res.extra && res.extra.length ? '其他自訂欄位（唯讀）：' + res.extra.join('、') : '';
    $('box').hidden = false;
    $('save').disabled = false;
    $('clear').disabled = false;
    $('msg').textContent = '';
  } catch (e) {
    $('msg').textContent = '' + e.message;
    $('msg').className = 'warn';
    $('box').hidden = true;
    $('save').disabled = true;
    $('clear').disabled = true;
  }
}

function done(res) {
  $('dl').href = res.download;
  $('dl').hidden = false;
  $('msg').textContent = '完成，欄位已' + (res.download.includes('清除') ? '清除' : '更新');
  $('msg').className = '';
}

$('save').onclick = async () => {
  $('save').disabled = $('clear').disabled = true;
  try { done(await send('save', '套用中')); } catch (e) { $('msg').textContent = '' + e.message; $('msg').className = 'warn'; }
  finally { $('save').disabled = $('clear').disabled = false; }
};
$('clear').onclick = async () => {
  $('save').disabled = $('clear').disabled = true;
  try { done(await send('clear', '清除中')); } catch (e) { $('msg').textContent = '' + e.message; $('msg').className = 'warn'; }
  finally { $('save').disabled = $('clear').disabled = false; }
};
</script>
</body>
</html>
