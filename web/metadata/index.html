<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中繼資料</title>
<style>
  :root { --bg:#fff; --ink:#1d1d1f; --mute:#6e6e73; --line:#dcdcd8; --soft:#f6f6f4; --accent:#1d1d1f; --accent-ink:#fff; --warn:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161617; --ink:#ececec; --mute:#98989d; --line:#3a3a3d; --soft:#1f1f21; --accent:#ececec; --accent-ink:#161617; --warn:#ff8a80; }
  }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.lead { color:var(--mute); margin:0 0 24px; }
  #drop { display:block; border:2px dashed var(--line); border-radius:12px; padding:32px 16px; text-align:center; cursor:pointer; background:var(--soft); }
  #drop.over { border-color:var(--ink); }
  #drop strong { display:block; font-size:1.1rem; }
  #file { display:none; }
  fieldset { border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:18px 0 0; }
  legend { padding:0 6px; color:var(--mute); }
  .f { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
  .f label { flex:0 0 8.5em; color:var(--mute); }
  .f input { flex:1; box-sizing:border-box; font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:20px 0; }
  button, a.btn { font:inherit; padding:8px 18px; border-radius:8px; border:0; background:var(--accent); color:var(--accent-ink); cursor:pointer; text-decoration:none; }
  button:disabled { opacity:.4; cursor:default; }
  #msg.warn { color:var(--warn); }
  #extra { color:var(--mute); font-size:.9rem; margin:6px 0 0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>中繼資料</h1>
  <p class="lead">讀出、修改或清除 PDF 的標題、作者、產生軟體等資訊，以及內嵌的 XMP。寄件前清一清比較不洩漏來源。
    清除後輸出檔只會留下寫入工具自己的產生軟體名稱與時間戳（任何 PDF 寫入器都會蓋），原本的作者、公司、軟體路徑都會消失。</p>

  <label id="drop" for="file"><strong id="name">拖放 PDF 到這裡，或點一下選擇檔案</strong></label>
  <input id="file" type="file" accept=".pdf,application/pdf">

  <fieldset id="box" hidden>
    <legend id="legend"></legend>
    <div id="fields"></div>
    <p id="extra"></p>
  </fieldset>

  <div class="row">
    <button id="save" disabled>套用變更</button>
    <button id="clear" disabled>清除全部中繼資料</button>
    <a id="dl" class="btn" hidden>下載</a>
    <span id="msg"></span>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const KEYS = ['Title', 'Author', 'Subject', 'Keywords', 'Creator', 'Producer', 'CreationDate', 'ModDate'];
let file = null;

function pick(f) {
  if (!f) return;
  file = f;
  $('name').textContent = f.name;
  $('dl').hidden = true;
  $('msg').className = '';
  $('msg').textContent = '讀取中…';
  read();
}
$('file').onchange = e => pick(e.target.files[0]);
const drop = $('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); pick(e.dataTransfer.files[0]); };

async function send(action) {
  const body = new FormData();
  body.append('file', file);
  body.append('action', action);
  for (const k of KEYS) if ($(k)) body.append(k, $(k).value);
  const res = await (await fetch('/api/metadata', { method: 'POST', body })).json();
  if (!res.ok) throw new Error(res.message);
  return res;
}

async function read() {
  try {
    const res = await send('read');
    $('fields').replaceChildren(...KEYS.map(k => {
      const row = document.createElement('div');
      row.className = 'f';
      const label = document.createElement('label');
      label.textContent = k;
      label.htmlFor = k;
      const input = document.createElement('input');
      input.id = k;
      input.type = 'text';
      input.value = res.fields[k] || '';
      row.append(label, input);
      return row;
    }));
    $('legend').textContent = `${res.pageCount} 頁` + (res.hasXMP ? '，含 XMP 中繼資料' : '，沒有 XMP');
    $('extra').textContent = res.extra && res.extra.length ? '其他自訂欄位（唯讀）：' + res.extra.join('、') : '';
    $('box').hidden = false;
    $('save').disabled = false;
    $('clear').disabled = false;
    $('msg').textContent = '';
  } catch (e) {
    $('msg').textContent = '' + e.message;
    $('msg').className = 'warn';
    $('box').hidden = true;
    $('save').disabled = true;
    $('clear').disabled = true;
  }
}

function done(res) {
  $('dl').href = res.download;
  $('dl').hidden = false;
  $('msg').textContent = '完成，欄位已' + (res.download.includes('清除') ? '清除' : '更新');
  $('msg').className = '';
}

$('save').onclick = async () => {
  $('save').disabled = $('clear').disabled = true;
  try { done(await send('save')); } catch (e) { $('msg').textContent = '' + e.message; $('msg').className = 'warn'; }
  finally { $('save').disabled = $('clear').disabled = false; }
};
$('clear').onclick = async () => {
  $('save').disabled = $('clear').disabled = true;
  try { done(await send('clear')); } catch (e) { $('msg').textContent = '' + e.message; $('msg').className = 'warn'; }
  finally { $('save').disabled = $('clear').disabled = false; }
};
</script>
</body>
</html>
