<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Toolbox</title>
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>
  :root { --bg:#f6f6f4; --bar:#fff; --ink:#1d1d1f; --mute:#6e6e73; --line:#e3e3e0; --on:#1d1d1f; --on-ink:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161617; --bar:#1f1f21; --ink:#ececec; --mute:#98989d; --line:#333336; --on:#ececec; --on-ink:#161617; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--ink);
         font:14px/1.4 "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; }
  nav { display:flex; align-items:center; gap:4px; padding:6px 10px; background:var(--bar); border-bottom:1px solid var(--line); overflow-x:auto; }
  nav b { margin-right:10px; white-space:nowrap; }
  nav button { border:0; background:none; color:var(--mute); font:inherit; padding:6px 12px; border-radius:6px; cursor:pointer; white-space:nowrap; }
  nav button:hover { color:var(--ink); background:var(--line); }
  nav button[aria-selected=true] { background:var(--on); color:var(--on-ink); }
  nav a { margin-left:auto; color:var(--mute); text-decoration:none; padding:6px 12px; border:1px solid var(--line); border-radius:6px; white-space:nowrap; }
  nav a:hover { color:var(--ink); }
  nav a.has { color:var(--on-ink); background:#b3261e; border-color:#b3261e; }
  main { flex:1; position:relative; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
  iframe[hidden] { display:none; }
  #down { display:none; padding:8px 12px; background:#b3261e; color:#fff; }
</style>
</head>
<body>
<nav role="tablist">
  <b>PDF Toolbox</b>
  <button role="tab" data-src="/viewer/">閱讀與註解</button>
  <button role="tab" data-src="/recompose/">頁面重組</button>
  <button role="tab" data-src="/row-shifter/">資料列分頁調整</button>
  <button role="tab" data-src="/xls2spread/">對開表排版</button>
  <button role="tab" data-src="/diffpdf/">PDF 比對</button>
  <button role="tab" data-src="/compress/">壓縮 PDF</button>
  <button role="tab" data-src="/images/">PDF 轉圖片</button>
  <button role="tab" data-src="/extract/">取出內嵌圖片</button>
  <button role="tab" data-src="/metadata/">中繼資料</button>
  <button role="tab" data-src="/text/">PDF 轉文字</button>
  <button role="tab" data-src="/resize/">頁面尺寸統一</button>
  <button role="tab" data-src="/cmyk/">RGB → CMYK</button>
  <button role="tab" data-src="/protect/">密碼保護</button>
  <a id="errs" href="/api/errors/export" title="下載環境資訊、最近 200 筆錯誤與執行紀錄，方便回報問題">匯出錯誤紀錄</a>
</nav>
<div id="down">背景服務已結束，請重新開啟 PdfToolbox.exe。</div>
<main></main>
<script>
// 每個工具一個 iframe，第一次點才載入，之後切換只是顯示／隱藏，工作狀態不會掉
const tabs = [...document.querySelectorAll('[role=tab]')];
const frames = {};
function show(btn) {
  const src = btn.dataset.src;
  if (!frames[src]) {
    const f = document.createElement('iframe');
    f.src = src;
    f.allow = 'clipboard-read; clipboard-write; fullscreen';
    f.onload = () => hook(f.contentWindow, src); // 各工具的 JS 例外也一起收（含 sync.sh 帶進來的）
    document.querySelector('main').append(f);
    frames[src] = f;
  }
  for (const b of tabs) b.setAttribute('aria-selected', b === btn);
  for (const [k, f] of Object.entries(frames)) f.hidden = k !== src;
  document.title = btn.textContent + ' · PDF Toolbox';
  try { localStorage.setItem('toolbox:tab', src); } catch {}
}
tabs.forEach(b => b.onclick = () => show(b));
let last = null;
try { last = localStorage.getItem('toolbox:tab'); } catch {}
show(tabs.find(b => b.dataset.src === last) || tabs[0]);

// 前端錯誤回報給背景服務，匯出錯誤紀錄時才看得到瀏覽器這一側發生什麼事。
// 同一個錯誤只送一次，免得壞掉的頁面陷入迴圈把紀錄洗掉。
const sent = new Set();
function reportError(where, message, stack) {
  const key = where + '|' + message;
  if (!message || sent.has(key)) return;
  sent.add(key);
  fetch('/api/client-error', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ where, message, stack: stack || '', url: location.href }),
  }).catch(() => {});
}
function hook(win, where) {
  if (!win || win.__hooked) return;
  win.__hooked = true;
  win.addEventListener('error', e => reportError(where, e.message,
    (e.error && e.error.stack) || `${e.filename || ''}:${e.lineno || 0}`));
  win.addEventListener('unhandledrejection', e => {
    const r = e.reason;
    reportError(where, String((r && r.message) || r), r && r.stack);
  });
}
hook(window, '首頁');

// 心跳：服務端 5 分鐘沒收到請求就自行結束；順便用回應標頭更新錯誤筆數
const errBtn = document.getElementById('errs');
async function beat() {
  try {
    const r = await fetch('/api/ping');
    if (!r.ok) throw 0;
    const n = Number(r.headers.get('X-Error-Count') || 0);
    errBtn.textContent = n ? `匯出錯誤紀錄（${n}）` : '匯出錯誤紀錄';
    errBtn.classList.toggle('has', n > 0);
  } catch {
    document.getElementById('down').style.display = 'block';
  }
}
beat();
setInterval(beat, 30000);
</script>
</body>
</html>
