<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>對開表排版</title>
<style>
/* 介面配色 token：深色是預設，body.light 整組換掉。
   文件頁面本身一律白底黑字（那是紙），不受主題影響。 */
:root{
  /* HeroUI 風格 token（zinc 灰階 + semantic 色），深色為預設，body.light 整組換掉。
     文件頁面本身一律白底黑字（那是紙），不受主題影響。 */
  --ui-bg:#09090b;      /* 頁面周圍的底 */
  --ui-bar:#000;        /* 頂部工具列 */
  --ui-side:#000;       /* 左側面板 */
  --ui-panel:#18181b;   /* 面板內的小群組 content1 */
  --ui-box:#18181b;     /* 驗算等對話框 */
  --ui-drop:#000;       /* 拖放畫面 */
  --ui-ink:#ECEDEE;     /* 主要文字 foreground */
  --ui-dim:#a1a1aa;     /* 次要文字 default-500 */
  --ui-line:#27272a;    /* 分隔線 divider */
  --ui-btn:#27272a;--ui-btn-h:#3f3f46;--ui-btn-bd:transparent;
  --ui-hover:#18181b;
  --ui-acc:#006FEE;     /* primary */
  --ui-acc-soft:rgba(0,111,238,.16);
  --ui-zone-on:rgba(0,111,238,.12);
  --ui-gut:#a1a1aa;     /* 頁面左側的標尺數字（畫在版面底上，不是紙上） */
  --ui-full:#F5A524;--ui-brk:#006FEE;
  --danger-fg:#F31260;
  --ui-hot:rgba(120,40,200,.18);--ui-hot-bd:#7828C8;--ui-hot-fg:#d8b4fe;   /* 「編輯內容」未開啟時的底色 */
  --barH:52px;--fs:1;--lh:1.15;--zoom:1;--k:1;
  --r:8px;--r-lg:12px;                /* HeroUI radius sm / md */
  --sh:0 1px 2px rgba(0,0,0,.35);
  --sh-lg:0 12px 32px -8px rgba(0,0,0,.6);
  --act:#F5A524;--act-fg:#000;        /* 版面動作：warning */
  --out:#17C964;--out-fg:#000;        /* 輸出：success */
  --danger:#F31260;--danger-bd:rgba(243,18,96,.5)}   /* 危險：danger */
body.light{
  --ui-bg:#f4f4f5;--ui-bar:#fff;--ui-side:#fff;--ui-panel:#f4f4f5;--ui-box:#fff;--ui-drop:#fff;
  --ui-ink:#11181C;--ui-dim:#71717a;--ui-line:#e4e4e7;
  --ui-btn:#fff;--ui-btn-h:#e4e4e7;--ui-btn-bd:#d4d4d8;   /* 亮色：控制項白底＋框線，才不會跟面板同色而消失 */
  --ui-hover:#f4f4f5;--ui-acc:#006FEE;--ui-acc-soft:rgba(0,111,238,.1);--ui-zone-on:rgba(0,111,238,.08);
  --ui-gut:#52525b;--ui-full:#936316;--ui-brk:#006FEE;--danger-fg:#F31260;
  --sh:0 1px 2px rgba(0,0,0,.06);--sh-lg:0 12px 32px -8px rgba(0,0,0,.18);
  --ui-hot:rgba(120,40,200,.08);--ui-hot-bd:#9353D3;--ui-hot-fg:#6020A0}
*{box-sizing:border-box}
body{margin:0;background:var(--ui-bg);color:var(--ui-ink);
  font-family:Inter,-apple-system,'PingFang TC',sans-serif;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--ui-acc);outline-offset:2px}

/* ---- 拖曳載入區 ---- */
#drop{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:18px;background:var(--ui-drop);color:var(--ui-ink);z-index:20;text-align:center;padding:24px}
#drop.hide{display:none}
#zone{border:2px dashed var(--ui-line);border-radius:var(--r-lg);padding:56px 72px;background:var(--ui-panel);
      transition:border-color .2s,background .2s,transform .2s;cursor:pointer;max-width:640px}
#zone:hover{border-color:var(--ui-acc)}
#zone.on{border-color:var(--ui-acc);background:var(--ui-zone-on);transform:scale(1.01)}
#zone h1{margin:0 0 10px;font-size:21px;font-weight:600}
#zone p{margin:6px 0;font-size:13px;color:var(--ui-dim);line-height:1.7}
#zone b{color:var(--ui-ink)}
#err{color:var(--danger-fg);font-size:13px;white-space:pre-wrap;min-height:18px}
#drop small{color:var(--ui-dim);font-size:12px;max-width:620px;line-height:1.8}
/* 載入畫面上的語言鈕：沒有這條就會是瀏覽器預設外觀，深色介面下變成一塊淺灰 */
#drop button{padding:0 12px;height:30px;font-family:inherit;font-size:12.5px;font-weight:500;
  background:var(--ui-btn);color:var(--ui-ink);border:1px solid var(--ui-btn-bd);border-radius:var(--r);cursor:pointer}
#drop button:hover{background:var(--ui-btn-h)}

#bar{position:sticky;top:0;z-index:9;padding:9px 16px;background:var(--ui-bar);color:var(--ui-ink);font-size:13px;
  border-bottom:1px solid var(--ui-line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* 設定分節搬到左側欄，工具列只留全域動作，不再占掉六排高度 */
#wrap{display:flex;align-items:flex-start}
#side{flex:0 0 268px;width:268px;min-width:0;box-sizing:border-box;   /* min-width:0：flex item 預設 auto，內容會撐住讓它收不掉 */
  position:sticky;top:var(--barH);max-height:calc(100vh - var(--barH));overflow-y:auto;overflow-x:hidden;
  background:var(--ui-side);border-right:1px solid var(--ui-line);padding:10px}
body.sideOff #side{flex-basis:0;width:0;padding:0;border-right:0}   /* 直接寫實值：var 間接引用不會重算 flex-basis */
body.sideOff #side>*{display:none}
#side .sec{border:1px solid var(--ui-line);border-radius:var(--r-lg);background:var(--ui-panel);
  padding:4px 8px 8px;margin-bottom:8px}
#side .sec:last-child{margin-bottom:0}
#side summary{cursor:pointer;list-style:none;padding:6px 4px;font-size:12px;font-weight:600;color:var(--ui-ink);
  letter-spacing:.2px;display:flex;align-items:baseline;gap:6px;border-radius:var(--r);transition:background .15s}
#side summary::-webkit-details-marker{display:none}
#side summary::before{content:'▸';font-size:10px;color:var(--ui-dim);transition:transform .1s}
#side .sec[open]>summary::before{content:'▾'}
#side summary:hover{background:var(--ui-btn)}
/* 分節標題右邊那行小字說的是這一組「動到什麼範圍」 */
#side summary em{font-style:normal;font-size:11px;font-weight:400;color:var(--ui-dim);letter-spacing:0}
#side .sb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:5px 2px 0}
#side .sublbl{flex:0 0 100%;font-size:11px;color:var(--ui-dim)}
/* 面板裡說明「這樣設定會發生什麼事」的一行小字（例如末頁的備註會把地線頂多高） */
#side .sub-note{flex:0 0 100%;margin:6px 2px 0;font-size:11px;line-height:1.6;color:var(--ui-dim)}
/* 「本頁／全部／分頁」這種範圍標籤改成左邊一欄、按鈕排成格線。
   原本標籤自佔一整行又只是小灰字，四個琥珀色按鈕長得一模一樣，
   「全部」那排第三顆（HTML 重排）還會自己折行落單、看不出屬於哪一組。
   .full 讓不屬於任何範圍的動作用整列（HTML 重排、自動分頁）。 */
#side .sb.grid3{display:grid;grid-template-columns:32px 1fr 1fr;gap:6px;align-items:center}
#side .sb.grid3>*{min-width:0}
#side .sb.grid3 .sublbl{flex:none}
#side .sb.grid3 .full{grid-column:1/-1}
#side input[type=range]{width:110px}
/* 檢視模式：三顆互斥的按鈕併成一組，生效的那一顆直接上色（不必自己猜現在是哪一種） */
#side .sgrp{display:inline-flex;gap:2px;padding:2px;background:var(--ui-btn);border:1px solid var(--ui-btn-bd);border-radius:var(--r)}
#side .sgrp button{height:26px;padding:0 10px;font-size:12px;border:0;background:transparent;border-radius:calc(var(--r) - 4px)}
#side .sgrp button.active{background:var(--ui-acc);color:#fff}
#sideTog{margin-left:auto}
/* flex:0 0 auto 才會沿用 #doc 原本的 width:max-content。用 flex:1 會把 basis 變成 0，
   文件被壓成側欄剩下的寬度、右半截掉（實測內容需要 1677px 卻只給 428px） */
#doc{flex:0 0 auto}
/* #doc 用 transform:scale 縮，版面盒仍是未縮放的原寬（實測 1697px）。
   原本 .fit-center 的 margin:0 auto + transform-origin:top center 是把縮小後的內容
   置中在那個大盒子裡，文件會離左緣很遠；加了側欄之後整份會被推出畫面。
   在側欄版型下一律靠左，文件永遠貼著檢視區左緣。 */
#wrap #doc.fit-center{margin:0;transform-origin:top left}
#bar.hide{display:none}
#bar b{font-weight:600}
#bar label,#side label{display:flex;gap:6px;align-items:center;white-space:nowrap}
#bar input[type=range],#side input[type=range]{accent-color:var(--ui-acc)}
#bar input[type=checkbox],#side input[type=checkbox]{accent-color:var(--ui-acc)}
#bar input[type=number],#side input[type=number],#bar input[type=text],#side input[type=text]{
  width:68px;height:30px;padding:0 8px;background:var(--ui-btn);color:var(--ui-ink);
  border:1px solid var(--ui-btn-bd);border-radius:var(--r);transition:background .15s,border-color .15s}
#bar input[type=number]:hover,#side input[type=number]:hover,#bar input[type=text]:hover,#side input[type=text]:hover{background:var(--ui-btn-h)}
#bar input:focus,#side input:focus,#side select:focus,.grp select:focus{outline:none;border-color:var(--ui-acc)}
#bar input:disabled,#side input:disabled,#bar button:disabled,#side button:disabled{opacity:.5;cursor:not-allowed}
#side input[type=text]{width:auto}
#bar input[type=text],#side input[type=text]{height:30px;padding:0 8px}
#bar button,#side button{padding:0 12px;height:30px;line-height:1;font-size:12.5px;font-weight:500;font-family:inherit;
  background:var(--ui-btn);color:var(--ui-ink);border:1px solid var(--ui-btn-bd);border-radius:var(--r);cursor:pointer;
  transition:background .15s,opacity .15s,transform .1s}
#bar button:active,#side button:active{transform:scale(.97)}
#bar button:hover,#side button:hover{background:var(--ui-btn-h)}
#bar button.active,#side button.active{background:var(--ui-acc);border-color:transparent;color:#fff}
/* 常用的版面動作（本頁／全部）用琥珀色，跟一般按鈕的深灰拉開距離 */
#bar button.act,#side button.act{background:var(--act);color:var(--act-fg);font-weight:600}
#bar button.act:hover,#side button.act:hover{background:var(--act);opacity:.85}
/* 輸出動作（列印／匯出）：綠色 */
#bar button.out,#side button.out{background:var(--out);color:var(--out-fg);font-weight:600}
#bar button.out:hover,#side button.out:hover{background:var(--out);opacity:.85}
/* 危險動作（刪除／重設／換檔）：紅框線，hover 才填紅底 */
#bar button.danger,#side button.danger{background:transparent;border-color:var(--danger-bd);color:var(--danger-fg);font-weight:600}
#bar button.danger:hover,#side button.danger:hover{background:var(--danger);border-color:transparent;color:#fff}
/* 編輯內容：切換型，打開時整塊變紫，一眼看得出正在編輯狀態 */
#bar label.hot,#side label.hot{background:var(--ui-hot);border:1px solid var(--ui-hot-bd);color:var(--ui-hot-fg);border-radius:999px;padding:4px 10px;font-weight:600}
#bar label.hot:has(input:checked),#side label.hot:has(input:checked){background:#7828C8;border-color:transparent;color:#fff}
.grp{display:inline-flex;gap:8px;align-items:center;padding:4px 8px;background:var(--ui-panel);border-radius:var(--r-lg);border:1px solid var(--ui-line)}
.grp select,#side select{background:var(--ui-btn);color:var(--ui-ink);border:1px solid var(--ui-btn-bd);border-radius:var(--r);height:30px;padding:0 8px;font-size:12.5px;max-width:100%;cursor:pointer;transition:background .15s}
.grp select:hover,#side select:hover{background:var(--ui-btn-h)}
.grp-title{font-size:11px;color:var(--ui-dim);font-weight:600;margin-right:2px;letter-spacing:.3px}
.abtn{padding:0 8px!important;min-width:30px;font-size:12px;font-weight:600}
#outGrp{margin-left:auto}
/* 介面操作與換檔案不給膠囊底：讓「列印／匯出」那組綠色按鈕是工具列上唯一的重點，
   次要動作只剩框線，換檔案維持紅框但獨立一區，不會跟輸出擠在一起 */
#viewGrp,#fileGrp{background:transparent;border-color:transparent;padding-left:0;padding-right:0}
/* 視窗變窄、工具列折行時，換檔案自己靠右對齊，不要孤零零掛在第二列的左邊 */
#fileGrp{margin-left:auto}
#bhint{background:transparent!important;border:1px solid var(--ui-line);border-radius:999px;height:30px;padding:0 12px;color:var(--ui-dim);font-weight:500}
#bhint:hover{color:var(--ui-acc);border-color:var(--ui-acc)}
/* 未設對齊的紅底提示可整批關掉（檢視群組的開關） */
body.hide-nofmt .nofmt{background:none!important}
body.hide-empty td.emptycell{background:none!important}
body.hide-mixalign td.mixalign{background:none!important}
body.hide-badfont td.badfont{background:none!important}
/* ---- 驗算結果面板 ---- */
.panel-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.panel-box{background:var(--ui-box);color:var(--ui-ink);border:1px solid var(--ui-line);border-radius:var(--r-lg);box-shadow:var(--sh-lg);max-width:840px;width:100%;max-height:86vh;display:flex;flex-direction:column}
.panel-title{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ui-line);font-weight:600;font-size:14px}
.panel-x{background:transparent;border:none;color:var(--ui-dim);font-size:16px;cursor:pointer}
.panel-x:hover{color:var(--ui-ink)}
.panel-body{padding:14px;overflow:auto;font-size:13px;line-height:1.8;font-family:ui-monospace,Menlo,'PingFang TC',monospace}
.panel-body .bad{color:var(--danger-fg)}
.panel-body .good{color:var(--out)}
.panel-body .muted{color:#9ca3af;margin-top:10px}
.panel-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--ui-line)}
.panel-foot button{padding:0 14px;height:32px;font-family:inherit;font-size:12.5px;font-weight:500;background:var(--ui-btn);color:var(--ui-ink);border:1px solid var(--ui-btn-bd);border-radius:var(--r);cursor:pointer}
.panel-foot button:hover{background:var(--ui-btn-h)}
/* ---- 右上角可關閉的提示（動態放在工具列下方，見 showNotice） ---- */
.notice{position:fixed;top:0;right:16px;z-index:40;background:var(--ui-box);border:1px solid var(--ui-line);color:var(--ui-ink);padding:12px 16px;border-radius:var(--r-lg);max-width:400px;font-size:13px;line-height:1.7;box-shadow:var(--sh-lg);border-left:3px solid var(--ui-acc)}
.notice-x{background:none;border:none;color:var(--ui-dim);margin-left:10px;cursor:pointer;font-size:14px}
.notice-x:hover{color:#fff}

#doc{padding:20px;transform-origin:top left;transform:scale(var(--zoom));width:max-content}
#doc.fit-center{margin:0 auto;transform-origin:top center}
/* padding-top 留給「累積高度」那條資訊：它貼在整組對開的上緣，不在紙上，
   不然會壓到每頁重複的表頭。列印時歸零（.badge 本來就不印）。 */
.spread{position:relative;display:flex;gap:12px;margin-bottom:12px;padding-left:58px;padding-top:22px}
.gut{position:absolute;left:0;top:22px;width:54px;font-size:10px;color:var(--ui-gut);text-align:right}
/* 標尺數字＝「就停在這一列」，滑過去給一塊底色，才看得出來是可以點的 */
.glab{position:absolute;right:4px;transform:translateY(-100%);cursor:pointer;white-space:nowrap;
      padding:0 3px;border-radius:4px;transition:background .12s,color .12s}
.glab:hover{background:var(--ui-acc);color:#fff;text-decoration:none}
.glab.full{color:var(--ui-full);font-weight:700}
.glab.brk{color:var(--ui-brk)}
/* 螢幕上不裁切：一頁塞不下時，超出的資料列要看得見（配合紅色「超出 N mm」標籤），
   裁掉的話會像資料憑空不見。列印時才裁，交給 @page 處理。 */
.page{position:relative;background:#fff;border-radius:2px;box-shadow:0 8px 24px -6px rgba(0,0,0,.45);flex:none}
.page.over-cap{box-shadow:0 8px 24px -6px rgba(0,0,0,.45),0 0 0 2px var(--danger)}
.tline{display:flex;align-items:flex-end;overflow:hidden}
.tline>span{flex:1;line-height:var(--lh)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td,th{padding:0;vertical-align:top;font-weight:400}
.cw{overflow:hidden;line-height:var(--lh);padding:0 3px}
.vc{display:flex;flex-direction:column;justify-content:center}
/* 垂直對齊是用 flex 做的，直接子元素會變成 flex item 而縱向排開。
   儲存格內容含 rich text 的 <span> 時（中英不同字型）就會一個字一行，
   所以內容要先包一層 block 外殼，讓 flex 只看到一個項目。 */
.vw{display:block;width:100%}
.dl{display:flex;justify-content:space-between}
/* 只有一兩個字的分散對齊（「全部」「計畫」），貼齊兩端會離太開，改成落在格子的 1/3、2/3 */
.dl2{justify-content:space-evenly}
.dl i{font-style:normal}
.editing .cw[contenteditable]{outline:1px dashed #6cf;outline-offset:-1px}
.editing .cw[contenteditable]:focus{outline:2px solid #06c;background:#eef6ff}
.editing .cw span[style*="FFFFFF"]{color:#c8c8c8!important}
.vb{display:flex;flex-direction:column;justify-content:flex-end}
tr.sel>td{background:#fff6cc}
tr.dragging>td{opacity:.4;background:#dbeafe!important}
tr.drag-target-before>td{box-shadow:inset 0 3px 0 #2563eb!important}
tr.drag-target-after>td{box-shadow:inset 0 -3px 0 #2563eb!important}
body.row-dragging, body.row-dragging *{cursor:grabbing!important;user-select:none!important}
.over{box-shadow:inset 0 -2px 0 #e00}
/* 原檔沒設對齊的格：靠左／靠右是程式猜的，底色提醒人工確認（列印與 PDF 也要看得到） */
.nofmt{background:#ffb0b0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* 表格內沒填值的格：淺橘底提醒（跟紅底的「未設對齊」分開），只在畫面上看得到，不印出來也不寫回檔案 */
td.emptycell{background:#ffd9a8;-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* 同一欄裡對齊方式跟多數不一樣的格：淺紫底提醒，只在畫面上看得到 */
td.mixalign{background:#d9c8ff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* 一格內混排的字型跟全份慣例對不上的格：淺綠底提醒，只在畫面上看得到 */
td.badfont{background:#b7e4c7;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pno{position:absolute;bottom:5mm;left:0;right:0;text-align:center;font-size:9pt;color:#333}
/* 累積高度：貼在整組對開的上緣（見 render，掛在 .spread 而不是 .page 上），
   不再壓在紙上的表頭那塊；左右頁的數字本來就一樣，所以一組只留一個。
   靠左對齊標尺：視窗較窄、文件要左右捲的時候，貼右邊會整條看不到。 */
.badge{position:absolute;top:0;left:0;font-size:11px;line-height:1.3;color:#0b5c34;background:rgba(23,201,100,.18);padding:2px 8px;border-radius:999px}
.badge.bad{color:#fff;background:var(--danger)}
.mark{position:absolute;top:4px;left:6px;font-size:11px;color:#fff;background:var(--ui-acc);padding:2px 8px;border-radius:999px;cursor:pointer}
.mark:hover{background:var(--danger)}
tr.orphan>td{box-shadow:inset 0 -2px 0 #e8a000}
@media print{
  body{background:#fff}
  td.emptycell,td.mixalign,td.badfont{background:none!important}   /* 橘底／紫底／綠底只是螢幕上的提醒，不印出來 */
  #bar,#side,#drop,.badge,.mark,.notice,.panel-ov{display:none}
  #wrap{display:block}
  #doc{padding:0;margin:0!important;transform:none;width:auto}   /* margin 是畫面上的置中留白，inline 優先度高，列印一定要蓋掉 */
  .spread{display:block;margin:0;padding-left:0;padding-top:0}
  .gut{display:none}
  .page{box-shadow:none;break-after:page;overflow:hidden}
  .page.over-cap{box-shadow:none}
  .spread:last-child .page:last-child{break-after:auto}
  tr.sel>td{background:none}
  tr.orphan>td{box-shadow:none}
  .over{box-shadow:none}
}
</style>
<style id="dyn"></style>
<style id="lineCss"></style>
</head>
<body>

<div id="drop">
  <button id="blang2" class="dyn" title="Switch interface language / 切換介面語言" style="position:absolute;top:16px;right:16px">EN</button>
  <div id="zone">
    <h1 class="dyn">把 .xlsx 拖進來</h1>
    <p>或<b>點這裡選檔案</b></p>
    <p>版面（左右頁分欄、分頁、重複表頭、紙張邊界、列高欄寬字型框線）<br>全部從檔案的列印設定讀出來</p>
  </div>
  <div id="err" class="dyn"></div>
  <small>只吃 .xlsx。舊的 .xls 請先在 Excel 裡「另存新檔 → Excel 活頁簿 (.xlsx)」，或用 <b>xls2spread.py</b>轉。<br>檔案不會上傳，全部在你這台電腦的瀏覽器裡處理。</small>
  <input type="file" id="file" accept=".xlsx" hidden>
</div>

<!-- 版型依「操作範圍」分：上＝全域動作，左＝設定面板（分節可摺疊），中＝版面預覽 -->
<div id="bar" class="hide">
  <b id="fname" class="dyn"></b>
  <span class="grp">
    <button id="bundo" title="復原上一步（⌘Z / Ctrl+Z）。註：拖曳換列的順序不在復原範圍內" disabled>復原 (⌘Z)</button>
    <button id="bredo" title="重做（⇧⌘Z / Ctrl+Shift+Z）" disabled>重做 (⇧⌘Z)</button>
  </span>
  <span class="grp" id="outGrp">
    <button id="bprint" class="out" title="開啟瀏覽器的列印對話框。&#10;目的地務必選「另存為 PDF」，選成 Right PDF／Adobe PDF 等印表機會讓整頁變圖片、PDF 裡沒有文字。&#10;&#10;PDF 上若出現不明色塊／浮水印，多半是 Chrome 擴充功能疊上去的，改用無痕視窗印一次就會消失。">列印 / 存 PDF</button>
    <button id="bxlsx" class="out" title="把調好的列高與分頁寫回 xlsx，其餘內容原封不動，可回 Excel 再微調">匯出 xlsx</button>
  </span>
  <!-- 次要的介面操作自成一群，不跟輸出搶焦點 -->
  <span class="grp" id="viewGrp">
    <button id="bhint" title="單列調高：拖該列下緣，或點選後用 ↑↓（Shift×5）／直接填列高。&#10;拖曳資料列可換順序（亦可 Alt+↑/↓）。&#10;雙擊＝最小列高。&#10;左右頁同一列永遠同高。&#10;分頁：點左側標尺的累積值，或在選取列按 B。">操作說明</button>
    <button id="blang" class="dyn" title="Switch interface language / 切換介面語言">EN</button>
    <button id="btheme" class="dyn" title="切換深色／亮色介面（只影響工具列與面板，頁面本身一律白底）">🌙 深色</button>
    <button id="sideTog" class="dyn" title="收合／展開左側設定面板">◀ 設定</button>
  </span>
  <!-- 換檔案＝丢掉目前這一份，獨立一區並放到最右邊，避免跟列印／匯出擠在一起誤按 -->
  <span class="grp" id="fileGrp">
    <button id="bnew" class="danger" title="關閉目前的檔案，回到拖曳載入畫面換一個檔案">換檔案</button>
  </span>
</div>

<div id="wrap">
<aside id="side">
  <details class="sec" data-key="sel" open>
    <summary>選取的列<em>先在畫面上點選</em></summary>
    <div class="sb">
      <label title="目前選取列的高度（pt），可直接輸入數字修改">列高<input type="number" id="rh" step="0.5" disabled>pt</label>
      <button id="bfit" title="把目前選取的那一列壓到文字實際需要的最小高度">最小列高</button>
      <button id="bbrk" title="在目前選取列之前插入手動分頁（快捷鍵 B），再按一次取消">此列前分頁 (B)</button>
      <button id="bdel" class="danger" title="從版面刪掉目前選取的資料列。&#10;復原鍵救不回來，會先問一次。&#10;匯出 xlsx 時原檔那一列會被設成隱藏，不是真的刪除。">刪除本列</button>
    </div>
    <div class="sb"><span class="sublbl">本列框線</span>
      <button id="brb_t" class="abtn" title="選取列只畫上框線">上線</button>
      <button id="brb_b" class="abtn" title="選取列只畫下框線">下線</button>
      <button id="brb_both" class="abtn" title="選取列上下都畫框線">上下</button>
      <button id="brb_n" class="abtn" title="選取列不畫上下框線">無線</button>
    </div>
  </details>

  <details class="sec" data-key="rows" open>
    <summary>列高與分頁<em>本頁／整份</em></summary>
    <div class="sb grid3"><span class="sublbl">本頁</span>
      <button id="bfitpage" class="act" title="只把這一頁的每一列壓到文字實際需要的高度">最小列高</button>
      <button id="beven" class="act" title="套用「單行列高」與「多行加高」兩個設定，再把剩下的空白平均分給所有列。&#10;單行列＝單行列高；多行列＝內容高＋多行加高；空白間隔列不動。&#10;末頁不攤平（資料少，攤了會把每列撐得很高）。&#10;&#10;改過那兩個數字後要按這裡才會生效。">平均列高</button>
    </div>
    <div class="sb grid3"><span class="sublbl">全部</span>
      <button id="bfitall" class="act" title="把所有頁面的每一列都壓到文字實際需要的最小高度">最小列高</button>
      <button id="bevenall" class="act" title="每一頁都套用「單行列高」與「多行加高」，再把剩餘空白平均分給所有列。&#10;末頁只做前半段，不把空白攤到列高上。&#10;&#10;改過那兩個數字後要按這裡才會生效。">平均列高</button>
    </div>
    <div class="sb grid3">
      <button id="bhtml" class="full" title="忽略 Excel 原始列高與分頁，全部依內容重新排版（要回原樣按「重設」）">HTML 重排</button>
    </div>
    <div class="sb grid3"><span class="sublbl">分頁</span>
      <button id="bauto" class="act" title="清掉所有手動分頁點，改成完全照列高自動流動分頁">清除分頁</button>
      <button id="bfreeze" class="act" title="把目前每一頁的起點通通寫成手動分頁點，並關掉自動分頁。&#10;之後改列高、改字級都不會讓頁面重新流動，版面就定住了。&#10;（列高加到塞不下時仍會強制切頁，那是防溢出，不能關）">凍結分頁</button>
      <label class="full" title="打勾後分頁會依列高自動計算，列高改變時頁面會重新流動"><input type="checkbox" id="push">自動分頁</label>
    </div>
  </details>

  <details class="sec" data-key="colAlign" id="colGrp">
    <summary>選取的欄<em>對齊與框線</em></summary>
    <div class="sb"><select id="colAlignSelect" class="dyn" title="選擇要設定對齊與框線的欄位"></select></div>
    <div class="sb"><span class="sublbl">對齊</span>
      <button id="bcol_l" class="abtn" title="該欄靠左對齊">左</button>
      <button id="bcol_c" class="abtn" title="該欄置中對齊">中</button>
      <button id="bcol_r" class="abtn" title="該欄靠右對齊">右</button>
      <button id="bcol_d" class="abtn" title="該欄分散對齊">散</button>
      <button id="bcol_j" class="abtn" title="該欄左右對齊（兩端對齊，換行後末行靠左）">齊</button>
    </div>
    <div class="sb"><span class="sublbl">框線</span>
      <button id="bcb_l" class="abtn" title="該欄只畫左框線">左線</button>
      <button id="bcb_r" class="abtn" title="該欄只畫右框線">右線</button>
      <button id="bcb_both" class="abtn" title="該欄左右都畫框線">左右</button>
      <button id="bcb_n" class="abtn" title="該欄不畫左右框線">無線</button>
    </div>
  </details>

  <details class="sec" data-key="foot" id="footGrp">
    <summary>合計／備註<em>末頁</em></summary>
    <div class="sb">
      <select id="footSel" class="dyn" title="選擇末頁的合計列或備註列"></select>
      <label title="該列的高度（pt）。改了會即時重排，末頁容量也會跟著算"><input type="number" id="footH" step="0.5" min="4">pt</label>
    </div>
    <div class="sb">
      <label title="勾選：每一列備註沿用原檔的列高（作者留的空白行距照留），只有字裝不下時才撐高。&#10;不勾（預設）：備註列跟著內容縮回，把原檔多留的空白收掉。&#10;&#10;兩種做法備註的最底部都會對齊其他頁的地線，差別在末頁的地線被往上頂多少：&#10;沿用原檔列高＝地線跟原檔一樣高；跟著內容縮回＝地線更低、末頁可以多放幾列。"><input type="checkbox" id="footKeep">備註用原檔列高</label>
    </div>
    <div class="sb">
      <label title="打勾：載入檔案、改字型／字級／欄寬之後，自動把對開頁的備註跨頁重排一次（跟按下面那顆一樣）。&#10;不打勾：只有按按鈕時才重排。"><input type="checkbox" id="autoReflow">自動跨頁重排</label>
      <button id="breflow" title="對開表的備註是一句話橫跨左右兩張紙，原檔在 Excel 裡卻是左右兩個格子各自換行——&#10;換到瀏覽器字型之後常常變成「左邊 2 行、右邊 1 行」，讀起來就斷了。&#10;&#10;按這裡會把左右兩半接成一段，依「左半寬 → 右半寬 → 左半寬…」逐行重排：&#10;• 兩半的行數一樣、每一行在同一條基線上&#10;• 中文標點不落行首（，。、）不擠在行尾（（「）&#10;• 英文單字不會被切一半&#10;• 沒改過字的備註也可以重排；改過字的照你改的內容排&#10;• 右半自己是一條新的備註（從編號或「註」開頭）時，兩半各自排，不會硬接&#10;&#10;⌘Z 可以還原。">跨頁重排備註</button>
    </div>
    <p class="sub-note" title=""><span id="footInfo"></span></p>
    <p class="sub-note" title=""><span id="wrapInfo"></span></p>
  </details>

  <details class="sec" data-key="struct">
    <summary>結構<em>整份套用</em></summary>
    <div class="sb">
      <label title="選擇左右頁的分界欄位，左邊的欄歸左頁、右邊的歸右頁">分欄<select id="split" class="dyn"></select></label>
      <label title="列印範圍（A1 格式，例如 A1:T245）。&#10;檔案有設「列印範圍」時自動帶入；沒設就抓有資料的最大範圍。&#10;改這裡等於重新框要排版的區域，列高與分頁會重算。">範圍<input type="text" id="parea" size="10" placeholder="A1:T245"></label>
      <label title="表頭（每頁重複的標題＋欄位名稱）到第幾列為止，下一列開始算資料列。&#10;檔案有設「列印標題」時自動帶入；舊版 .xls 轉檔後通常沒有，要手動填。&#10;填 0 = 沒有表頭。">表頭到<input type="number" id="hdrLast" min="0" step="1">列</label>
    </div>
  </details>

  <details class="sec" data-key="text">
    <summary>文字<em>整份套用</em></summary>
    <div class="sb">
      <label title="全域字型設定，切換後自動重新計算列高">字型
        <select id="fontFam">
          <option value="">原檔字型</option>
          <option value="'Microsoft JhengHei','PingFang TC','Noto Sans CJK TC',sans-serif">微軟正黑體</option>
          <option value="'PMingLiU','Songti TC','Noto Serif CJK TC',serif">新細明體</option>
          <option value="'MingLiU','Songti TC',serif">細明體</option>
          <option value="'DFKai-SB','BiauKai','Songti TC',serif">標楷體</option>
          <option value="'PingFang TC','Microsoft JhengHei',sans-serif">蘋方 (PingFang)</option>
          <option value="'Noto Sans CJK TC','PingFang TC',sans-serif">思源黑體</option>
          <option value="'Noto Serif CJK TC','Songti TC',serif">思源宋體</option>
        </select>
      </label>
      <label title="設定表頭標題的對齊方式">標題對齊
        <select id="titleAlign">
          <option value="seam">中縫接續</option>
          <option value="center">置中</option>
          <option value="left">靠左</option>
          <option value="right">靠右</option>
        </select>
      </label>
      <label title="字級倍率，1 = 原始大小；調大字會變大但可能溢出格子">字級<input type="range" id="fs" min="0.7" max="1.4" step="0.01"><span id="fsv"></span></label>
      <label title="CSS 行距，影響同一格內多行文字之間的距離">行距<input type="range" id="lh" min="0.9" max="2" step="0.05"><span id="lhv"></span></label>
    </div>
  </details>

  <details class="sec" data-key="layout">
    <summary>版面<em>整份套用</em></summary>
    <div class="sb">
      <label title="Excel 的列印縮放比例，影響文字和框線的實際大小">縮放<input type="range" id="k" min="0.5" max="1.2" step="0.005"><span id="kv"></span></label>
      <label title="每一列額外墊高，等於拉開它跟下一列之間的距離；全部頁面一起套用">列間距<input type="range" id="gap" min="0" max="24" step="0.5"><span id="gapv"></span></label>
      <label title="表頭天線到地線之間的總高（mm）。這個值決定每頁能塞多少資料列：&#10;• 資料列不夠填滿時，地線會靠一列空白列撐到這個位置&#10;• 資料列太多時會自動分頁&#10;• 預設值 = 紙張高 − 上下邊界 − 標題區高度&#10;• 所有頁面共用同一個值，地線才會對齊">天地線高<input type="number" id="sh" step="0.5">mm</label>
      <label title="每頁第一列跟表頭下邊線之間的留白（pt），只影響每頁的第一列。&#10;&#10;✓ 改了立刻重排，不必按平均列高。&#10;但它會從每頁容量扣掉，可能把最後一列擠到下一頁——&#10;調完建議再按一次「全部→平均列高」收尾。">首列留白<input type="number" id="hgap" step="0.5" min="0" max="30">pt</label>
      <label title="不換行的單行列統一設成這個高度（pt）。&#10;內容需要更高時以內容為準，不會切字。&#10;&#10;⚠ 只在按「平均列高」時才套用——改這裡不會立刻重排，要再按一次平均列高。&#10;按完之後手動拉過的列會脫離這個值，直到下次再按平均列高。">單行列高<input type="number" id="oneh" step="0.5" min="4">pt</label>
      <label title="會換行的多行列，在內容高度之上額外留的空間（pt）。&#10;之後剩下的空白才平均分給所有列。&#10;&#10;⚠ 只在按「平均列高」時才套用——改這裡不會立刻重排，要再按一次平均列高。">多行加高<input type="number" id="mgap" step="0.5" min="0">pt</label>
      <label title="天線（表頭上緣）與地線（表格下緣）的粗細，「上線／左線」等手動加的框線也用這個值。&#10;預設 1.5pt（原檔比這細會自動墊到 1.5，比這粗就沿用原檔）。&#10;&#10;✓ 改了立刻重排，不必按平均列高。">線粗<input type="number" id="bpt" step="0.25" min="0" max="4">pt</label>
      <label title="勾選：末頁的天地線高跟其他頁一樣，合計與備註會被包在這個高度裡，備註底部自然對齊其他頁的地線。&#10;不勾：末頁可以用獨立的高度值（右邊的數字），不受其他頁牽制。&#10;&#10;✓ 改了立刻重排，不必按平均列高。它改的是末頁容量。">
        <input type="checkbox" id="linkend">末頁對齊地線<input type="number" id="shend" step="0.5">mm</label>
      <label title="在每頁底部置中顯示頁碼（左頁奇數、右頁偶數）。預設不顯示。"><input type="checkbox" id="pno">頁碼</label>
    </div>
  </details>

  <details class="sec" data-key="check">
    <summary>檢查<em>不動版面</em></summary>
    <div class="sb">
      <button id="bcheck" title="用目前畫面上的數字重新核對：&#10;【階層】總計 = Σ主管 → 主管 = Σ基金（公司）→ 基金 = Σ大分類 → 大分類 = Σ各計畫&#10;【交叉】比照原檔 sumif：各「◯◯主管」加總、計畫別合計（一般建築及設備＋繼續＋新興）都要等於總計&#10;百分比欄自動排除。">驗算</button>
      <button id="bcheck2" title="讀原檔裡「差異數」那幾列（通常放在列印範圍外的 sumif 檢誤區），檢查是不是全部為 0。&#10;那是 Excel 存檔時算好的值，本工具不重算公式。">原檔檢誤</button>
    </div>
  </details>

  <details class="sec" data-key="view">
    <summary>畫面<em>不會印出來</em></summary>
    <div class="sb">
      <label title="畫面檢視縮放，不影響列印，只影響螢幕上看到的大小">檢視<input type="range" id="zm" min="0.3" max="1.5" step="0.05"></label>
      <span class="sgrp" id="viewSeg">
        <button data-vm="fitW" title="讓整組對開（左右兩頁加上中間的裝訂縫與左側標尺）剛好塞滿視窗寬度。&#10;視窗變窄時會自己再縮。">符合頁寬</button>
        <button data-vm="fitH" title="讓一頁的高度剛好塞進視窗（對開時左右兩頁同高，所以看一頁就夠）。&#10;視窗變矮時會自己再縮。">符合頁高</button>
        <button data-vm="manual" title="自己拉左邊的檢視滑桿，縮放比例不再跟著視窗變動。">自訂</button>
      </span>
    </div>
    <div class="sb"><span class="sublbl">格子提示</span>
      <label title="原檔沒設對齊（Excel 的「通用」）的格會標紅底提醒人工確認。取消勾選可整批隱藏紅底。"><input type="checkbox" id="shownofmt">紅底</label>

ing rows get content height plus the padding; blank spacer rows are left alone.\nThe last page is not spread out (too little data — it would blow every row up).\n\nAfter changing either number, press this for it to take effect.", "把所有頁面的每一列都壓到文字實際需要的最小高度": "Shrinks every row on every page to the smallest height its text needs", "每一頁都套用「單行列高」與「多行加高」，再把剩餘空白平均分給所有列。\n末頁只做前半段，不把空白攤到列高上。\n\n改過那兩個數字後要按這裡才會生效。": "Applies \"Single-line height\" and \"Multi-line padding\" on every page, then splits the remaining slack evenly across the rows.\nThe last page only gets the first half — its slack is not spread into the row heights.\n\nAfter changing either number, press this for it to take effect.", "忽略 Excel 原始列高與分頁，全部依內容重新排版（要回原樣按「重設」）": "Ignores Excel's original row heights and breaks and re-lays out everything from the content (press Reset to go back)", "清掉所有手動分頁點，改成完全照列高自動流動分頁": "Clears every manual break and lets pages flow purely by row height", "把目前每一頁的起點通通寫成手動分頁點，並關掉自動分頁。\n之後改列高、改字級都不會讓頁面重新流動，版面就定住了。\n（列高加到塞不下時仍會強制切頁，那是防溢出，不能關）": "Turns the current first row of every page into a manual break and turns auto-breaking off.\nAfter that, changing row heights or font size will not reflow the pages — the layout is pinned.\n(Rows that no longer fit are still forced onto a new page — that overflow guard cannot be turned off.)", "打勾後分頁會依列高自動計算，列高改變時頁面會重新流動": "When checked, breaks are computed from row heights and pages reflow whenever a height changes", "選取的欄": "Selected column", "對齊與框線": "alignment & rules", "對齊": "Align", "左": "L", "中": "C", "右": "R", "散": "Dist", "齊": "Just", "框線": "Rules", "左線": "Left", "右線": "Right", "左右": "Both", "選擇要設定對齊與框線的欄位": "Choose the column whose alignment and rules you want to set", "該欄靠左對齊": "Align this column left", "該欄置中對齊": "Center this column", "該欄靠右對齊": "Align this column right", "該欄分散對齊": "Distribute this column", "該欄左右對齊（兩端對齊，換行後末行靠左）": "Justify this column (last line of a wrap stays left)", "該欄只畫左框線": "Rule on the left of this column only", "該欄只畫右框線": "Rule on the right of this column only", "該欄左右都畫框線": "Rules on both sides of this column", "該欄不畫左右框線": "No side rules on this column", "合計／備註": "Totals & notes", "末頁": "last page", "選擇末頁的合計列或備註列": "Pick the totals row or a note row on the last page", "該列的高度（pt）。改了會即時重排，末頁容量也會跟著算": "Height of that row (pt). Changing it reflows immediately and recomputes the last page's capacity", "結構": "Structure", "整份套用": "whole document", "分欄": "Split at", "範圍": "Range", "表頭到": "Header ends at row", "列": "", "選擇左右頁的分界欄位，左邊的欄歸左頁、右邊的歸右頁": "Choose where the spread splits: columns to the left go on the left page, the rest on the right", "列印範圍（A1 格式，例如 A1:T245）。\n檔案有設「列印範圍」時自動帶入；沒設就抓有資料的最大範圍。\n改這裡等於重新框要排版的區域，列高與分頁會重算。": "Print range in A1 notation, e.g. A1:T245.\nTaken from the workbook's own print area when it has one; otherwise the largest range with data.\nChanging it re-frames the area being laid out, so row heights and breaks are recomputed.", "表頭（每頁重複的標題＋欄位名稱）到第幾列為止，下一列開始算資料列。\n檔案有設「列印標題」時自動帶入；舊版 .xls 轉檔後通常沒有，要手動填。\n填 0 = 沒有表頭。": "Last row of the header (the title plus column names repeated on every page); data rows start on the next one.\nTaken from the workbook's print titles when it has them; converted .xls files usually do not, so fill it in by hand.\n0 = no header.", "文字": "Text", "字型": "Font", "原檔字型": "As in file", "微軟正黑體": "Microsoft JhengHei", "新細明體": "PMingLiU", "細明體": "MingLiU", "標楷體": "DFKai-SB", "蘋方 (PingFang)": "PingFang TC", "思源黑體": "Noto Sans CJK TC", "思源宋體": "Noto Serif CJK TC", "標題對齊": "Title align", "中縫接續": "Across the gutter", "置中": "Center", "靠左": "Left", "靠右": "Right", "字級": "Font size", "行距": "Line height", "全域字型設定，切換後自動重新計算列高": "Font for the whole document; row heights are recomputed when you switch", "設定表頭標題的對齊方式": "How the header title is aligned", "字級倍率，1 = 原始大小；調大字會變大但可能溢出格子": "Font size multiplier, 1 = original. Larger text may overflow its cell", "CSS 行距，影響同一格內多行文字之間的距離": "CSS line height — the spacing between wrapped lines inside one cell", "版面": "Layout", "縮放": "Scale", "列間距": "Row spacing", "天地線高": "Rule-to-rule height", "首列留白": "First-row gap", "單行列高": "Single-line height", "多行加高": "Multi-line padding", "線粗": "Rule width", "末頁對齊地線": "Last page ends on the bottom rule", "頁碼": "Page numbers", "Excel 的列印縮放比例，影響文字和框線的實際大小": "Excel's print scaling — it changes the real size of the text and the rules", "每一列額外墊高，等於拉開它跟下一列之間的距離；全部頁面一起套用": "Extra height added to every row, i.e. the gap to the row below; applied on all pages", "表頭天線到地線之間的總高（mm）。這個值決定每頁能塞多少資料列：\n• 資料列不夠填滿時，地線會靠一列空白列撐到這個位置\n• 資料列太多時會自動分頁\n• 預設值 = 紙張高 − 上下邊界 − 標題區高度\n• 所有頁面共用同一個值，地線才會對齊": "Total height (mm) from the header's top rule to the bottom rule. It decides how many data rows fit on a page:\n• when there are not enough rows, a filler row pushes the bottom rule down to this height\n• when there are too many, the page breaks\n• default = paper height − top/bottom margins − title block\n• every page shares one value, which is what keeps the bottom rules aligned", "每頁第一列跟表頭下邊線之間的留白（pt），只影響每頁的第一列。\n\n✓ 改了立刻重排，不必按平均列高。\n但它會從每頁容量扣掉，可能把最後一列擠到下一頁——\n調完建議再按一次「全部→平均列高」收尾。": "Space (pt) between the header's bottom rule and the first row of each page; it only affects that first row.\n\n✓ Takes effect immediately — no need to press Even heights.\nIt does come out of each page's capacity, though, so it can push the last row onto the next page — finish with All → Even heights.", "不換行的單行列統一設成這個高度（pt）。\n內容需要更高時以內容為準，不會切字。\n\n⚠ 只在按「平均列高」時才套用——改這裡不會立刻重排，要再按一次平均列高。\n按完之後手動拉過的列會脫離這個值，直到下次再按平均列高。": "Every single-line row is set to this height (pt).\nRows whose content needs more keep the taller height — text is never clipped.\n\n⚠ Only applied when you press Even heights — editing this does not reflow on its own.\nAny row you drag by hand afterwards leaves this value behind until the next Even heights.", "會換行的多行列，在內容高度之上額外留的空間（pt）。\n之後剩下的空白才平均分給所有列。\n\n⚠ 只在按「平均列高」時才套用——改這裡不會立刻重排，要再按一次平均列高。": "Extra space (pt) added above the content height of rows that wrap.\nWhatever slack is left after that is split evenly across the rows.\n\n⚠ Only applied when you press Even heights — editing this does not reflow on its own.", "天線（表頭上緣）與地線（表格下緣）的粗細，「上線／左線」等手動加的框線也用這個值。\n預設 1.5pt（原檔比這細會自動墊到 1.5，比這粗就沿用原檔）。\n\n✓ 改了立刻重排，不必按平均列高。": "Width of the top and bottom rules, and of any rule you add by hand with Top / Left and friends.\nDefault 1.5pt — thinner rules in the source are bumped up to 1.5, thicker ones are kept.\n\n✓ Takes effect immediately — no need to press Even heights.", "勾選：末頁的天地線高跟其他頁一樣，合計與備註會被包在這個高度裡，備註底部自然對齊其他頁的地線。\n不勾：末頁可以用獨立的高度值（右邊的數字），不受其他頁牽制。\n\n✓ 改了立刻重排，不必按平均列高。它改的是末頁容量。": "Checked: the last page uses the same rule-to-rule height as the rest, so the totals and notes sit inside it and the notes end flush with the other pages' bottom rule.\nUnchecked: the last page gets its own height (the number on the right), independent of the others.\n\n✓ Takes effect immediately — no need to press Even heights. It changes the last page's capacity.", "在每頁底部置中顯示頁碼（左頁奇數、右頁偶數）。預設不顯示。": "Centers a page number at the foot of every page (odd on the left, even on the right). Off by default.", "檢查": "Checks", "不動版面": "layout untouched", "驗算": "Cross-foot", "原檔檢誤": "Source check", "用目前畫面上的數字重新核對：\n【階層】總計 = Σ主管 → 主管 = Σ基金（公司）→ 基金 = Σ大分類 → 大分類 = Σ各計畫\n【交叉】比照原檔 sumif：各「◯◯主管」加總、計畫別合計（一般建築及設備＋繼續＋新興）都要等於總計\n百分比欄自動排除。": "Re-adds the numbers currently on screen:\n[Hierarchy] Grand total = Σ agencies → agency = Σ funds → fund = Σ major categories → category = Σ projects\n[Cross-check] Same idea as the workbook's own SUMIFs: the agency rows, and the project-type totals, must each add up to the grand total.\nPercentage columns are skipped automatically.", "讀原檔裡「差異數」那幾列（通常放在列印範圍外的 sumif 檢誤區），檢查是不是全部為 0。\n那是 Excel 存檔時算好的值，本工具不重算公式。": "Reads the \"variance\" rows in the source file (usually a SUMIF check block outside the print area) and verifies they are all zero.\nThose are the values Excel cached on save — this tool does not recalculate formulas.", "畫面": "View", "不會印出來": "never printed", "檢視": "Zoom", "符合頁寬": "Fit width", "符合頁高": "Fit height", "自訂": "Custom", "讓整組對開（左右兩頁加上中間的裝訂縫與左側標尺）剛好塞滿視窗寬度。\n視窗變窄時會自己再縮。": "Makes the whole spread (both pages, the gutter and the left ruler) fit the window width.\nIt re-scales by itself when the window gets narrower.", "讓一頁的高度剛好塞進視窗（對開時左右兩頁同高，所以看一頁就夠）。\n視窗變矮時會自己再縮。": "Makes one page fit the window height. Both halves of a spread are the same height, so one page is enough.\nIt re-scales by itself when the window gets shorter.", "自己拉左邊的檢視滑桿，縮放比例不再跟著視窗變動。": "Drag the zoom slider yourself; the zoom stops following the window.", "備註用原檔列高": "Keep source note heights", "跨頁重排備註": "Re-wrap across the spread", "自動跨頁重排": "Re-wrap automatically", "打勾：載入檔案、改字型／字級／欄寬之後，自動把對開頁的備註跨頁重排一次（跟按下面那顆一樣）。\n不打勾：只有按按鈕時才重排。": "Checked: after loading a file, changing fonts / font size / column widths, the spread\u2019s notes are re-wrapped automatically (same as pressing the button below).\nUnchecked: only the button re-wraps.", "對開表的備註是一句話橫跨左右兩張紙，原檔在 Excel 裡卻是左右兩個格子各自換行——\n換到瀏覽器字型之後常常變成「左邊 2 行、右邊 1 行」，讀起來就斷了。\n\n按這裡會把左右兩半接成一段，依「左半寬 → 右半寬 → 左半寬…」逐行重排：\n• 兩半的行數一樣、每一行在同一條基線上\n• 中文標點不落行首（，。、）不擠在行尾（（「）\n• 英文單字不會被切一半\n• 沒改過字的備註也可以重排；改過字的照你改的內容排\n• 右半自己是一條新的備註（從編號或「註」開頭）時，兩半各自排，不會硬接\n\n⌘Z 可以還原。": "A spread\u2019s notes are one sentence running across both sheets, but in the source workbook the left and right cells wrap on their own \u2014 once the browser\u2019s fonts are used the two halves often end up with different line counts (2 on the left, 1 on the right) and the sentence reads broken.\n\nThis joins the two halves into one paragraph and lays it out line by line across \u201Cleft width \u2192 right width \u2192 left width\u2026\u201D:\n\u2022 both halves get the same number of lines, each line on the same baseline\n\u2022 Chinese punctuation never starts a line (\uFF0C\u3002\u3001) and never ends one (\uFF08\u300C)\n\u2022 Latin words are never split in half\n\u2022 notes you have not edited are re-wrapped too; edited ones keep your text\n\u2022 when the right half is a new note of its own (starting with a number or \u201C\u8A3B\u201D), the halves are wrapped separately instead\n\n\u2318Z undoes it.", "勾選：每一列備註沿用原檔的列高（作者留的空白行距照留），只有字裝不下時才撐高。\n不勾（預設）：備註列跟著內容縮回，把原檔多留的空白收掉。\n\n兩種做法備註的最底部都會對齊其他頁的地線，差別在末頁的地線被往上頂多少：\n沿用原檔列高＝地線跟原檔一樣高；跟著內容縮回＝地線更低、末頁可以多放幾列。": "Checked: each note row keeps the height it has in the source (the author\u2019s blank spacing is preserved) and only grows when the text no longer fits.\nUnchecked (default): note rows shrink back to their content, dropping the blank space the source left.\n\nEither way the notes end flush with the other pages\u2019 bottom rule; what changes is how far that rule is pushed up on the last page: keeping the source heights puts it where the source had it, shrinking to content puts it lower and leaves room for more rows.", "格子提示": "Cell flags", "紅底": "Red", "橘底": "Orange", "紫底": "Purple", "綠底": "Green", "畫面檢視縮放，不影響列印，只影響螢幕上看到的大小": "On-screen zoom only — it does not affect printing", "原檔沒設對齊（Excel 的「通用」）的格會標紅底提醒人工確認。取消勾選可整批隱藏紅底。": "Cells with no alignment set in the source (Excel's \"General\") get a red background so you can check them by hand. Uncheck to hide them all.", "表格框線內卻沒有值的格會標淺橘底提醒（只在畫面上，列印、PDF 與匯出的 xlsx 都不會有）。取消勾選可整批隱藏橘底。": "Cells inside the table rules with no value get a light orange background (on screen only — never in print, the PDF or the exported xlsx). Uncheck to hide them all.", "同一欄裡對齊方式跟多數不一樣的格會標淺紫底（只在畫面上，列印、PDF 與匯出的 xlsx 都不會有）。取消勾選可整批隱藏紫底。": "Cells aligned differently from the rest of their column get a light purple background (on screen only — never in print, the PDF or the exported xlsx). Uncheck to hide them all.", "一格內混了兩種以上字型、其中有一種跟全份慣例對不上的格會標淺綠底（只在畫面上，列印、PDF 與匯出的 xlsx 都不會有）。取消勾選可整批隱藏綠底。": "Cells mixing two or more fonts where one does not match the document's convention get a light green background (on screen only — never in print, the PDF or the exported xlsx). Uncheck to hide them all.", "編輯與設定": "Editing & settings", "編輯內容": "Edit cells", "PDF 文字可編輯": "Editable PDF text", "匯出設定": "Export settings", "匯入設定": "Import settings", "重設": "Reset", "打開後可直接點資料格改字。改完不會動到你調好的列高，只有字多到裝不下時才會往上撐。\n原檔用來對齊的白色補位字會顯示成灰色，方便刪掉。": "Turn this on to click a cell and retype it. Editing leaves your row heights alone; a row only grows when the text no longer fits.\nWhite spacer characters the source used for alignment are shown in gray so you can delete them.", "分散對齊的格子原本是一個字一個元素（字距最準），存成 PDF 後在編輯器裡一字一塊、幾乎不能編。\n打勾改用 CSS 兩端對齊，整格是一段連續文字、PDF 編得動，字距由瀏覽器決定、可能跟 Excel 略有差異。": "Distributed cells are normally laid out one character per element, which gives the truest spacing but turns into one uneditable block per character in a PDF.\nCheck this to use CSS justification instead: the cell becomes one run of text that a PDF editor can handle, with spacing decided by the browser and possibly a little different from Excel.", "把目前的列高、分頁、縮放等設定匯出成 JSON 檔，下次可匯入還原": "Saves the current row heights, breaks, scaling and so on to a JSON file you can import later", "匯入之前匯出的 JSON 設定檔，還原列高、分頁等設定": "Loads a JSON settings file you exported earlier and restores the row heights, breaks and the rest", "回到 Excel 原始的列高與分頁，放棄所有調整": "Goes back to Excel's original row heights and page breaks, discarding every adjustment"};
const origText = new Map();
// 不能直接 EN[t]：文字若剛好是 "constructor"、"toString" 這類 Object.prototype 的成員，
// 取到的是函式，String.replace 會當成 replacement function 呼叫，畫面上就變成 "[object Object]"。
const tr = s => { const t = s.trim();
  return t && Object.prototype.hasOwnProperty.call(EN, t) ? s.replace(t, EN[t]) : s; };
function applyLang(){
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-Hant';
  for (const root of [$('bar'), $('side'), $('drop')]){
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n; n = w.nextNode();){
      if (n.parentElement.closest('.dyn')) continue;
      if (!origText.has(n)) origText.set(n, n.nodeValue);
      n.nodeValue = LANG === 'en' ? tr(origText.get(n)) : origText.get(n);
    }
    root.querySelectorAll('[title],[placeholder]').forEach(el2 => {
      if (el2.closest('.dyn')) return;
      for (const a of ['title','placeholder']){
        if (!el2.hasAttribute(a)) continue;
        const k = 'o' + a;
        if (el2.dataset[k] == null) el2.dataset[k] = el2.getAttribute(a);
        el2.setAttribute(a, LANG === 'en' ? tr(el2.dataset[k]) : el2.dataset[k]);
        if (el2.dataset.baseTitle) delete el2.dataset.baseTitle;   // 整欄按鈕的 tooltip 會重組，換語言後重抓
      }
    });
  }
}
function dynLabels(){
  $('blang').textContent = $('blang2').textContent = LANG === 'en' ? '中文' : 'EN';
  $('btheme').textContent = document.body.classList.contains('light') ? T('☀ 亮色','☀ Light') : T('🌙 深色','🌙 Dark');
  $('sideTog').textContent = document.body.classList.contains('sideOff') ? T('▶ 設定','▶ Settings') : T('◀ 設定','◀ Settings');
  $('zone').querySelector('h1').textContent = T('把 .xlsx 拖進來','Drop an .xlsx here');
  if (D){ document.title = D.name + T(' – 對開表排版',' – Spread layout'); updateViewBtn(); populateFootSelect(); populateColAlignSelect(); render(); }
}
