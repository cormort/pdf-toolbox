// 把一頁剩下的空白平均分給該頁每一列，讓行距看起來一致，不會上面擠、下面一大塊空白。
// 無條件捨去到 0.1pt，確保加完的總高不會反而超過容量、害最後一列被擠到下一頁。
// 哪些列是多行的：以自己的行高為單位，內容超過 1.5 行就算多行。
// 量的是目前畫面上的 DOM，所以要在改 S.h 之前呼叫。
function multiLineRows(){
  const out = new Set();
  document.querySelectorAll('tr[data-i]').forEach(tr => {
    const i = +tr.dataset.i;
    tr.querySelectorAll('.cw').forEach(w => {
      const lh = parseFloat(getComputedStyle(w).lineHeight);
      if (!lh) return;
      const keep = w.style.height; w.style.height = 'auto';
      const need = w.scrollHeight; w.style.height = keep;
      if (need > lh * 1.5) out.add(i);
    });
  });
  return out;
}

// 平均列高：單行列先壓回最小高度「固定」住，剩下的空白只分給會換行的多行列。
// 空白間隔列不動（那是原檔刻意留的距離），整頁都沒有多行列時退回平均分給每一列。
// 分兩段做，中間一定要重新分頁：
//   1. 把要處理的列全部壓回內容高度，再套「單行列高／多行加高」。
//      列變矮 → 後面的列會往前流，所以舊的分頁在這一步之後就不成立了。
//   2. 用重算後的分頁去分配剩下的空白。
// 兩段寫在一起（拿舊分頁直接分空白）的話，分配的量是照舊頁面算的，
// 實際重排後當然填不滿——本檔實測：11 組會多印成 14 組，而且再按一次還會變。
function evenOut(all){
  const pick = list => list.map((idx,n) => [idx, n === list.length-1])
                           .filter(([idx]) => all || idx.includes(sel));
  const targets = pick(pages());
  if (!targets.length){ alert(T('先點選要調整的那一頁裡的任一列','Click any row on the page you want to adjust first')); return; }
  const multi = multiLineRows();
  const one   = S.oneLineH  != null ? +S.oneLineH  : 20;
  const extra = S.multiGap != null ? +S.multiGap : 16;

  // 第 1 段：各就各位
  const pool0 = [...new Set(targets.flatMap(([idx]) => idx))].filter(i => !D.rows[i].blank);
  fitMany(pool0);
  pool0.forEach(i => { S.h[i] = multi.has(i) ? S.h[i] + extra : Math.max(S.h[i], one); });

  // 第 2 段：重算分頁後，把每頁剩下的空白平均分給該頁的列。
  // 末頁例外：資料通常只有幾列，把整頁空白攤下去會把每列撐得極高，
  // 所以末頁只做各就各位，多出來的空白留在下方由填空列吸收。
  pick(pages()).forEach(([idx, last]) => {
    if (last) return;
    const pool = idx.filter(i => !D.rows[i].blank);
    const use = pool.length ? pool : idx;
    const add = (capOf(last) - idx.reduce((s,i) => s + rh(i), 0)) / use.length;
    if (add > 0) use.forEach(i => S.h[i] = Math.floor((S.h[i] + add) * 10) / 10);
  });
  render();
}

// 把調好的列高與分頁寫回 xlsx：只改工作表 XML 的 ht 和 rowBreaks，
// 其他（公式、樣式、欄寬、巨集、圖形）全部照抄，回 Excel 還能繼續微調。

// 把一格寫回工作表 XML。原檔沒寫這個 <c> 的時候（整格空白又沒有樣式，Excel 就不寫）
// 要自己插一個進去——少了這段，使用者在空格上打的字會在匯出時被默默丢掉。
function putCell(txt, ref, inner, isNum){
  const attrsOf = a => a.replace(/\st="[^"]*"/, '') + (isNum ? '' : ' t="inlineStr"');
  const cell = a => `<c r="${ref}"${attrsOf(a)}>${inner}</c>`;
  // 這一格本來就在：整格換掉（連舊的 <v>／<is> 一起），只換開頭標籤的話舊值會留在後面。
  // 屬性裡刻意排除「/」，自閉合與成對兩種寫法才不會互相誤判——
  // 否則成對的規則會從 <c r="A5" .../> 一路吃到下一個 </c>，把中間的格全毀掉。
  const pair = new RegExp(`<c r="${ref}"([^>/]*?)>[\\s\\S]*?</c>`);
  if (pair.test(txt)) return txt.replace(pair, (m, a) => cell(a));
  const self = new RegExp(`<c r="${ref}"([^>/]*?)/>`);
  if (self.test(txt)) return txt.replace(self, (m, a) => cell(a));

  const row = rowNum(ref), col = colNum(ref), tag = `<c r="${ref}"${attrsOf('')}>${inner}</c>`;
  // 這一列本來就在：插進同一列裡、依欄序排好的位置
  const rowRe = new RegExp(`(<row r="${row}"[^>]*>)([\\s\\S]*?)(</row>)`);
  if (rowRe.test(txt)) return txt.replace(rowRe, (m, open, body, close) => {
    const cells = [...body.matchAll(/<c\b[^>]*\/>|<c\b[\s\S]*?<\/c>/g)];
    const at = cells.findIndex(c2 => colNum(/r="([A-Z]+\d+)"/.exec(c2[0])[1]) > col);
    const pos = at < 0 ? body.length : cells[at].index;
    return open + body.slice(0, pos) + tag + body.slice(pos) + close;
  });
  // 空列（<row .../>）：展開成有內容的列，不能另外再插一列同號的
  const selfRow = new RegExp(`<row r="${row}"([^>]*?)/>`);
  if (selfRow.test(txt)) return txt.replace(selfRow, (m, a) => `<row r="${row}"${a}>${tag}</row>`);
  // 連 <row> 都沒有：插一列進 sheetData，列序才不會亂
  const sd = /<sheetData>([\s\S]*?)<\/sheetData>/.exec(txt);
  if (!sd) return txt;
  const body = sd[1], rowTag = `<row r="${row}">${tag}</row>`;
  const all = [...body.matchAll(/<row\b[^>]*\/>|<row\b[\s\S]*?<\/row>/g)];
  const at = all.findIndex(r2 => +((/r="(\d+)"/.exec(r2[0]) || [])[1] || 0) > row);
  const next = at < 0 ? body + rowTag : body.slice(0, all[at].index) + rowTag + body.slice(all[at].index);
  return txt.replace(/<sheetData>[\s\S]*?<\/sheetData>/, '<sheetData>' + next + '</sheetData>');
}

async function exportXlsx(){
  if (!SRC){ alert(T('沒有原始檔可以寫回','There is no source file to write back to')); return; }
  const btn = $('bxlsx'), old = btn.textContent;
  btn.textContent = T('產生中…','Building…'); btn.disabled = true;
  try {
    let txt = await entry(SRC.z, SRC.path);
    const hByRow = new Map(D.rowNums.map((rn,i) => [rn, rh(i)]));
    // 合計／備註列也要寫回去：那幾列的高度可以在「合計／備註」面板調、末頁容量也照它算，
    // 不寫的話匯出檔會跟畫面上的末頁不一致（調了 40pt、回 Excel 還是原來的 70.9）。
    D.footNums.forEach((rn, k) => hByRow.set(rn, footHt(k)));
    const gone = new Set(S.deletedRowNums || []);   // 刪掉的列改成隱藏，不動內容與公式
    D.footNums.forEach((rn, k) => { if (S.footGone && S.footGone[k] && !footHt(k)) gone.add(rn); });
    txt = txt.replace(/<row\b[^>]*?\/?>/g, tag => {
      const m = /\sr="(\d+)"/.exec(tag);
      if (!m) return tag;
      const rn = +m[1];
      if (!hByRow.has(rn) && !gone.has(rn)) return tag;
      const selfClose = tag.endsWith('/>');
      let t = tag.slice(0, selfClose ? -2 : -1)
                 .replace(/\s(ht|customHeight|hidden)="[^"]*"/g, '');
      const attrs = gone.has(rn)
        ? ' hidden="true"'
        : ` ht="${hByRow.get(rn).toFixed(2)}" customHeight="true"`;
      return `${t}${attrs}${selfClose ? '/>' : '>'}`;
    });
    // 編輯過的內容寫回儲存格：像數字就存數字，否則存成 inline 字串（公式會被取代掉）
    Object.entries(S.edits).forEach(([key, text]) => {
      const r = cellOfKey(key);
      if (!r || !r.cell) return;
      const ref = colName(r.cell.col) + r.rowNum;
      const n = text.replace(/,/g, '').trim();
      const isNum = /^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(n);
      const inner = isNum ? `<v>${n}</v>` : `<is><t xml:space="preserve">${esc(text)}</t></is>`;
      txt = putCell(txt, ref, inner, isNum);
    });

    // 沒設對齊的格在匯出檔也填紅底：複製它原本的 xf、多掛一個 fill，回 Excel 一眼看得出要補哪幾格。
    // 若檔案之前已被本工具加過紅底（重複匯出），就沿用舊 fill、不再複製，避免 styles.xml 一直膨脹。
    let stylesPath = D.noFmt.length ? Object.keys(SRC.z.files).find(n => /styles\.xml$/.test(n)) : null;
    let stylesTxt = null;
    if (stylesPath){
      stylesTxt = await entry(SRC.z, stylesPath);
      const xfBlock = /<cellXfs count="\d+">([\s\S]*?)<\/cellXfs>/.exec(stylesTxt);
      const fillsBlock = /<fills count="\d+">([\s\S]*?)<\/fills>/.exec(stylesTxt);
      if (xfBlock && fillsBlock){
        // 兩者都要連自閉合寫法（<xf/>、<fill/>）一起算。漏算的話 fills.length 會少一個，
        // 新紅底的 fillId 就會指到既有的一個 fill 上，紅色提醒底等於沒加、還改錯了別人的樣式。
        const xfs = xfBlock[1].match(/<xf\b[^>]*\/>|<xf\b[\s\S]*?<\/xf>/g) || [];
        const fills = fillsBlock[1].match(/<fill\b[^>]*\/>|<fill\b[\s\S]*?<\/fill>/g) || [];
        // 已存在提示底色的 fill 就沿用，重複匯出才不會一直堆（FFF2B0 是舊版的黃底）
        const yellowIds = new Set(fills.map((f, idx) => /FF(FFF2B0|FFB0B0)/i.test(f) ? idx : -1).filter(i => i >= 0));
        const fillIdOf = xf => { const m = /fillId="(\d+)"/.exec(xf || ''); return m ? +m[1] : -1; };
        const nfSet = new Set(D.noFmt), clones = new Map();   // 原 s → 加了紅底的新 s
        txt = txt.replace(/<c r="([A-Z]+\d+)"([^>]*?)(\/?)>/g, (m, ref, attrs, sc) => {
          if (!nfSet.has(ref)) return m;
          const s0 = +((/\ss="(\d+)"/.exec(attrs) || [])[1] || 0);
          if (yellowIds.has(fillIdOf(xfs[s0]))) return m;   // 這格已經有底色，不用再複製
          if (!clones.has(s0)) clones.set(s0, xfs.length + clones.size);
          return `<c r="${ref}"${attrs.replace(/\ss="\d+"/, '')} s="${clones.get(s0)}"${sc}>`;
        });
        if (clones.size){
          const newFillId = fills.length;   // 新 fill 追加到最尾，index = 現有數量
          const add = [...clones.keys()].map(s0 => (xfs[s0] || '<xf/>')
            .replace(/^(<xf\b[^>]*?)\s*(\/?)>/, (m, head, sc) =>
              head.replace(/\s(fillId|applyFill)="[^"]*"/g, '') + ` fillId="${newFillId}" applyFill="1"${sc}>`));
          stylesTxt = stylesTxt
            .replace(/<fills count="\d+">/, `<fills count="${fills.length + 1}">`)
            .replace('</fills>', '<fill><patternFill patternType="solid">'
              + '<fgColor rgb="FFFFB0B0"/><bgColor indexed="64"/></patternFill></fill></fills>')
            .replace(/<cellXfs count="(\d+)">/, (m, n) => `<cellXfs count="${+n + clones.size}">`)
            .replace('</cellXfs>', add.join('') + '</cellXfs>');
        }
      }
    }

    // 分頁：brk 的 id 是「這一列之後分頁」，所以寫每頁的最後一列
    const ids = pages().slice(0, -1).map(idx => D.rowNums[idx[idx.length-1]]);
    const xmlBrk = `<rowBreaks count="${ids.length}" manualBreakCount="${ids.length}">`
      + ids.map(id => `<brk id="${id}" man="true" max="16383" min="0"/>`).join('') + '</rowBreaks>';
    txt = /<rowBreaks[\s\S]*?<\/rowBreaks>|<rowBreaks[^>]*\/>/.test(txt)
      ? txt.replace(/<rowBreaks[\s\S]*?<\/rowBreaks>|<rowBreaks[^>]*\/>/, xmlBrk)
      : txt.replace(/<colBreaks|<\/worksheet>/, m => xmlBrk + m);

    const enc = new TextEncoder(), out = [];
    for (const name of Object.keys(SRC.z.files))
      out.push({name, bytes: name === SRC.path ? enc.encode(txt)
                          : name === stylesPath && stylesTxt ? enc.encode(stylesTxt)
                          : await entryBytes(SRC.z, name)});
    const a = el('a');
    a.href = URL.createObjectURL(await zipWrite(out));
    a.download = SRC.name.replace(/(\.[^.]+)$/, '') + T('-已排版.xlsx','-laid-out.xlsx');
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e){
    alert(T('匯出失敗：','Export failed: ') + e.message); console.error(e);
  } finally {
    btn.textContent = old; btn.disabled = false;
  }
}

function htmlLayout(){
  fitMany(D.rows.map((_,i) => i));   // 每列壓到左右頁文字實際需要的高度
  S.breaks = [];                     // 分頁交給高度決定，不沿用原檔的
  render();
}

// 末頁的表格總高含合計＋備註。跟著 sh 走時，備註底部就會落在其他頁地線的同一條線上，
// 末頁的地線（合計下框線）自動被備註的高度往上頂。
const endH = () => S.linkEnd ? S.sh : S.shend;
// S.h 只存「文字實際需要的高度」，列間距是排版時再加上去的，這樣間距可以隨時拉、
// 也不會被自動配高洗掉。內容靠上對齊，多出來的高度就成為和下一列之間的距離。
const rh = i => S.h[i] + S.gap;
// 表格的實際高度 = 表頭 ＋ 資料列 ＋ 框線 ＋ 每一列捨入的零頭，扣不夠就會出現
// 「內容其實比目標高 → 填空列被壓成 0 → 那一頁的地線比別頁低」的老問題（實測 0.3～1.4mm）。
//   框線不只兩條：天線、地線，再加上填空列自己那條地線，共三條。
//   零頭是每一列各自捨入到裝置像素累積出來的，約 0.2pt/列，一頁十幾列就是 3pt。
// 這個值同時決定每頁容量，實測（兩份實際檔案、每頁 13～15 列）這樣留剛好讓地線對齊。
// 加 Math.max(10, ...) 避免負數引發死循環。
// 合計／備註列的高度：使用者調過就用 S.footH，沒調過就沿用原檔
const footHt = k => (S.footH && S.footH[k] != null ? +S.footH[k] : D.foot[k].h);
const footTotal = () => D.foot.reduce((a, _, k) => a + footHt(k), 0);
const capOf = last => Math.max(10, (((last ? endH() : S.sh) * 72 / 25.4) - (3 * linePt() + 3)) / S.k
                            - headPt - (S.headGap || 0) - (last ? footTotal() : 0));
const mmOf = h => h * S.k / 72 * 25.4;

// 線粗：沒設過就沿用原檔天線偵測出來的粗細，但至少 1.5pt（原檔的 thin/medium 印出來太細）
const linePt = () => S.borderPt != null ? +S.borderPt : Math.max(D.topBorderPt || .5, 1.5);
const linePx = () => linePt() + 'pt solid #000';

// 整欄的左右框線覆寫。cellEl 和填空列都要用：填空列直接拿第一列的 class 建 td，
// 不一起覆寫的話，該欄的直線在頁面下半段的空白區還是會畫出來，看起來就像「關不掉」。
function colBorder(td, col){
  const cb = col != null && S.colBorders && S.colBorders[col];
  if (!cb) return;
  td.style.borderLeft  = cb === 'left'  || cb === 'both' ? linePx() : 'none';
  td.style.borderRight = cb === 'right' || cb === 'both' ? linePx() : 'none';
}

// 編輯過的格：填了字就把橘底拿掉（原本的空格判定是載入時算的）
function withEdit(c, edited){
  if (edited == null) return c;
  const o = Object.assign({}, c, {t: esc(edited)});
  if (String(edited).trim()) o.c = o.c.replace(' emptycell', '');
  return o;
}
const ALIGN_NAMES = {left:['靠左','left'], center:['置中','center'], right:['靠右','right'],
                     distributed:['分散對齊','distributed'], justify:['左右對齊','justified']};
const ALIGN_TW = k => ALIGN_NAMES[k] ? T(...ALIGN_NAMES[k]) : k;

function cellEl(tag, c, h, i, side, ci){
  // 整欄對齊一設下去，欄內就一致了，紫底提示收回
  const mixOff = c.col != null && S.colAligns && S.colAligns[c.col];
  const td = el(tag, mixOff ? c.c.replace(' mixalign', '') : c.c);   // 框線在 td（border-collapse 合併），字的樣式在內層 div
  if (c.cs) td.colSpan = c.cs;
  if (c.rs) td.rowSpan = c.rs;
  // 底色是哪來的：滑過去講一句（三種底色都有各自的原因）
  const why = td.className.includes('badfont')
        ? T(`${c.ref}：${c.badTip}（淺綠底，不會印出來）`, `${c.ref}: ${c.badTip} (light green, not printed)`)
    : td.className.includes('mixalign')
        ? T(`${c.ref}：對齊是「${ALIGN_TW(c.al)}」，同欄多數是「${ALIGN_TW(c.mixTop)}」（淺紫底，不會印出來）`,
            `${c.ref}: aligned ${ALIGN_TW(c.al)}, but most of the column is ${ALIGN_TW(c.mixTop)} (light purple, not printed)`)
    : td.className.includes('emptycell')
        ? T(`${c.emp}：在表格框線內卻沒填值，可能是漏填（淺橘底，不會印出來）`,
            `${c.emp}: inside the table rules but empty — possibly a missed entry (light orange, not printed)`)
    : c.nf ? T('原檔沒設對齊（Excel 的「通用」），現在的靠左／靠右是依內容猜的（紅底，會印出來）',
               'No alignment set in the source (Excel\'s "General"); left / right was guessed from the content (red, does print)') : '';
  if (why) td.title = why;
  const w = el('div', 'cw ' + c.c + (c.v ? ' ' + c.v : ''));
  if (h != null) w.style.height = (h * S.k).toFixed(2) + 'pt';

  // 對齊只有整欄一種，且只作用在資料列（i == null 是表頭／合計備註列，維持原檔樣子）
  const align = i != null && c.col != null && S.colAligns ? S.colAligns[c.col] : null;

  let t = c.t;
  if (align){
    if (align === 'distributed'){
      w.style.textAlign = 'center';
      if (t && !S.pdfText) t = distribute(t);
    } else if (align === 'justify'){
      // ponytail: 原檔多半是 white-space:pre（不換行），不放寬就沒有第二行、justify 等於沒效果
      w.style.whiteSpace = 'pre-wrap';
      w.style.textAlign = 'justify';
    } else {
      w.style.textAlign = align;
    }
  }
  // 框線覆寫：列管上下、欄管左右，粗細跟天地線同一個值。
  // 寫在 td 的 inline style 上，才蓋得過 buildModel 產生的 class，也才會被 border-collapse 合併成連續線。
  const rb = i != null && S.rowBorders && S.rowBorders[i];
  if (rb){
    td.style.borderTop    = rb === 'top'  || rb === 'both' ? linePx() : 'none';
    td.style.borderBottom = rb === 'bottom' || rb === 'both' ? linePx() : 'none';
  }
  // PDF 可編輯：分散對齊原本是每個字包一個 <i>，靠 flex 推開才能在各家瀏覽器得到一致的字距。
  // 代價是列印成 PDF 後，那一格的每個字都是獨立元素，在 PDF 編輯器裡幾乎動不了。
  // 開這個選項就改用 CSS 兩端對齊，整格維持一段連續文字，字距交給瀏覽器（可能略有差異）。
  // 只有兩個字的分散對齊 class 是 "dl dl2"，配對時不能寫死結尾的引號
  if (S.pdfText && (/class="dl[ "]/.test(t || '') || align === 'distributed')){
    t = t.replace(/<[^>]*>/g, '');
    w.style.textAlign = 'justify';
    w.style.textAlignLast = 'justify';
    w.style.whiteSpace = 'pre-wrap';
  }

  if (c.spill) w.style.overflow = 'visible';   // 文字溢到右邊的空格子上

  colBorder(td, c.col);

  // 「（一）計畫名稱……」換行後，第二行起自動對齊到右括號後面（凸排）。
  // 括號內容長度不定，用字寬估：全形算 1em、半形算 .5em。
  if (i != null){
    const pl = (t || '').replace(/<[^>]*>/g, '');
    const m = /^[\s　]*（[^）\n]{0,8}）/.exec(pl);
    if (m){
      const w0 = [...m[0]].reduce((s, ch) => s + (ch.charCodeAt(0) < 128 ? .5 : 1), 0);
      w.style.whiteSpace = 'pre-wrap';   // 不放寬就不會換行，凸排也就看不出來
      w.style.paddingLeft = `calc(3px + ${w0}em)`;
      w.style.textIndent = `-${w0}em`;
    }
  }

  w.innerHTML = c.v ? `<span class="vw">${t}</span>` : t;
  td.appendChild(w);
  return td;
}

// 群組標題（自己沒有計畫內容、下一列比它更縮排）落在頁尾，內容卻在下一頁，看起來會斷掉。
// 原檔的空白間隔列留在頁尾也只是白佔位置。
const plainOf = t => (t || '').replace(/<[^>]*>/g, '').replace(/[\s\u3000]/g, '');
function badTail(i){
  const r = D.rows[i];
  if (r.blank) return true;
  const next = D.rows[i+1];
  return !!next && next.ind > r.ind && !plainOf(r.r[0] && r.r[0].t);
}

function paginate(guard){
  const hard = new Set(S.breaks), cap = capOf(false);
  const out = []; let cur = [], acc = 0;
  const close = auto => {
    let moved = [];
    if (auto && guard) while (cur.length > 1 && badTail(cur[cur.length-1])) moved.unshift(cur.pop());
    out.push(cur);
    cur = moved; acc = moved.reduce((s,i) => s + rh(i), 0);
  };
  D.rows.forEach((r,i) => {
    const h = rh(i);
    // 塞不下就一定要切，跟 S.push 無關：不切的話那一頁會溢出紙張，螢幕上跑到灰底、列印時被裁掉。
    // S.push 管的是「列可不可以前後流動＋頁尾守則」，不是「要不要防溢出」。
    if (cur.length && (hard.has(i) || acc + h > cap)) close(!hard.has(i));
    cur.push(i); acc += h;
  });
  if (cur.length) out.push(cur);
  // 末頁還要塞合計與備註，容量比別頁小（capOf(true) 已扣掉 footTotal()）。
  // 前面那輪是用一般頁的容量在算的，末頁一定要再修一次，否則備註會被擠到紙外、列印時不見。
  // 一樣跟 S.push 無關：這是防溢出，不是列的前後流動。
  for (let g = 0; g < 50 && out.length <= D.rows.length + 5; g++){
    const lp = out[out.length-1], cl = capOf(true), moved = [];
    while (lp.length > 1 && lp.reduce((s,i) => s + rh(i), 0) > cl) moved.unshift(lp.pop());
    if (!moved.length) break;
    out.push(moved);
  }
  return out.length ? out : [[]];
}

function pages(){
  const plain = paginate(false);
  if (!S.push) return plain;
  // 頁尾守則不強求：只有在不會多印一頁的時候才套用，會多一頁就維持原樣（改用標示提醒）
  const nice = paginate(true);
  return nice.length <= plain.length ? nice : plain;
}

function makePage(idx, side, no, last, first){
  const g = D.page, p = el('div','page');
  p.dataset.side = side;
  p.style.width = g.w + 'mm'; p.style.height = g.h + 'mm';
  p.style.padding = `${g.mt}mm ${g.mr}mm ${g.mb}mm ${g.ml}mm`;

  D.title.forEach((r, k) => {
    const line = el('div','tline'); line.style.height = (r.h * S.k).toFixed(2) + 'pt';
    // 表名列的（續）：原檔有寫就沿用（第一組對開要拿掉），沒寫就自己補在右頁表名的最後。
    // 只認第一列（表名列）的右半最後一個有字的格子，年度、單位那幾列不加。
    const lastText = k === 0 && side === 'r'
      ? r[side].reduce((acc, c, i) => plainOf(c.t) ? i : acc, -1) : -1;
    r[side].forEach((c, ci) => {
      const s = el('span', c.c);
      // 標題列每頁重複，（續）會出現在每一頁；第一組對開不該有
      // 收尾可能還跟著 </span> 之類的標籤，所以允許（續）後面接標籤與空白
      let t = first ? c.t.replace(/[（(]\s*續\s*[)）][\s　]*(?=(?:<\/[^>]+>)*$)/, '') : c.t;
      if (side === 'r'){
        // 偶數頁（右頁）表名去除開頭的全形與半形空白，確保「畫」字完全靠左
        t = t.replace(/^[\s\u3000]+/, '');
      } else {
        // 奇數頁（左頁）表名去掉結尾空白，最後一個字才貼得到中縫。
        // 空白常被包在最後那個 <span> 裡，所以要允許後面還跟著收尾標籤。
        t = t.replace(/[\s\u3000]+(?=(?:<\/[^>]+>)*$)/, '');
      }
      const ta = S.titleAlign || 'seam';
      if (ta === 'center') s.style.textAlign = 'center';
      else if (ta === 'left') s.style.textAlign = 'left';
      else if (ta === 'right') s.style.textAlign = 'right';
      else {
        s.style.textAlign = side === 'r' ? 'left' : 'right';
      }
      if (!first && ci === lastText && !/（續）$/.test(plainOf(t))) t += '（續）';
      s.innerHTML = t;
      line.appendChild(s);
    });
    p.appendChild(line);
  });

  const tb = el('table'), cg = el('colgroup');
  colWidths(side).forEach(w => { const co = el('col'); co.style.width = w + '%'; cg.appendChild(co); });
  tb.appendChild(cg);

  const head = el('thead');
  D.head.forEach((r,k) => {
    const tr = el('tr'); tr.dataset.h = k;   // fitHead 要靠這個把 DOM 對回第幾列表頭
    r[side].forEach(c => {
      const span = c.rs || 1;
      tr.appendChild(cellEl('th', c, D.head.slice(k, k + span).reduce((s,x) => s + x.h, 0), null, side, null));
    });
    head.appendChild(tr);
  });
  tb.appendChild(head);

  const body = el('tbody');
  idx.forEach(i => {
    const tr = el('tr'); tr.dataset.i = i;
    if (i === sel) tr.className = 'sel';
    D.rows[i][side].forEach((c, ci) => {
      const key = i + '|' + side + '|' + ci;
      const edited = S.edits[key];
      const td = cellEl('td', withEdit(c, edited), rh(i), i, side, ci);
      const w = td.firstChild;
      w.dataset.key = key;
      // 每頁第一列跟表頭下邊線之間留一點空隙，字才不會貼著線。
      // 加在 td 的 padding 上（不動 S.h），這一頁的容量在 capOf 裡已經扣掉了。
      if (i === idx[0] && S.headGap) td.style.paddingTop = (S.headGap * S.k).toFixed(2) + 'pt';
      if (S.editing){ w.contentEditable = 'plaintext-only'; w.spellcheck = false; }
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });

  const fill = el('tr');
  ((D.rows[idx[0]] || D.rows[0])[side]).forEach(c => {
    const t = el('td', c.c.replace(' emptycell', ''));
    // 合併儲存格要帶著 colSpan，不然填空列涵蓋的欄數會比表格少，
    // 地線就會從某一欄開始斷掉（第一筆資料列有 A:E 這種橫向合併時特別明顯）。
    if (c.cs) t.colSpan = c.cs;
    if (c.rs) t.rowSpan = 1;   // 填空列只有一列高，不沿用原本的縱向合併
    // 末頁的地線平常是合計列的下框線畫的，所以填空列不重複畫。
    // 但有些檔案整份沒有粗下框線（認不出合計列，D.foot 是空的），這時末頁就沒人畫地線了，
    // 要由填空列補上，否則最後一頁會少一條線。
    if (!last || !D.foot.length) t.style.borderBottom = linePx();
    colBorder(t, c.col);
    fill.appendChild(t);
  });
  fill.style.height = '0';
  body.appendChild(fill);

  // 末頁的地線是合計列（foot 第一列）的下框線，粗細由原檔的 medium 決定，
  // 跟其他頁那條由 fill 列畫的地線是兩回事，所以要另外套「線粗」才會一致。
  // 合計與備註列：key 用 f<k> 開頭，跟資料列的數字索引分開，才不會撞在一起
  if (last) D.foot.forEach((r, k) => {
    const tr = el('tr'); tr.dataset.f = k;
    if (S.footGone && S.footGone[k] && !footHt(k)) tr.style.display = 'none';
    r[side].forEach((c, ci) => {
      const key = `f${k}|${side}|${ci}`;
      const edited = S.edits[key];
      const td = cellEl('td', withEdit(c, edited), footHt(k), null, side, null);
      const w = td.firstChild;
      w.dataset.key = key;
      // 合計／備註列：原檔的列高只當「最低高度」，格子自己隨內容長。
      // 這兩列的高度沒有 fit 可以重算，寫死高度＋overflow:hidden 就會把多出來的那行吃掉
      //（字還在，選得到也複製得到，就是看不見）。fitFoot 只負責把數字補回 S.footH，讓容量算得對。
      w.style.minHeight = w.style.height;
      w.style.height = 'auto';
      w.style.overflow = 'visible';
      // 這幾行是「跨頁重排」自己算好的：不要再讓瀏覽器自動折行，
      // 否則行尾為了避頭尾點多擠進來的那一兩個標點會被折到下一行去。
      if (/\n/.test(w.textContent || '')) w.style.whiteSpace = 'pre';
      // 備註左右對齊：寬度設成接排時用的可排寬（可能溢到右邊空格），text-align-last 讓每一行都撐滿
      const jw = S.noteJust && S.noteJust[key];
      if (jw){
        const cs = w.style;
        cs.whiteSpace = 'pre';   // 只有一行時上面不會設 pre，瀏覽器會把行尾一兩個字折下去
        cs.width = jw.w + 6 + 'px'; cs.textAlign = 'justify'; cs.textAlignLast = jw.last ? 'justify' : 'left';
      }
      if (S.editing){ w.contentEditable = 'plaintext-only'; w.spellcheck = false; }
      if (k === 0){
        td.style.borderBottom = linePx();
        // 合計列的列高是原檔給的，常常比字高很多。字若靠上，就會離地線（自己的下框線）很遠，
        // 所以這一列改成靠下對齊，字貼著地線走。
        w.classList.remove('vc');
        w.classList.add('vb');
      }
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });

  tb.appendChild(body);
  p.appendChild(tb);
  if (S.showPno){ const pn = el('div','pno'); pn.textContent = no; p.appendChild(pn); }
  p._fill = fill; p._tb = tb;
  return p;
}

/* ---- 復原 / 重做 ----
   每次 render 前比對 S 有沒有變，變了就把「上一個 S」推進堆疊。這樣所有改設定的地方
   （對齊、框線、列高、分頁、滑桿…）都自動被記錄，不用在每個事件裡插 snapshot。
   ponytail: 只記 S。拖曳換列會動到 D.rows 的順序，那個復原不回來——要的話得把列序也搬進 S。 */
let undoStack = [], redoStack = [], lastSnap = null, restoring = false;
function snapshot(){
  const s = JSON.stringify(S);
  if (lastSnap === null){ lastSnap = s; return; }
  if (s === lastSnap) return;
  if (!restoring){
    undoStack.push(lastSnap);
    if (undoStack.length > 100) undoStack.shift();
    redoStack.length = 0;
  }
  lastSnap = s;
}
function applyState(json){
  restoring = true;
  suppressAuto = true;      // 復原後不要馬上又自動重排，不然 ⌘Z 看起來像沒作用
  S = JSON.parse(json);
  lastSnap = json;
  bind(); render();
  suppressAuto = false;
  restoring = false;
  store.set(S);
  updateUndoBtns();
}
function undo(){
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(S));
  applyState(undoStack.pop());
}
function redo(){
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(S));
  applyState(redoStack.pop());
}
function updateUndoBtns(){
  $('bundo').disabled = !undoStack.length;
  $('bredo').disabled = !redoStack.length;
}

let headFitting = false;
// 表頭的高度是照抄 Excel 的，但瀏覽器斷行的位置跟 Excel 不一樣，常常多出一行。
// 表頭沒有列高可以調（工具列只調得到資料列與合計／備註），字被切掉就沒救，
// 所以載入後直接把它撐到內容需要的高度。只增不減——原本就夠高的檔案版面不會動。
let headFitKey = '';   // 量測快取鍵；換檔／換分欄／改範圍／重設時清成空字串（見 start）
function fitHead(){
  if (!D.head.length) return false;
  // 表頭的文字是固定的，要多少高度只受字型／字級／行距／縮放／欄寬影響。
  // 這幾個沒變就不必再量一次（每次 render 都量等於每次多一次全份重排）。
  // 分欄、列印範圍、表頭列數會整份換掉表頭，那些路徑直接清掉快取鍵。
  const key = [S.font, S.fs, S.lh, S.k, JSON.stringify(S.colWidths || null)].join('|');
  if (key === headFitKey) return false;
  headFitKey = key;
  // 表頭每一頁都一模一樣，量第一組對開就夠了（左右頁的欄位不同，兩邊都要量）。
  // 跟 fitMany 一樣分三段：先全部放開高度、再一次量完、再一次還原，中間不穿插寫入。
  // 一定要放開高度再量：這些格多半是垂直置中的 flex（.vc），被切掉時多出來的行
  // 會平均分到上下兩邊，scrollHeight 只算得到下面那一半（實測 66px，實際需要 73px）。
  const first = document.querySelector('.spread');
  if (!first) return false;
  const cells = [];
  D.head.forEach((r, k) => {
    first.querySelectorAll(`tr[data-h="${k}"]`).forEach(tr => {
      tr.querySelectorAll('.cw').forEach(w => {
        const th = w.closest('th');
        cells.push([k, w, w.style.height, (th && th.rowSpan) || 1]);
        w.style.height = 'auto';
      });
    });
  });
  const need = new Map();   // 單列格：列 index → 這一列單獨需要幾 px（左右頁取大）
  const spans = new Map();  // 跨列格：「起始列:跨幾列」→ 這一組最多需要幾 px
  cells.forEach(([k, w, , rs]) => {
    const px = w.scrollHeight;
    if (rs > 1){
      const g = k + ':' + rs;
      if (!(spans.get(g) >= px)) spans.set(g, px);
    } else if (!(need.get(k) >= px)) need.set(k, px);
  });
  cells.forEach(([, w, h]) => { w.style.height = h; });
  // 每一列的起點＝「原檔高度」與「這一列單列格需要的高度」取大者。
  // 這裡一定要把原檔高度算進去：跨列格的可用高度是它所涵蓋那幾列的總和，
  // 只從單列需求起算會把原本比較高的列算小，撐完仍然不夠（實測少 14px）。
  const req = D.head.map((r, k) => Math.max(r.h, need.has(k) ? need.get(k) / PT / S.k : 0));
  spans.forEach((px, g) => {
    const [k, rs] = g.split(':').map(Number);
    const end = Math.min(k + rs, D.head.length);
    if (end <= k) return;
    const needPt = px / PT / S.k;
    let havePt = 0;
    for (let i = k; i < end; i++) havePt += req[i];
    if (needPt <= havePt + 0.05) return;
    const share = (needPt - havePt) / (end - k);
    for (let i = k; i < end; i++) req[i] += share;
  });
  let changed = false;
  D.head.forEach((r, k) => {
    const pt = Math.ceil(req[k] * 10) / 10;
    if (pt > r.h + 0.05){ r.h = pt; changed = true; }
  });
  return changed;
}

let footFitting = false;
// 量合計／備註列真正需要的高度：合計列與手動填過 pt 的只長不縮，其餘備註列跟著內容走
function fitFoot(){
  if (!D.foot.length) return false;
  let changed = false;
  D.foot.forEach((_, k) => {
    let px = 0;
    document.querySelectorAll(`tr[data-f="${k}"] .cw`).forEach(w => {
      // min-height 是目前的列高，不拿掉就只量得到「現在多高」，量不出內容其實變短了
      const mh = w.style.minHeight; w.style.minHeight = '0';
      px = Math.max(px, w.getBoundingClientRect().height / S.zoom);
      w.style.minHeight = mh;
    });
    // 跨頁重排把整條備註排完、這列沒分到字：收成 0（手動填過 pt 的照舊）
    const empty = S.footGone && S.footGone[k] && !(S.footFixed && S.footFixed[k]);
    const need = empty ? 0 : Math.max(4, Math.ceil(px / PT / S.k * 10) / 10);
    // 合計／備註列的高度跟著內容走：長就撐開，刪掉字就縮回來。
    // 原檔的列高只是起點（常常是留了空行的 2 行高），不當地板；手動填過 pt 的才釘住。
    // k === 0 是合計列：字靠下貼著地線，高度是版面的一部分，不自動縮
    // 「備註用原檔列高」＝備註列也當地板（只長不縮），把作者在 Excel 留的行距原樣帶過來
    const fixed = !empty && (k === 0 || k > 0 && S.footKeep || (S.footFixed && S.footFixed[k]));
    if (fixed ? need > footHt(k) + 0.05 : Math.abs(need - footHt(k)) > 0.05){
      if (!S.footH) S.footH = D.foot.map(r => r.h);
      S.footH[k] = need;
      changed = true;
    }
  });
  return changed;
}

function render(){
  snapshot(); updateUndoBtns(); updateBtnStates();
  const docEl = $('doc'); docEl.innerHTML = '';
  const pg = pages();
  // 版面是「量 → 寫 → 量 → 寫」交替的話，每一次量都會讓瀏覽器把整份重排一次。
  // 所以拆成三段：先把 DOM 建好、量完每一頁的表格高度；再統一寫入（填空列高度、標籤、標尺）；
  // 最後才做只讀的檢查（落單標題、被切掉的格）。整份只重排兩次。
  const rows = pg.map((idx, n) => {
    const last = n === pg.length - 1;
    const sp = el('div','spread');
    const L = makePage(idx,'l',n*2+1,last,n===0), R = makePage(idx,'r',n*2+2,last,n===0);
    sp.append(L,R); docEl.appendChild(sp);
    return {idx, last, sp, L, R, target: (last ? endH() : S.sh) * MM};
  });
  // 全部建好之後才開始量，中間沒有寫入，所以整份只重排這一次
  rows.forEach(r => {
    // offsetHeight 是整數像素，會讓各頁地線差個 0.2mm；用 rect 的浮點高度（要除掉檢視縮放）
    const th = p => p._tb.getBoundingClientRect().height / S.zoom;
    // 左右頁各自算自己要撐多高。兩半的內容高度常常差個 1px（同一列在兩邊的換行不同），
    // 取兩者的最小值會讓矮的那半少撐那 1px、它的地線就跟隔壁頁差一線，所以不能共用一個值。
    r.slackL = r.target - th(r.L);
    r.slackR = r.target - th(r.R);
    // capOf 已經扣掉合計＋附註，這裡只算資料列，不然會重複計
    r.cap = capOf(r.last);
    r.used = r.idx.reduce((s,i) => s + rh(i), 0);
  });
  rows.forEach(({idx, sp, L, R, slackL, slackR, cap, used}) => {
    L._fill.style.height = Math.max(0, slackL) + 'px';
    R._fill.style.height = Math.max(0, slackR) + 'px';
    [L, R].forEach(p => { if (used > cap) p.classList.add('over-cap'); });
    // 累積高度貼在整組對開的上緣，不在紙上（才不會壓到每頁重複的表頭）；
    // 左右頁的數字本來就一模一樣，所以一組只放一個
    const b = el('div','badge');
    b.textContent = T('累積 ','Used ') + `${mmOf(used).toFixed(1)} / ${mmOf(cap).toFixed(1)}mm`
      + (used > cap ? T(` ・超出 ${mmOf(used-cap).toFixed(1)}mm`, ` · ${mmOf(used-cap).toFixed(1)}mm over`)
                    : T(` ・剩 ${mmOf(cap-used).toFixed(1)}mm`, ` · ${mmOf(cap-used).toFixed(1)}mm left`));
    if (used > cap) b.className = 'badge bad';
    sp.appendChild(b);
    if (S.breaks.includes(idx[0])){
      const m = el('div','mark');
      m.textContent = T('⛔ 手動分頁（點掉讓資料往前流）','⛔ Manual break — click to remove and let the rows flow up');
      m.onclick = () => { S.breaks = S.breaks.filter(v => v !== idx[0]); render(); };
      L.appendChild(m);
    }
  });
  // 標尺是量 offsetTop 畫出來的（只讀），先全部建好再一次掛上去，
  // 免得每掛一頁就讓下一頁的量測重排一次
  const guts = rows.map(({L, idx, last}) => buildGuides(L, idx, last));
  guts.forEach((g, k) => rows[k].sp.appendChild(g));
  // 還是落單的群組標題：不強制搬動，標出來讓人自己決定
  pg.slice(0, -1).forEach(idx => {
    const t = idx[idx.length-1];
    if (!badTail(t)) return;
    document.querySelectorAll(`tr[data-i="${t}"]`).forEach(tr => {
      tr.classList.add('orphan');
      tr.title = T('這一列是群組標題，內容在下一頁；要拉到下一頁就點它、按 B',
                   'This row is a group heading whose content is on the next page; select it and press B to move it there');
    });
  });
  // 先量完一輪再改 class：量與寫交錯的話，每一格都會讓整份重排一次（本檔 3000 多格）
  const over = [];
  document.querySelectorAll('.cw').forEach(w => {
    // 合計／備註列的高度是自己長出來的（fitFoot），行盒四捨五入常常讓 scrollHeight 比
    // clientHeight 多 1～3px，那不是被切掉、只是量測誤差；真的塞不下會由版面上緣的徽章講。
    const tol = w.closest('tr[data-f]') ? 4 : 1;
    if (w.scrollHeight <= w.clientHeight + tol) return;
    // 比一行還矮的列是原檔刻意留的間隔列，不算被切掉
    if (w.clientHeight < parseFloat(getComputedStyle(w).lineHeight)) return;
    over.push(w);
  });
  over.forEach(w => w.classList.add('over'));
  if (sel >= 0 && sel < D.rows.length) $('rh').value = S.h[sel];
  // 表頭的字被切掉時先撐高（它會吃掉每頁容量），再處理合計／備註。
  // 兩者都只增不減，所以最多各重畫一輪就收斂。
  if (!headFitting && fitHead()){
    headFitting = true; restoring = true;
    headPt = D.head.reduce((s,r) => s + r.h, 0);
    render();
    restoring = false; headFitting = false;
  }
  // 合計／備註列若被原檔的列高切到字（有內容但看不見），自動撐高再畫一次。
  // 只長不縮，所以最多重畫一輪就收斂。
  if (!footFitting && fitFoot()){
    footFitting = true; restoring = true;
    render();
    restoring = false; footFitting = false;
    $('footH').value = footHt(+$('footSel').value || 0);
  }
  // fitHead／fitFoot 觸發的那幾次重畫都是同一個動作的一部分（restoring），
  // 每次都寫 localStorage 等於一個動作存三次，存最後那一次就夠
  updateFootInfo();       // 備註列高是被 fitFoot 自動調過的，畫完才寫得準
  // 符合頁寬／符合頁高是量畫面上的 .spread 算出來的，所以要在畫完之後才算得準
  //（載入時 bind() 先跑、那時還沒有 .spread，算不到東西）。自訂模式不動使用者的縮放。
  if ((S.viewMode || 'fitH') !== 'manual') applyViewMode();
  // 自動跨頁重排：只在「會影響接排結果的東西」變了才做一次（版面指紋相同就跳過，
  // 拖列高那種一直重畫的操作不會每次重排）。重排自己會再 render 一次，指紋一樣就停。
  if (S.autoReflow !== false && !restoring && !suppressAuto && D && D.foot.length > 1){
    const sig = autoWrapSig();
    if (sig !== lastAutoWrap){ lastAutoWrap = sig; reflowFootNotes({ auto: true }); return; }
  }
  if (!restoring) store.set(S);
}

// 左側標尺：每列標出本頁資料列到這裡的累積高度，點一下 = 在這一列之後停。
// 只建好、不掛上畫面（見 render：要等所有讀取做完再一次 append）
function buildGuides(L, idx, last){
  const g = el('div','gut'), cap = capOf(last);
  let acc = 0;
  [...L.querySelectorAll('tr[data-i]')].forEach((tr,n) => {
    const i = +tr.dataset.i;
    acc += rh(i);
    if (tr.offsetHeight < 16 && n !== idx.length - 1) return;
    const lab = el('div','glab');
    lab.style.top = (tr.offsetTop + tr.offsetHeight) + 'px';
    lab.textContent = mmOf(acc).toFixed(0) + (n === idx.length - 1 ? T(' ▏滿',' ▏full') : '');
    if (n === idx.length - 1) lab.classList.add('full');
    if (S.breaks.includes(i + 1)) lab.classList.add('brk');
    lab.title = T(`本頁資料列累積 ${mmOf(acc).toFixed(1)}mm / 可放 ${mmOf(cap).toFixed(1)}mm（剩 ${mmOf(cap-acc).toFixed(1)}mm，表頭已扣掉）`,
                  `Data rows so far ${mmOf(acc).toFixed(1)}mm of ${mmOf(cap).toFixed(1)}mm (${mmOf(cap-acc).toFixed(1)}mm left, header already deducted)`)
              + T(`\n點一下 = ${S.breaks.includes(i+1) ? '取消在這裡停' : '就停在這一列'}`,
                  `\nClick = ${S.breaks.includes(i+1) ? 'stop breaking here' : 'break after this row'}`);
    lab.onclick = () => {
      const k = S.breaks.indexOf(i + 1);
      k < 0 ? S.breaks.push(i + 1) : S.breaks.splice(k, 1);
      S.breaks.sort((a,b) => a-b); render();
    };
    g.appendChild(lab);
  });
  return g;
}

function setVar(){
  const r = document.documentElement.style;
  r.setProperty('--lh', S.lh); r.setProperty('--fs', S.fs); r.setProperty('--zoom', S.zoom); r.setProperty('--k', S.k);
  if (S.font) r.setProperty('--user-font', S.font);
  else r.removeProperty('--user-font');
  $('gapv').textContent = (+S.gap).toFixed(1) + 'pt';
  $('lhv').textContent = (+S.lh).toFixed(2);
  $('fsv').textContent = Math.round(S.fs*100) + '%';
  $('kv').textContent = Math.round(S.k*1000)/10 + '%';
  // 天線是第一列表頭的上框線，粗細寫在 buildModel 產生的 class 裡，只能用 !important 蓋掉
  $('lineCss').textContent = S.borderPt != null
    ? `thead tr:first-child th{border-top:${+S.borderPt}pt solid #000!important}` : '';
}
function applyH(i){
  document.querySelectorAll(`tr[data-i="${i}"] .cw`).forEach(w => w.style.height = (rh(i)*S.k).toFixed(2) + 'pt');
}
function select(i){
  sel = i;
  document.querySelectorAll('tr.sel').forEach(t => t.classList.remove('sel'));
  document.querySelectorAll(`tr[data-i="${i}"]`).forEach(t => t.classList.add('sel'));
  $('rh').disabled = i < 0; $('rh').value = i < 0 ? '' : S.h[i];
  updateBtnStates();
}

// 對齊／框線按鈕的亮起狀態：列那組看選取列，欄那組看下拉選到的欄。
// 沒設過就全部不亮（＝沿用原檔），跟「無線」是不同狀態。
const BTN_STATE = [
  ['brb_',    {top:'t', bottom:'b', both:'both', none:'n'},                     () => sel >= 0 && (S.rowBorders || {})[sel]],
  ['bcol_',   {left:'l', center:'c', right:'r', distributed:'d', justify:'j'}, () => (S.colAligns || {})[+$('colAlignSelect').value]],
  ['bcb_',    {left:'l', right:'r', both:'both', none:'n'},                     () => (S.colBorders || {})[+$('colAlignSelect').value]]
];
function updateBtnStates(){
  if (!S) return;
  BTN_STATE.forEach(([prefix, map, get]) => {
    const on = get();
    Object.entries(map).forEach(([v, k]) => {
      const b = $(prefix + k);
      if (b) b.classList.toggle('active', on === v);
    });
  });
}
$('rh').onchange = e => { if (sel < 0) return;
  // 清空或打了非數字時 +value 是 NaN，Math.max(4, NaN) 還是 NaN，列高一變 NaN 整份版面就算不出來
  const v = parseFloat(e.target.value);
  if (!isFinite(v)){ e.target.value = S.h[sel]; return; }
  S.h[sel] = Math.max(4, v); applyH(sel); render(); };

// 量「這幾列的文字實際需要多高」。一次把要量的格子全部放開高度 → 一次全部量完 → 一次全部還原，
// 中間不穿插任何寫入，瀏覽器只要重排一次。原本一列一列「寫→讀→寫」會讓每一格都觸發一次重排，
// 本檔 191 列共 3000 多格，實測 360ms，批次之後少一個數量級。
function fitMany(list){
  const want = new Set(list), cells = [];
  document.querySelectorAll('tr[data-i]').forEach(tr => {
    if (!want.has(+tr.dataset.i)) return;
    tr.querySelectorAll('.cw').forEach(w => {
      cells.push([+tr.dataset.i, w, w.style.height]);
      w.style.height = 'auto';
    });
  });
  const need = new Map();
  cells.forEach(([i, w]) => { const px = w.scrollHeight; if (!(need.get(i) >= px)) need.set(i, px); });
  cells.forEach(([, w, h]) => { w.style.height = h; });
  // 左右頁同一列共用同一個值，所以取兩頁量到的最大值
  for (const i of want) S.h[i] = Math.max(4, Math.ceil((need.get(i) || 0) / PT / S.k * 10) / 10);
}
const fit = i => fitMany([i]);

let drag = null, colDrag = null, rowDrag = null;
const doc = $('doc');

// ---- 資料列換順序 ----
// S.h、S.edits、S.rowBorders、S.grew 都是「照位置」存的（第 n 個資料列），
// 換列只動 D.rows 的順序，這些設定一定要用同一組索引轉換跟著搬，
// 否則列高會留在原地、跑去套到別列。mapIdx＝舊索引 → 新索引，回 -1 代表這一列沒了。
function permuteState(s, mapIdx, mapBreak = mapIdx){
  if (Array.isArray(s.h)){
    const h = [];
    s.h.forEach((v, k) => { const n = mapIdx(k); if (n >= 0) h[n] = v; });
    s.h = h;
  }
  const remap = o => { if (!o) return o; const out = {};
    for (const k in o){ const n = mapIdx(+k); if (n >= 0) out[n] = o[k]; } return out; };
  s.rowBorders = remap(s.rowBorders);
  s.grew = remap(s.grew);
  if (s.edits){
    const out = {};
    for (const k in s.edits){
      const [ri, side, ci] = k.split('|');
      if (ri[0] === 'f'){ out[k] = s.edits[k]; continue; }   // 合計／備註列不跟著資料列搬
      const n = mapIdx(+ri);
      if (n >= 0) out[n + '|' + side + '|' + ci] = s.edits[k];
    }
    s.edits = out;
  }
  if (Array.isArray(s.breaks))
    s.breaks = [...new Set(s.breaks.map(mapBreak))].filter(b => b > 0 && b < s.h.length).sort((a,b) => a-b);
  return s;
}

// 復原堆疊裡存的是「當時的 S」，換列／刪列之後那些索引就過期了，要用同一組轉換一起改寫，
// 否則按 ⌘Z 會把列高還原成舊順序，高度就跑到別的列去（列序本身不在復原範圍內）。
function remapHistory(mapIdx, mapBreak, keepDeleted){
  const fix = j => { try {
    const s = permuteState(JSON.parse(j), mapIdx, mapBreak);
    // 刪掉的列在匯出時是「設成隱藏」，復原也不該讓它自己跑回來
    if (keepDeleted) s.deletedRowNums = [...new Set([...(s.deletedRowNums || []), keepDeleted])];
    return JSON.stringify(s);
  } catch(e){ return j; } };   // 堆疊裡有解析不了的東西就原樣留著，不要整份壞掉
  undoStack = undoStack.map(fix);
  redoStack = redoStack.map(fix);
  lastSnap = null;   // 這一步不進復原堆疊（列序本來就復原不回來），免得按了卻沒反應
}

function moveRow(from, to, pos){
  if (from == null || to == null) return;
  let target = pos === 'after' ? to + 1 : to;
  if (from < target) target--;
  if (from === target) return;

  const [row] = D.rows.splice(from, 1);
  D.rows.splice(target, 0, row);

  const [rn] = D.rowNums.splice(from, 1);
  D.rowNums.splice(target, 0, rn);

  if (dflt && dflt.h){
    const [dh] = dflt.h.splice(from, 1);
    dflt.h.splice(target, 0, dh);
  }

  const mapIdx = k => k === from ? target
                 : (from < target && k > from && k <= target) ? k - 1
                 : (from > target && k >= target && k < from) ? k + 1 : k;
  permuteState(S, mapIdx);
  S.grew = {};   // ponytail: 換列後對不回去，直接放掉；代價只是這些列不能自動縮回
  remapHistory(mapIdx);

  if (sel === from) sel = target;
  else if (from < target && sel > from && sel <= target) sel--;
  else if (from > target && sel >= target && sel < from) sel++;

  render();
  select(sel);
}

// ---- 刪除資料列 ----
// 刪掉的列號記在 S.deletedRowNums，匯出 xlsx 時把原檔那幾列設成隱藏
// （不真的刪列，公式與參照才不會整份跑掉）。
// ponytail: 跟拖曳換列一樣動到 D.rows，⌘Z 復原不回來，所以按鈕要先問一次。
function deleteRow(i){
  if (i < 0 || i >= D.rows.length || D.rows.length <= 1) return;

  D.rows.splice(i, 1);
  const [rn] = D.rowNums.splice(i, 1);
  if (dflt && dflt.h) dflt.h.splice(i, 1);

  // 索引大於被刪那列的往前補一格，等於的直接丟掉（列高、編輯內容、框線都一樣）；
  // 復原堆疊也比照辦理，才不會留下「比現在多一列」的舊設定——長度一錯，列高會整排位移。
  const mapIdx = k => k === i ? -1 : k > i ? k - 1 : k;
  // 分頁點落在被刪那列時不丟掉：後面那列遞補到同一個索引，分頁邊界就保住了
  const mapBreak = b => b > i ? b - 1 : b;
  permuteState(S, mapIdx, mapBreak);
  remapHistory(mapIdx, mapBreak, rn);

  (S.deletedRowNums = S.deletedRowNums || []).push(rn);

  render();
  select(Math.min(i, D.rows.length - 1));
  store.set(S);
}

// ---- 欄寬拖曳 ----
function colWidths(side){
  // 欄寬是一欄一個百分比，數量必須跟目前的欄數一致。
  // 匯入別的檔案／別的分欄位置存下來的設定時長度會不同，
  // colgroup 的 <col> 數量一少，欄寬就整排錯位（看起來就是跑版）。
  const w = S.colWidths && S.colWidths[side];
  return (Array.isArray(w) && w.length === D.cols[side].length) ? w : D.cols[side];
}
function findColEdge(e){
  const page = e.target.closest('.page');
  if (!page || !page._tb) return null;
  const thead = page._tb.querySelector('thead');
  if (!thead) return null;
  const r = thead.getBoundingClientRect();
  if (e.clientY < r.top || e.clientY > r.bottom) return null;
  const side = page.dataset.side;
  const widths = colWidths(side);
  const tr = page._tb.getBoundingClientRect();
  let cumX = tr.left;
  for (let i = 0; i < widths.length - 1; i++){
    cumX += widths[i] / 100 * tr.width;
    if (Math.abs(e.clientX - cumX) < 4)   // 螢幕像素固定 4px：乘上 S.zoom 會讓縮小檢視時幾乎抓不到
      return {side, col: i, tableW: tr.width};
  }
  return null;
}

doc.addEventListener('pointermove', e => {
  if (colDrag){
    const dp = (e.clientX - colDrag.startX) / colDrag.tableW * 100;
    const nw = colDrag.origWidths.slice();
    const a = colDrag.origWidths[colDrag.col] + dp;
    const b = colDrag.origWidths[colDrag.col + 1] - dp;
    if (a < 1 || b < 1) return;
    nw[colDrag.col] = a; nw[colDrag.col + 1] = b;
    if (!S.colWidths) S.colWidths = {};
    S.colWidths[colDrag.side] = nw;
    document.querySelectorAll(`.page[data-side="${colDrag.side}"] table colgroup`).forEach(cg => {
      [...cg.children].forEach((c, i) => { c.style.width = nw[i] + '%'; });
    });
    return;
  }
  if (drag){
    S.h[drag.i] = Math.max(4, Math.round((drag.h0 + (e.clientY - drag.y) / S.zoom / PT / S.k) * 10) / 10);
    applyH(drag.i); return;
  }
  if (rowDrag){
    if (!rowDrag.active){
      if (Math.hypot(e.clientX - rowDrag.startX, e.clientY - rowDrag.startY) > 6){
        rowDrag.active = true;
        document.body.classList.add('row-dragging');
        document.querySelectorAll(`tr[data-i="${rowDrag.startI}"]`).forEach(tr => tr.classList.add('dragging'));
      }
    }
    if (rowDrag.active){
      document.querySelectorAll('tr.drag-target-before, tr.drag-target-after').forEach(t => {
        t.classList.remove('drag-target-before', 'drag-target-after');
      });
      const target = findDropTarget(e);
      if (target){
        rowDrag.targetI = target.targetI;
        rowDrag.pos = target.pos;
        document.querySelectorAll(`tr[data-i="${target.targetI}"]`).forEach(t => {
          t.classList.add(target.pos === 'before' ? 'drag-target-before' : 'drag-target-after');
        });
      } else {
        rowDrag.targetI = null;
      }
      return;
    }
  }
  const ce = findColEdge(e);
  if (ce){ doc.style.cursor = 'col-resize'; return; }
  const tr = e.target.closest('tr[data-i]');
  doc.style.cursor = tr && (tr.getBoundingClientRect().bottom - e.clientY) < 5 ? 'row-resize' : '';
});

// 跨頁拖曳目標偵測：即使拖到目標頁的表頭或頁尾填空區，也能精確識別
function findDropTarget(e){
  const elements = document.elementsFromPoint(e.clientX, e.clientY);
  for (const el of elements){
    const tr = el.closest && el.closest('tr[data-i]');
    if (tr){
      const targetI = +tr.dataset.i;
      const rect = tr.getBoundingClientRect();
      const pos = (e.clientY - rect.top) < (rect.height / 2) ? 'before' : 'after';
      return { targetI, pos };
    }
  }
  for (const el of elements){
    const page = el.closest && el.closest('.page');
    if (page){
      const trs = [...page.querySelectorAll('tr[data-i]')];
      if (trs.length){
        const firstR = trs[0].getBoundingClientRect();
        if (e.clientY < firstR.bottom){
          return { targetI: +trs[0].dataset.i, pos: 'before' };
        } else {
          return { targetI: +trs[trs.length-1].dataset.i, pos: 'after' };
        }
      }
    }
  }
  return null;
}
doc.addEventListener('pointerdown', e => {
  const ce = findColEdge(e);
  if (ce){
    colDrag = {side: ce.side, col: ce.col, startX: e.clientX,
              origWidths: colWidths(ce.side).slice(), tableW: ce.tableW};
    e.preventDefault(); doc.setPointerCapture(e.pointerId);
    return;
  }
  const tr = e.target.closest('tr[data-i]'); if (!tr) return;
  const i = +tr.dataset.i; select(i);
  if ((tr.getBoundingClientRect().bottom - e.clientY) < 5){
    drag = {i, y: e.clientY, h0: S.h[i]};
    e.preventDefault(); doc.setPointerCapture(e.pointerId);
  } else if (!S.editing){
    rowDrag = {startI: i, startX: e.clientX, startY: e.clientY, active: false, targetI: null, pos: null};
    doc.setPointerCapture(e.pointerId);
  }
});

// 改完（離開該格）才存檔重排，才不會邊打字邊跳掉游標
// 編輯 key 有兩種：資料列是 "3|l|0"，合計／備註列是 "f0|l|0"。
// 這支把 key 解回「是哪一格、對應原檔第幾列」，commitEdit 與匯出都用它。
function cellOfKey(key){
  const [ri, side, ci] = key.split('|');
  if (ri[0] === 'f'){
    const k = +ri.slice(1), row = D.foot[k];
    return row && {cell: row[side][+ci], rowNum: D.footNums[k], foot: true};
  }
  const row = D.rows[+ri];
  return row && {cell: row[side][+ci], rowNum: D.rowNums[+ri], i: +ri, foot: false};
}

function commitEdit(w){
  if (!w || !w.dataset.key) return false;
  const key = w.dataset.key, txt = w.innerText.replace(/\u00a0/g, ' ').replace(/\n$/, '');
  const ref = cellOfKey(key);
  if (!ref || !ref.cell) return false;
  const 原文 = (ref.cell.t || '').replace(/<[^>]*>/g, '')
                 .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
  const 變了 = txt !== (S.edits[key] != null ? S.edits[key] : 原文);
  if (txt === 原文) delete S.edits[key]; else S.edits[key] = txt;
  // 改的是備註格：把兩半交錯接回段落本文，之後的自動／手動接排才是從正確的本文算起
  if (key[0] === 'f' && D.foot.length > 1) syncNotePara(+key.slice(1).split('|')[0]);
  // 改字不動列高：只有在改長到裝不下時才往上撐，絕不把手動調好的高度壓回最小值。
  // （合計／備註列的高度不歸 S.h 管，它們用 min-height 自己長）
  if (變了){
    if (!ref.foot){
      const keep = S.h[ref.i];
      fit(ref.i);
      if (!S.grew) S.grew = {};
      if (S.h[ref.i] > keep){
        // 撐高了：記住撐高前的高度，之後刪字才知道可以退到哪裡
        if (S.grew[ref.i] == null) S.grew[ref.i] = keep;
      } else {
        // 內容變短：只有先前被字撐高過的列可以縮，且不低於當初手動調好的高度
        S.h[ref.i] = Math.max(S.h[ref.i], S.grew[ref.i] != null ? S.grew[ref.i] : keep);
        if (S.grew[ref.i] != null && S.h[ref.i] <= S.grew[ref.i] + 0.05) delete S.grew[ref.i];
      }
    }
    render();
  }
  return 變了;
}

/* ============================ 驗算 ============================
   用畫面上的數字重新核對階層加總（不看原檔公式，所以編輯過也有效）：
     總計 = Σ 主管 → 主管 = Σ 基金／公司 → 基金 = Σ 大分類 → 大分類 = Σ 各計畫
   層級不寫死欄位或字串，改用「標籤所在欄 + Excel 縮排」排序，
   非營業特種基金（靠縮排）與國營事業（靠欄位位置）兩種表別都認得出來。
   已用兩份實際檔案驗證：所有層級、所有金額欄零誤差、零誤報。 */
const txtOf = c => (c && c.t || '').replace(/<[^>]*>/g, '')
  .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').trim();
const numText = t => {
  const v = String(t == null ? '' : t).replace(/,/g, '').trim();
  return v !== '' && isFinite(v) ? +v : null;
};
const numOf = c => numText(txtOf(c));

function audit(){
  if (!D || !D.rows.length){ alert(T('先載入檔案','Load a file first')); return; }
  if (!D.foot.length){ alert(T('找不到總計／合計列，無法比對。\n可用「表頭到 N 列」與「範圍」確認表格結構。',
    'No grand-total row found, so there is nothing to check against.\nUse "Header ends at row N" and "Range" to confirm the table structure.')); return; }

  // 一定要走 S.edits，否則使用者在畫面上改過的數字驗算會看不到（讀 c.t 只是原檔內容）。
  // key 的規則跟 render／匯出一致：資料列是「列索引|side|欄索引」，合計備註列是「f<k>|side|欄索引」。
  const all = (row, rk) => [
    ...(row.l || []).map((c, ci) => ({c, col: c.col, key: `${rk}|l|${ci}`})),
    ...(row.r || []).map((c, ci) => ({c, col: c.col, key: `${rk}|r|${ci}`}))
  ];
  const text = o => { const e = S.edits[o.key]; return e != null ? String(e).trim() : txtOf(o.c); };
  const numb = o => numText(text(o));
  const rowKey = new Map();
  D.rows.forEach((r, i) => rowKey.set(r, i));
  D.foot.forEach((r, k) => rowKey.set(r, 'f' + k));
  const cellsOf = row => all(row, rowKey.get(row));

  const total = D.foot[0];

  // 百分比欄不能加總，從表頭文字認出來排除
  const pct = new Set();
  D.head.forEach(r => (r.l || []).concat(r.r || []).forEach(c => {
    if (/[%％]/.test(txtOf(c))) for (let k = 0; k < (c.cs || 1); k++) pct.add(c.col + k);
  }));
  const cols = cellsOf(total).filter(o => numb(o) !== null && !pct.has(o.col)).map(o => o.col);
  if (!cols.length){ alert(T('總計列裡找不到可比對的金額欄。','No amount columns to compare were found in the totals row.')); return; }

  const at = (row, col) => cellsOf(row).find(o => o.col === col);
  const val = (row, col) => { const o = at(row, col); return o ? (numb(o) || 0) : 0; };
  const sum = (rows, col) => rows.reduce((a, r) => a + val(r, col), 0);

  // 只看有金額的列。國營事業那份在資料中間夾了 9 組重複表頭，沒有金額，會打亂區塊
  const rows = D.rows.filter(r => cols.some(col => { const o = at(r, col); return o && numb(o) !== null; }));
  // 標籤 = 左半第一個「有字且不是數字」的格子。
  // 沒有標籤但有金額的列＝個別計畫（原檔省略了項目符號或名稱欄留白），一律當成最深一層。
  // 這條規則在兩份實際檔案上都驗過：套用後所有層級 100% 相符，不再需要跳過任何區塊。
  const info = rows.map(r => {
    const lc = all(r, rowKey.get(r)).filter(o => (r.l || []).includes(o.c))
                 .find(o => text(o) && numb(o) === null);
    return {row: r, label: lc ? text(lc).replace(/[\s　]/g, '') : '', key: lc ? (lc.col * 1000 + (lc.c.ind || 0)) : null};   // 1000 進位，縮排再深也不會跟下一欄相撞
  });
  const keys = [...new Set(info.filter(i => i.key != null).map(i => i.key))].sort((a,b) => a-b);
  if (!keys.length){ alert(T('找不到可判斷階層的資料列。','No data rows with a recognizable hierarchy were found.')); return; }
  info.forEach(i => i.lv = i.key == null ? keys.length - 1 : keys.indexOf(i.key));

  const fmt = n => (Math.round(n * 100) / 100).toLocaleString();
  const out = []; let fail = 0, done = 0;
  const NAME = T(['主管', '基金（公司）', '大分類', '子分類', '細項'],
                 ['agency', 'fund (company)', 'major category', 'subcategory', 'line item']);

  // 總計 = Σ 第 0 層
  const lv0 = info.filter(i => i.lv === 0).map(i => i.row);
  let bad0 = 0;
  cols.forEach(col => {
    done++;
    const d = sum(lv0, col) - val(total, col);
    if (Math.abs(d) > 0.5){ fail++; bad0++;
      out.push(T(`✗ 總計 ${colName(col)} 欄：各${NAME[0]}加總 ${fmt(sum(lv0,col))}、總計列 ${fmt(val(total,col))}，差 ${fmt(d)}`,
                 `✗ Grand total, column ${colName(col)}: ${NAME[0]} rows add up to ${fmt(sum(lv0,col))}, total row says ${fmt(val(total,col))}, off by ${fmt(d)}`)); }
  });
  if (!bad0) out.push(T(`✓ 總計 = ${lv0.length} 個${NAME[0]}之和（${cols.length} 個金額欄全部相符）`,
                        `✓ Grand total = sum of ${lv0.length} ${NAME[0]} rows (all ${cols.length} amount columns match)`));

  // 每一層 = Σ 下一層
  for (let L = 0; L < keys.length - 1; L++){
    const par = info.map((it,k) => ({it,k})).filter(o => o.it.lv === L);
    let bad = 0, checked = 0, nokid = 0;
    par.forEach((p, j) => {
      const end = j + 1 < par.length ? par[j+1].k : info.length;
      const blk = info.slice(p.k + 1, end);
      const kids = blk.filter(i => i.lv === L + 1).map(i => i.row);
      if (!kids.length){ nokid++; return; }   // 底下沒有恰好下一層的項目，這組沒被檢查
      cols.forEach(col => {
        checked++; done++;
        const d = sum(kids, col) - val(p.it.row, col);
        if (Math.abs(d) > 0.5){
          bad++; fail++;
          if (bad <= 4) out.push(T(`✗ 「${p.it.label}」${colName(col)} 欄：下層加總 ${fmt(sum(kids,col))}、本列 ${fmt(val(p.it.row,col))}，差 ${fmt(d)}`,
            `✗ "${p.it.label}", column ${colName(col)}: children add up to ${fmt(sum(kids,col))}, this row says ${fmt(val(p.it.row,col))}, off by ${fmt(d)}`));
        }
      });
    });
    const lvl = n => NAME[n] || T('第'+n+'層', 'level ' + n);
    const nm = `${lvl(L)} = Σ ${lvl(L+1)}`;
    if (checked && !bad) out.push(T(`✓ ${nm}（${par.length - nokid} 組、${checked} 個欄位全部相符）`,
                                    `✓ ${nm} (${par.length - nokid} groups, ${checked} cells, all match)`)
      + (nokid ? T(`，另 ${nokid} 組底下沒有下一層、未檢查`, ` — ${nokid} more groups have no child level and were not checked`) : ''));
    else if (bad > 4) out.push(T(`  …「${nm}」另有 ${bad - 4} 項未列出`, `  …${bad - 4} more "${nm}" mismatches not listed`));
    else if (!checked) out.push(T(`－ ${nm}：找不到可比對的層級`, `– ${nm}: no comparable level found`));
  }

  // ---- 交叉檢查：比照原檔 sumif 檢誤的作法，不看階層、改用標籤字樣加總。
  // 階層判斷若出錯（縮排跑掉、列被搬到別層），這裡會抓到；兩者互為驗證。
  // 只留在兩種表別都成立的兩條，「Σ含基金」「分年性+一次性」等只對單一表別成立的不納入。
  const hit = re => info.filter(i => re.test(i.label));
  const cross = [
    [T('各「◯◯主管」加總','Sum of the agency rows'), [/主管$/]],
    [T('計畫別合計（一般建築及設備＋繼續＋新興）','Sum by project type (general construction & equipment + continuing + new)'),
     [/一般建築及設備計畫$/, /繼續計畫$/, /新興計畫$/]]
  ];
  cross.forEach(([nm, res]) => {
    const rs = res.flatMap(re => hit(re));
    if (!rs.length){ out.push(T(`－ ${nm}：找不到符合的列，未檢查`, `– ${nm}: no matching rows, not checked`)); return; }
    let bad = 0;
    cols.forEach(col => {
      done++;
      const d = sum(rs.map(i => i.row), col) - val(total, col);
      if (Math.abs(d) > 0.5){
        bad++; fail++;
        if (bad <= 3) out.push(T(`✗ ${nm} ${colName(col)} 欄：加總 ${fmt(sum(rs.map(i=>i.row),col))}、總計列 ${fmt(val(total,col))}，差 ${fmt(d)}`,
          `✗ ${nm}, column ${colName(col)}: adds up to ${fmt(sum(rs.map(i=>i.row),col))}, total row says ${fmt(val(total,col))}, off by ${fmt(d)}`));
      }
    });
    if (!bad) out.push(T(`✓ ${nm} = 總計（${rs.length} 列、${cols.length} 個金額欄全部相符）`,
                         `✓ ${nm} = grand total (${rs.length} rows, all ${cols.length} amount columns match)`));
  });

  const title = fail ? T(`⚠ ${fail} 項不符（共檢查 ${done} 項）`, `⚠ ${fail} mismatches out of ${done} checks`)
                     : T(`✅ 全部通過（共檢查 ${done} 項）`, `✅ All ${done} checks passed`);
  const html = out.map(s => {
    const cls = s.startsWith('✗') ? 'bad' : s.startsWith('✓') ? 'good' : '';
    return `<div class="${cls}">${esc(s)}</div>`;
  }).join('')
    + `<div class="muted">` + T('比對欄位：','Columns compared: ') + cols.map(colName).join(T('、',', '))
    + (pct.size ? T('<br>已排除百分比欄：','<br>Percentage columns skipped: ') + [...pct].sort((a,b)=>a-b).map(colName).join(T('、',', ')) : '')
    + `</div>`;
  showPanel(title, html, {html:true});
}

// 驗算：原檔常在列印範圍外放一區 sumif 檢誤，用「…差異…」當標籤、值應為 0。
// 這裡讀的是 Excel 存檔時算好的快取值——本工具不重算公式，改過內容要回 Excel 重算。
$('bcheck').onclick = audit;
$('bcheck2').onclick = () => {
  if (!RAW){ alert(T('先載入檔案','Load a file first')); return; }
  const textOf = ref => {
    const cv = RAW.cells[ref];
    if (!cv) return '';
    if (cv.t === 's') return (RAW.shared[+cv.v] || []).map(x => x.t).join('');
    if (cv.is) return cv.is.map(x => x.t).join('');
    return cv.v == null ? '' : String(cv.v);
  };
  const byRow = {};
  for (const ref in RAW.cells) (byRow[rowNum(ref)] = byRow[rowNum(ref)] || []).push(ref);

  const lines = [];
  let checked = 0, bad = 0;
  Object.keys(byRow).map(Number).sort((a,b) => a-b).forEach(r => {
    const refs = byRow[r].slice().sort((a,b) => colNum(a) - colNum(b));
    const label = (refs.map(textOf).find(t => t.trim() && isNaN(t)) || '').trim();
    if (!/差異/.test(label)) return;
    checked++;
    const off = refs.filter(ref => { const v = textOf(ref); return v !== '' && !isNaN(v) && +v !== 0; })
                    .map(ref => `${ref}=${(+textOf(ref)).toLocaleString()}`);
    if (off.length){ bad++; lines.push(T(`✗ 第 ${r} 列「${label}」 → ${off.join('、')}`,
                                          `✗ Row ${r} "${label}" → ${off.join(', ')}`)); }
    else lines.push(T(`✓ 第 ${r} 列「${label}」 全部為 0`, `✓ Row ${r} "${label}" — all zero`));
  });

  if (!checked){ alert(T('原檔裡找不到標籤含「差異」的驗算列。\n（這類檢誤區通常放在列印範圍下方）',
    'No check rows labelled with 差異 (variance) were found in the source file.\n(That block usually sits below the print area.)')); return; }
  const title = bad ? T(`⚠ ${bad} / ${checked} 項不符`, `⚠ ${bad} of ${checked} checks failed`)
                    : T(`✅ ${checked} 項全部通過`, `✅ All ${checked} checks passed`);
  const html = lines.map(s => {
    const cls = s.startsWith('✗') ? 'bad' : s.startsWith('✓') ? 'good' : '';
    return `<div class="${cls}">${esc(s)}</div>`;
  }).join('') + `<div class="muted">` + T('註：顯示的是 Excel 存檔時算好的值，本工具不重算公式。',
    'Note: these are the values Excel cached on save — this tool does not recalculate formulas.') + `</div>`;
  showPanel(title, html, {html:true});
};

$('bload').onclick = () => {
  const f = el('input'); f.type = 'file'; f.accept = '.json';
  f.onchange = () => f.files[0].text().then(t => {
    let v;
    try { v = JSON.parse(t); } catch (e){ alert(T('這不是有效的設定檔（JSON 解析失敗）','Not a valid settings file (the JSON could not be parsed)')); return; }
    const next = Object.assign({}, dflt, v);

    // S.h 是「第 n 個資料列的高度」，靠陣列位置對應。設定檔如果是從別的檔案、
    // 別的列印範圍或別的表頭列數存下來的，資料列數就不一樣，直接套上去會整份錯位。
    if (!Array.isArray(next.h) || next.h.length !== D.rows.length){
      const had = Array.isArray(v.h) ? v.h.length : T('未知','an unknown number of');
      if (!confirm(T(`設定檔記錄了 ${had} 個資料列，目前的表格有 ${D.rows.length} 個。\n\n`
                 + '列高與分頁會對不起來（通常是範圍或「表頭到 N 列」跟當初不同）。\n\n'
                 + '按「確定」＝放棄設定檔裡的列高、分頁與編輯，只套用字型、縮放等全域設定；\n'
                 + '按「取消」＝不匯入。',
                 `The settings file records ${had} data rows; this table has ${D.rows.length}.\n\n`
                 + 'Row heights and page breaks would not line up — usually the range or "Header ends at row N" differs from when it was saved.\n\n'
                 + 'OK = discard the row heights, breaks and cell edits in the file and apply only the global settings (font, scaling, and so on).\n'
                 + 'Cancel = do not import.'))) return;
      next.h = dflt.h.slice();
      next.breaks = dflt.breaks.slice();
      next.edits = {};
      next.rowBorders = {};
    }
    // 合計／備註列數也可能不同
    if (!Array.isArray(next.footH) || next.footH.length !== D.foot.length) next.footH = D.foot.map(r => r.h);
    // 欄寬的長度要對得上目前的分欄位置，否則整排欄位錯開
    const okW = w => Array.isArray(w && w.l) && Array.isArray(w.r)
                     && w.l.length === D.cols.l.length && w.r.length === D.cols.r.length;
    if (next.colWidths && !okW(next.colWidths)) next.colWidths = null;
    // 分頁點必須落在有效範圍內
    next.breaks = [...new Set((next.breaks || []).filter(i => i > 0 && i < D.rows.length))].sort((a,b) => a-b);

    undoStack = []; redoStack = []; lastSnap = null;   // 換了一整組設定，復原歷史重來

};

  document.body.classList.toggle('hide-mixalign', S.showMix === false);
  $('showempty').checked = S.showEmpty !== false;
  document.body.classList.toggle('hide-empty', S.showEmpty === false);
  document.body.classList.toggle('editing', !!S.editing);
  $('linkend').checked = S.linkEnd;
  $('shend').disabled = S.linkEnd;
  $('shend').value = endH();
  if (!S.viewMode) S.viewMode = 'fitH';
  $('fontFam').value = S.font || '';
  $('titleAlign').value = S.titleAlign || 'seam';
  $('bpt').value = linePt();
  $('hgap').value = S.headGap || 0;
  $('oneh').value = S.oneLineH != null ? S.oneLineH : 20;
  $('mgap').value = S.multiGap != null ? S.multiGap : 16;
  $('pdftext').checked = !!S.pdfText;
  $('footKeep').checked = !!S.footKeep;
  $('autoReflow').checked = S.autoReflow !== false;
  if ($('wrapInfo')) $('wrapInfo').textContent = '';   // 上一次的重排訊息不带到下一份檔
  $('hdrLast').value = D.hdrLast;
  $('parea').value = D.area;
  if (D.foot.length > 1){
    // 計畫的欄位或段落來源的取法改過就整批重建（v3：多了溢出寬度＋丟掉我們自己排的換行），
    // 不然舊的計畫／舊的換行會被當成作者的內容沿用下去
    if (S.notePlanV !== 5){ S.notePlan = null; S.notePlanV = 5; }
    S.notePlan || (S.notePlan = {});
    D.foot.forEach((_, k) => { if (k) noteParaPlan(k); });   // 段落本文先建好，render 途中才不會改到 S
  }
  populateFootSelect();
  populateColAlignSelect();
  setVar();
  applyViewMode(); updateViewBtn();
}
const redraw = () => { clearTimeout(window._r); window._r = setTimeout(render, 150); };
$('k').oninput  = e => { S.k = +e.target.value; setVar(); redraw(); };
$('gap').oninput = e => { S.gap = +e.target.value; setVar(); redraw(); };
$('lh').oninput = e => { S.lh = +e.target.value; setVar(); redraw(); };
$('fs').oninput = e => { S.fs = +e.target.value; setVar(); redraw(); };
$('sh').onchange = e => { S.sh = +e.target.value; bind(); render(); };
$('shend').onchange = e => { S.shend = +e.target.value; render(); };
$('linkend').onchange = e => { S.linkEnd = e.target.checked; bind(); render(); };
$('zm').oninput = e => { S.zoom = +e.target.value; S.viewMode = 'manual'; setVar(); applyViewMode(); updateViewBtn(); };

// ---- 檢視模式：符合頁寬／符合頁高／自訂 ----
// 直接量「這一組對開」實際佔掉的畫面（.spread 的框＋#doc 的 padding），再照比例換算縮放。
// 不寫死 12／58／40 那幾個數字——CSS 改了（標尺寬度、裝訂縫、padding）量到的值會自己跟上。
// 量到的尺寸已經含目前的縮放，所以換算是「目前縮放 × 可用空間／現在佔用」。
function fitTarget(mode){
  const d = $('doc'), sp = d.querySelector('.spread');
  if (!D || !sp) return null;
  const cur = +(parseFloat(getComputedStyle(d).getPropertyValue('--zoom')) || S.zoom || 1);
  const sr = sp.getBoundingClientRect();
  const cs = getComputedStyle(d);
  const padW = (parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight)) * cur;
  const padH = (parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom)) * cur;
  const needW = sr.width + padW, needH = sr.height + padH;      // 這一版在畫面上佔的寬／高
  // 可用空間：視窗扣掉工具列與側欄。clientWidth 已經扣掉直向捲軸
  const availW = document.documentElement.clientWidth - ($('side')?.offsetWidth || 0);
  const availH = window.innerHeight - ($('bar')?.offsetHeight || 40);
  if (needW < 40 || needH < 40 || availW < 80 || availH < 80) return null;
  const raw = cur * (mode === 'fitW' ? availW / needW : availH / needH);
  return { zoom: Math.max(.3, Math.min(1.5, raw)), needW, availW, cur };
}
function applyViewMode(){
  const mode = S.viewMode || 'fitH';
  const d = $('doc');
  if (mode === 'manual'){
    // 自訂＝滑桿自己拉的：把置中留白還原，文件貼著檢視區左緣，橫向捲動才可預期
    d.classList.remove('fit-center');
    d.style.marginLeft = '';
    return;
  }
  const f = fitTarget(mode);
  if (!f) return;
  S.zoom = +f.zoom.toFixed(4);
  d.classList.add('fit-center');
  $('zm').value = S.zoom;
  setVar();
  // 置中用「縮放後」的可見寬自己算，不能用 margin:auto——
  // transform:scale 不會改版面盒，margin:auto 是在未縮放的大盒子裡置中，算出來會偏掉
  const sp = d.querySelector('.spread');
  if (sp){
    const cs = getComputedStyle(d);
    const visW = sp.getBoundingClientRect().width + (parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight)) * S.zoom;
    d.style.marginLeft = Math.max(0, Math.round((f.availW - visW) / 2)) + 'px';
  }
}
function updateViewBtn(){
  const mode = S.viewMode || 'fitH';
  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('active', b.dataset.vm === mode));
}
document.querySelectorAll('#viewSeg button').forEach(b => b.onclick = () => {
  // 已經是這一種時再按一次＝照現在的視窗重算（縮放過或改過版面之後很方便）
  S.viewMode = b.dataset.vm;
  applyViewMode(); updateViewBtn(); store.set(S);
});
window.addEventListener('resize', () => {
  if (S && (S.viewMode || 'fitH') !== 'manual') applyViewMode();
});

$('blang').onclick = $('blang2').onclick = ev => {
  ev.stopPropagation();          // 首頁那顆在拖曳區裡，點它不要順便開檔案對話框
  LANG = LANG === 'en' ? 'zh' : 'en';
  try { localStorage.setItem(LANG_KEY, LANG); } catch(e){}
  applyLang(); dynLabels();
};
applyLang(); dynLabels();
