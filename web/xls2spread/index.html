<script>
/* ============================ 讀 xlsx ============================ */
/* ponytail: 用瀏覽器內建的 DecompressionStream 解 zip、DOMParser 解 XML，不帶任何函式庫。
   只處理一般 xlsx（非 zip64、非加密）；真的遇到再換 SheetJS。 */

async function unzip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eo = -1;
  for (let i = u8.length - 22; i >= 0 && i > u8.length - 65558; i--)
    if (dv.getUint32(i, true) === 0x06054b50){ eo = i; break; }
  if (eo < 0) throw new Error(T('這不是有效的 xlsx（找不到 zip 結構）','Not a valid xlsx (no zip structure found)'));
  const n = dv.getUint16(eo + 10, true);
  let p = dv.getUint32(eo + 16, true);
  // 索引是檔案裡的字串，用無原型物件：項目剛好叫 __proto__ 時，
  // 一般物件會把那次指派丟掉，之後讀到的是 Object.prototype，匯出就整份壞掉
  const files = Object.create(null);
  for (let i = 0; i < n; i++){
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error(T('zip 目錄壞掉','The zip directory is corrupt'));
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), el_ = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl));
    files[name] = {method, csize, lho: dv.getUint32(p + 42, true)};
    p += 46 + nl + el_ + cl;
  }
  return {u8, dv, files};
}

async function entryBytes(z, name){
  const f = z.files[name];
  if (!f) return null;
  const nl = z.dv.getUint16(f.lho + 26, true), el_ = z.dv.getUint16(f.lho + 28, true);
  const start = f.lho + 30 + nl + el_;
  const bytes = z.u8.subarray(start, start + f.csize);
  if (f.method === 0) return bytes;
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function entry(z, name){
  const b = await entryBytes(z, name);
  return b && new TextDecoder().decode(b);
}

// --- 寫回 zip：只換掉工作表那一份，其餘位元組原封不動搬過去 ---
const CRC_T = (() => { const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++){ let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[i] = c >>> 0; }
  return t; })();
const crc32 = u8 => { let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0; };

async function zipWrite(entries){
  const enc = new TextEncoder(), body = [], cdir = [];
  let off = 0;
  for (const e of entries){
    const nameB = enc.encode(e.name);
    const comp = new Uint8Array(await new Response(
      new Blob([e.bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
    const crc = crc32(e.bytes);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);   // 檔名是 UTF-8（bit 11）；不宣告的話非 ASCII 的項目名會被當成 CP437
    lh.setUint16(8, 8, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, comp.length, true); lh.setUint32(22, e.bytes.length, true);
    lh.setUint16(26, nameB.length, true);
    body.push(new Uint8Array(lh.buffer), nameB, comp);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true); cd.setUint16(10, 8, true); cd.setUint32(16, crc, true);
    cd.setUint32(20, comp.length, true); cd.setUint32(24, e.bytes.length, true);
    cd.setUint16(28, nameB.length, true); cd.setUint32(42, off, true);
    cdir.push(new Uint8Array(cd.buffer), nameB);
    off += 30 + nameB.length + comp.length;
  }
  const cdBytes = cdir.reduce((a,b) => a + b.length, 0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(8, entries.length, true); eo.setUint16(10, entries.length, true);
  eo.setUint32(12, cdBytes, true); eo.setUint32(16, off, true);
  return new Blob([...body, ...cdir, new Uint8Array(eo.buffer)],
                  {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

const xml = t => new DOMParser().parseFromString(t, 'application/xml');
const colNum = ref => { let n = 0; for (const c of ref){ const v = c.charCodeAt(0); if (v < 65) break; n = n*26 + (v-64); } return n; };
const rowNum = ref => +ref.match(/\d+/)[0];
const colName = n => { let s = ''; while (n > 0){ const m = (n-1) % 26; s = String.fromCharCode(65+m) + s; n = (n-1-m)/26; } return s; };

const BUILTIN_FMT = {0:'General',1:'0',2:'0.00',3:'#,##0',4:'#,##0.00',9:'0%',10:'0.00%',
  37:'#,##0_);(#,##0)',38:'#,##0_);[Red](#,##0)',39:'#,##0.00_);(#,##0.00)',40:'#,##0.00_);[Red](#,##0.00)',49:'@'};

function fmtNum(v, nf){
  const secs = (nf || '').split(';');
  if (v === 0 && secs.length >= 3 && secs[2].includes('-')) return '-';
  if (!nf || nf === 'General' || nf === '@') return String(Math.round(v * 1e10) / 1e10);
  // 格式碼分段：1 段全用；2 段＝正（含零）、負；3 段＝正、負、零。
  // 只讀第一段的話，預算表常用的 #,##0_);(#,##0)（內建 37~40）負數會印成 -1,234，
  // 原檔是 (1,234)，對帳的人會以為數字不一樣。
  const si = v < 0 && secs.length >= 2 ? 1 : v === 0 && secs.length >= 3 ? 2 : 0;
  // 小數位數要從格式碼本身算（0.0 → 1 位、#,##0.00 → 2 位、_-* #,##0_- → 0 位）。
  // 只看有沒有 "0.00" 的話，0.0 這種格式會被捨成整數，數字就錯了。
  // `_)` 是佔一個字寬的留白，不是括號，要跟顏色（[Red]）與跳脫字元一起清掉，
  // 否則正數段的 #,##0_) 會被誤認成「要加括號」。
  const body = secs[si].replace(/"[^"]*"/g, '').replace(/\\./g, '').replace(/\[[^\]]*\]/g, '').replace(/_./g, '');
  const dot = body.lastIndexOf('.');
  const dec = dot < 0 ? 0 : (body.slice(dot + 1).match(/[0#?]/g) || []).length;
  const pct = body.includes('%');           // 百分比格式：原檔存的是比率，要乘 100 再補 %
  // 負數段是拿絕對值去套的，負號／括號只能由格式自己的字面決定（[Red]#,##0 就真的不顯示負號）
  const mag = si === 1 ? Math.abs(v) : v;
  const n = pct ? mag * 100 : mag;
  let s = body.includes(',')
    ? n.toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec})
    : n.toFixed(dec);
  if (pct) s += '%';
  // 負號／括號由格式自己的字面決定（[Red]#,##0 就真的不顯示負號），
  // 但判斷要用「還沒清掉跳脫字元與引號」的字串：預算表常用的 \-* #,##0_- 與
  // [Red]\(#,##0\) 裡，負號與括號都是字面（\- \(），清掉之後就只剩 * #,##0，
  // 用 body 判斷會讓負數整個失去正負號（-1,234 印成 1,234）。只去掉 _x 留白與顏色。
  if (si === 1){
    const sign = secs[si].replace(/_./g, '').replace(/\[[^\]]*\]/g, '');
    if (sign.includes('(')) s = '(' + s + ')';
    else if (sign.includes('-')) s = '-' + s;
  }
  return s;
}

// 這幾張表都用檔案的內容當索引（框線樣式名稱、字型名稱），一律用無原型物件：
// 撞到 Object.prototype 的成員時才不會取到函式，再被拼進 CSS 裡。
const BW = Object.assign(Object.create(null),
  {hair:.25, thin:.5, medium:1, thick:1.5, double:1, dashed:.5, dotted:.5, mediumDashed:1});
const FONT_STACK = Object.assign(Object.create(null), {
  '微軟正黑體': "'Microsoft JhengHei','PingFang TC','Noto Sans CJK TC',sans-serif",
  '新細明體': "'PMingLiU','Songti TC','Noto Serif CJK TC',serif",
  '細明體': "'MingLiU','Songti TC',serif",
  '華康中明體': "'DFKai-SB','Songti TC',serif",
  '華康中黑體': "'PingFang TC','Microsoft JhengHei',sans-serif",
  // Times New Roman 沒有中文字。中文段落若沒有自己的 rich text 字型，
  // 就會掉到瀏覽器的預設襯線字（macOS 是宋體），跟隔壁的黑體對比很突兀，
  // 看起來像變了粗細。在後面補上中文黑體，英數仍走 Times。
  'Times New Roman': "'Times New Roman',Times,'Microsoft JhengHei','PingFang TC',sans-serif"
});
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// 分散對齊：Excel 是把字平均攤滿整格。用 CSS justify 在 CJK 上各家瀏覽器不一致，
// 直接把每個字包起來用 flex 推開，結果才穩定。
// 注意 html 可能已經含 rich text 的 <span>（中英不同字型），不能對字串逐字切，
// 那會把標記本身也切開、原樣印在畫面上。走 DOM 逐字取出，順便把該字所屬段落的樣式帶到 <i> 上。
function distribute(html){
  const box = document.createElement('span');
  return String(html).split('\n').map(line => {
    box.innerHTML = line;
    const out = [];
    (function walk(node, style){
      node.childNodes.forEach(n => {
        if (n.nodeType === 3) for (const ch of n.textContent) out.push({ch, style});
        else walk(n, (n.getAttribute && n.getAttribute('style')) || style);
      });
    })(box, null);
    if (!out.length) return '';
    return '<span class="dl' + (out.length <= 2 ? ' dl2' : '') + '">'
      + out.map(o => o.style ? `<i style="${o.style}">${esc(o.ch)}</i>` : `<i>${esc(o.ch)}</i>`).join('')
      + '</span>';
  }).join('\n');
}
// Excel 寫 1/0，LibreOffice 寫 true/false，兩種都要認
const isOn = v => v != null && v !== '0' && v !== 'false';
const flagOf = e => !!e && isOn(e.getAttribute('val') ?? '1');
const rgbOf = el_ => {
  const c = el_ && el_.getAttribute('rgb');
  if (!c) return null;
  const h = c.slice(-6);
  // 只放行真正的 16 進位色碼：這個值會直接拼進 style 屬性與 CSS，
  // 遇到造假的檔案才不會從屬性裡跳出去。黑色的話回 null（原檔的黑＝不指定）
  if (!/^[0-9a-f]{6}$/i.test(h) || h === '000000') return null;
  return '#' + h;
};

let SRC = null;   // 原始 xlsx 的位元組與工作表路徑，匯出時要用
let RAW = null;   // buildModel 的原始輸入，換分欄時重跑用

async function parseXlsx(buf, fileName){
  const z = await unzip(buf);
  const wb = xml(await entry(z, 'xl/workbook.xml'));
  const rels = xml(await entry(z, 'xl/_rels/workbook.xml.rels'));
  const relMap = {};
  rels.querySelectorAll('Relationship').forEach(r => relMap[r.getAttribute('Id')] = r.getAttribute('Target'));

  const sheets = [...wb.querySelectorAll('sheets > sheet')].map((s,i) => ({
    name: s.getAttribute('name'), idx: i,
    path: 'xl/' + (relMap[s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')] || '')
                    .replace(/^\/?xl\//, '')
  }));

  const defName = (nm, idx) => {
    const d = [...wb.querySelectorAll('definedNames > definedName')]
      .find(d => d.getAttribute('name') === nm && +d.getAttribute('localSheetId') === idx);
    return d ? d.textContent : null;
  };

  // 挑有列印範圍的工作表；沒有就挑資料最多的
  let pick = sheets.find(s => defName('_xlnm.Print_Area', s.idx));
  if (!pick){
    let best = -1;
    for (const s of sheets){
      const t = await entry(z, s.path);
      if (t && t.length > best){ best = t.length; pick = s; }
    }
  }
  if (!pick) throw new Error(T('找不到工作表','No worksheet found'));

  SRC = {z, path: pick.path, name: fileName};
  const sh = xml(await entry(z, pick.path));
  const st = xml(await entry(z, 'xl/styles.xml'));
  const ssTxt = await entry(z, 'xl/sharedStrings.xml');

  // --- 樣式 ---
  const numFmt = {...BUILTIN_FMT};
  st.querySelectorAll('numFmts > numFmt').forEach(f => numFmt[+f.getAttribute('numFmtId')] = f.getAttribute('formatCode'));
  const fonts = [...st.querySelectorAll('fonts > font')].map(f => ({
    name: (f.querySelector('name') || f.querySelector('rFont') || {getAttribute:()=>null}).getAttribute('val'),
    sz: +((f.querySelector('sz') || {getAttribute:()=>11}).getAttribute('val') || 11),
    b: flagOf(f.querySelector('b')),
    color: rgbOf(f.querySelector('color'))
  }));
  const borders = [...st.querySelectorAll('borders > border')].map(b => {
    const g = t => { const e = b.querySelector(t); return e ? e.getAttribute('style') : null; };
    return {left: g('left'), right: g('right'), top: g('top'), bottom: g('bottom')};
  });
  const xfs = [...st.querySelectorAll('cellXfs > xf')].map(x => {
    const a = x.querySelector('alignment');
    return {
      numFmtId: +(x.getAttribute('numFmtId') || 0),
      fontId: +(x.getAttribute('fontId') || 0),
      borderId: +(x.getAttribute('borderId') || 0),
      h: a && a.getAttribute('horizontal'), v: a && a.getAttribute('vertical'),
      wrap: !!(a && isOn(a.getAttribute('wrapText'))),
      indent: +((a && a.getAttribute('indent')) || 0)
    };
  });

  // --- 共用字串（保留 rich text 的顏色，白字是原檔用來縮排的） ---
  // 一格裡可以混好幾段不同字型／粗細（rich text）。只留顏色的話，
  // 「資金成本率(％)」這種中文段落會被套上儲存格層級的 Times New Roman，
  // 中文只能靠瀏覽器 fallback，看起來就跟隔壁格不一樣。
  const runOf = r => ({
    t: (r.querySelector('t') || {textContent:''}).textContent,
    c: rgbOf(r.querySelector('rPr > color')),
    f: (r.querySelector('rPr > rFont') || {getAttribute:()=>null}).getAttribute('val'),
    b: !!r.querySelector('rPr > b') && flagOf(r.querySelector('rPr > b')),
    hasB: !!r.querySelector('rPr'),          // 有 rPr 才代表這段自己指定過樣式
    s: +((r.querySelector('rPr > sz') || {getAttribute:()=>null}).getAttribute('val') || 0) || null
  });
  const shared = ssTxt ? [...xml(ssTxt).querySelectorAll('sst > si')].map(si => {
    const rs = [...si.querySelectorAll(':scope > r')];
    if (!rs.length){ const t = si.querySelector('t'); return [{t: t ? t.textContent : '', c: null}]; }
    return rs.map(runOf);
  }) : [];

  // --- 儲存格 ---
  const cells = {}, rowH = {}, hidden = new Set();
  sh.querySelectorAll('sheetData > row').forEach(r => {
    const ri = +r.getAttribute('r');
    const ht = r.getAttribute('ht');
    if (ht) rowH[ri] = +ht;
    if (isOn(r.getAttribute('hidden'))) hidden.add(ri);
    r.querySelectorAll('c').forEach(c => {
      const ref = c.getAttribute('r');
      const vEl = c.querySelector('v'), isEl = c.querySelector('is');
      cells[ref] = {s: +(c.getAttribute('s') || 0), t: c.getAttribute('t'),
                    v: vEl ? vEl.textContent : null,
                    is: isEl ? [...isEl.querySelectorAll('r')].map(r2 => ({t:(r2.querySelector('t')||{textContent:''}).textContent, c: rgbOf(r2.querySelector('rPr > color')), f:(r2.querySelector('rPr > rFont')||{getAttribute:()=>null}).getAttribute('val'), b: !!r2.querySelector('rPr > b') && flagOf(r2.querySelector('rPr > b')), hasB: !!r2.querySelector('rPr'), s: +((r2.querySelector('rPr > sz')||{getAttribute:()=>null}).getAttribute('val') || 0) || null}))
                              .concat(isEl.querySelector(':scope > t') ? [{t: isEl.querySelector(':scope > t').textContent, c: null}] : []) : null};
    });
  });

  const defRowH = +((sh.querySelector('sheetFormatPr') || {getAttribute:()=>null}).getAttribute('defaultRowHeight') || 16.5);
  const colW = {};
  sh.querySelectorAll('cols > col').forEach(c => {
    const w = +c.getAttribute('width');
    for (let i = +c.getAttribute('min'); i <= +c.getAttribute('max'); i++) colW[i] = w;
  });

  const merges = {};
  const skip = new Set();
  sh.querySelectorAll('mergeCells > mergeCell').forEach(m => {
    const [a, b] = m.getAttribute('ref').split(':');
    const c1 = colNum(a), r1 = rowNum(a), c2 = colNum(b), r2 = rowNum(b);
    merges[r1 + ',' + c1] = [r2 - r1 + 1, c2 - c1 + 1];
    for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) if (r !== r1 || c !== c1) skip.add(r + ',' + c);
  });

  const pm = sh.querySelector('pageMargins') || {getAttribute: () => null};
  const ps = sh.querySelector('pageSetup') || {getAttribute: () => null};
  const num = (v, d) => v == null ? d : +v;

  RAW = {
    fileName, sheetName: pick.name,
    printArea: defName('_xlnm.Print_Area', pick.idx),
    printTitles: defName('_xlnm.Print_Titles', pick.idx),
    colBreaks: [...sh.querySelectorAll('colBreaks > brk')].map(b => +b.getAttribute('id')),
    rowBreaks: [...sh.querySelectorAll('rowBreaks > brk')].map(b => +b.getAttribute('id')),
    landscape: ps.getAttribute('orientation') === 'landscape',
    fitToPage: isOn((sh.querySelector('sheetPr > pageSetUpPr') || {getAttribute:()=>null}).getAttribute('fitToPage')),
    scale: +(ps.getAttribute('scale') || 100),
    margins: {l: num(pm.getAttribute('left'), .75), r: num(pm.getAttribute('right'), .75),
              t: num(pm.getAttribute('top'), 1), b: num(pm.getAttribute('bottom'), 1)},
    cells, rowH, hidden, defRowH, colW, merges, skip, shared, xfs, fonts, borders, numFmt
  };
  return buildModel(RAW);
}

/* ============================ 組版面模型 ============================ */

function buildModel(x){
  const A1 = s => { const m = s.replace(/\$/g,'').split('!').pop().split(':');
                    return [colNum(m[0]), rowNum(m[0]), colNum(m[1]), rowNum(m[1])]; };
  let c1 = 1, r1 = 1, c2 = 1, r2 = 1;
  // 列印範圍：工具列手動指定的優先，其次是檔案裡的 Print_Area，都沒有就抓有資料的最大範圍
  if (x._areaOverride) [c1, r1, c2, r2] = A1(x._areaOverride);
  else if (x.printArea) [c1, r1, c2, r2] = A1(x.printArea);
  else {
    for (const ref in x.cells){ c2 = Math.max(c2, colNum(ref)); r2 = Math.max(r2, rowNum(ref)); }
  }
  let split = x.colBreaks.length ? x.colBreaks[0] : c2;
  // 手動指定的分欄優先
  if (x._splitOverride != null) split = x._splitOverride;
  const halves = {l: [], r: []};
  for (let c = c1; c <= c2; c++) (c <= split ? halves.l : halves.r).push(c);
  if (!halves.r.length){
    // 檔案沒設欄分頁（也沒有手動指定）就從中間切。
    // split 一定要跟著改成左半的最後一欄，否則「分欄」下拉選單找不到對應的選項，
    // 會顯示成第一項（A | B），跟畫面上真正切在 J | K 不符。
    halves.r = halves.l.splice(Math.ceil(halves.l.length/2));
    if (halves.l.length) split = halves.l[halves.l.length - 1];
  }

  const xfOf = ref => x.xfs[(x.cells[ref] || {s:0}).s] || x.xfs[0] || {};
  const bdOf = ref => x.borders[xfOf(ref).borderId] || {};

  // 表頭範圍：手動指定 > 檔案的「列印標題」> 自動偵測。
  // 沒有列印標題又不偵測的話，整份會被當成資料列——沒有重複表頭、沒有天線，版面等於廢掉。
  // 偵測方式：從第一列往下找「有直框線」的第一個連續區塊，那就是表頭；上面沒框線的是表名。
  // 只在區塊夠靠前（前 20 列內）且下面接著沒框線的列時才採用，避免整份都有框線的檔案被誤判。
  const framedRow = r => {
    for (let c = c1; c <= c2; c++){ const b = bdOf(colName(c) + r); if (b.left || b.right) return true; }
    return false;
  };
  const guessHdr = () => {
    let first = null, last = null;
    for (let r = r1; r <= Math.min(r2, r1 + 19); r++){
      if (framedRow(r)){ if (first === null) first = r; last = r; }
      else if (first !== null) return last;   // 區塊結束，下面是資料列
    }
    return r1 - 1;                            // 找不到界線就當作沒有表頭
  };
  const hdrLast = x._hdrOverride != null ? x._hdrOverride
                : (x.printTitles ? +x.printTitles.replace(/\$/g,'').split('!').pop().split(':')[1]
                                 : guessHdr());
  const hdrEnd = Math.min(hdrLast, r2 - 1);   // 至少留一列資料，否則整份會變空
  const hdrRows = []; for (let r = r1; r <= hdrEnd; r++) hdrRows.push(r);
  const dataRows = []; for (let r = hdrEnd + 1; r <= r2; r++) dataRows.push(r);


  // CSS class 收斂
  const cssMap = new Map(), css = [], noFmt = new Set();   // noFmt：原檔沒設對齊的儲存格
  const empties = new Set();   // 表格框線內卻沒填值的儲存格
  const CJK = /[㐀-鿿豈-﫿]/, CJKG = /[㐀-鿿豈-﫿]+/g;
  const fontUse = {中文: {}, 英數: {}};   // 全份用了哪些字型，用來認出慣例
  const mixedFontCells = [];              // 一格內混了兩種以上字型的格
  // 合併儲存格的框線在 Excel 裡分散在四個角落的格子上：左／上在錨點格，
  // 右邊線在同一列最右邊那格，下邊線在同一欄最下面那格。
  // 只讀錨點格的話，像 G4:K4「資金來源」這種橫向合併就會少掉右邊線。
  function mergedBorder(r, c, rs, cs){
    const a = bdOf(colName(c) + r);
    return {left: a.left, top: a.top,
            right: bdOf(colName(c + cs - 1) + r).right,
            bottom: bdOf(colName(c) + (r + rs - 1)).bottom};
  }

  function cls(ref, nohz, nobd, bIn, num){
    const xf = xfOf(ref), f = x.fonts[xf.fontId] || {}, b0 = bIn || bdOf(ref);
    // 沒設對齊就是 Excel 的「通用」：數字靠右、文字靠左
    const h = xf.h || (num ? 'right' : 'left');
    const b = nobd ? {} : b0;    // 標題區不畫框線：天線是第一列表頭的上框線畫的，重複畫會變粗
    const sig = [f.name, f.sz, !!f.b, f.color, h, xf.v, xf.wrap, xf.indent,
                 b.left, b.right, nohz ? null : b.top, nohz ? null : b.bottom].join('|');
    if (cssMap.has(sig)) return cssMap.get(sig);
    const nm = 'c' + cssMap.size;
    cssMap.set(sig, nm);
    const d = [`font-family:var(--user-font, ${FONT_STACK[f.name] || 'sans-serif'})`,
               `font-size:calc(${f.sz || 11}pt * var(--fs) * var(--k))`];
    if (f.b) d.push('font-weight:700');
    if (f.color) d.push(`color:${f.color}`);
    d.push(`text-align:${h === 'distributed' ? 'center' : h}`);
    if (xf.indent) d.push(`padding-left:calc(${xf.indent * .5}em + 2px)`);
    d.push('white-space:' + (xf.wrap ? 'pre-wrap' : 'pre'));
    css.push(`.${nm}{${d.join(';')}}`);
    // 框線畫在 td 上，讓 border-collapse 把相鄰的合成一條連續線。
    // 畫在內層 div 的話，一條縱線會變成每列一小段、左右兩格各畫一次，接縫在非整數像素上會忽粗忽細。
    const bd = [];
    [['left',b.left],['right',b.right],['top',nohz?null:b.top],['bottom',nohz?null:b.bottom]]
      .forEach(([s,v]) => { if (v) bd.push(`border-${s}:${BW[v] || .5}pt solid #000`); });
    if (bd.length) css.push(`td.${nm},th.${nm}{${bd.join(';')}}`);
    return nm;
  }

  const VAL = {center:'vc', bottom:'vb'};

  // rich text 的每一段可以有自己的字型／粗細（常見用法：中文用微軟正黑體、
  // 英數與括號用 Times New Roman）。跟儲存格層級不同時才輸出，避免多餘的 style。
  function runSpan(run, cf){
    const d = [];
    if (run.c) d.push(`color:${run.c}`);
    if (run.f && run.f !== cf.name) d.push(`font-family:var(--user-font, ${FONT_STACK[run.f] || 'sans-serif'})`);
    // 粗細兩個方向都要處理：這段是粗體而格子不是 → 加粗；
    // 這段不是粗體而格子是 → 明確寫回 400，否則會繼承格子的粗體。
    if (run.hasB && run.b !== !!cf.b) d.push('font-weight:' + (run.b ? 700 : 400));
    if (run.s && run.s !== cf.sz) d.push(`font-size:calc(${run.s}pt * var(--fs) * var(--k))`);
    return d.length ? `<span style="${d.join(';')}">${esc(run.t)}</span>` : esc(run.t);
  }

  function cell(r, c, nohz, nobd, chk){
    if (x.skip.has(r + ',' + c)) return null;
    const ref = colName(c) + r, cv = x.cells[ref];
    const xf = xfOf(ref);
    const cellFont = x.fonts[xf.fontId] || {};   // 儲存格層級的字型／字級／粗細，run 只在不同時才覆寫
    let t = '', num = false, cellRuns = null;
    if (cv && cv.v != null){
      if (cv.t === 's'){
        // 白字是「換行後的縮排」，補上換行，換行點才不會隨字型跑掉
        const runs = (x.shared[+cv.v] || []).slice();
        // 尾端只有空白的 run（常見：白字縮排留在最後）會被下面補成一行空行，Excel 裡看不到，先丟掉
        while (runs.length && !/\S/.test((runs[runs.length - 1].t || '').replace(/[　 ]/g, ' '))) runs.pop();
        let plain = '', out = '';
        runs.forEach(run => {
          if (/^#f{2}f{2}f{2}$/i.test(run.c || '') && plain && !plain.endsWith('\n')){ out += '\n'; plain += '\n'; }
          out += runSpan(run, cellFont);
          plain += run.t;
        });
        t = out; cellRuns = runs;
      } else if (cv.t === 'str' || cv.t === 'e'){ t = esc(cv.v); }
      else if (cv.t === 'b'){ t = cv.v === '1' ? 'TRUE' : 'FALSE'; }
      else { t = esc(fmtNum(+cv.v, x.numFmt[xf.numFmtId])); num = true; }
    } else if (cv && cv.is){
      t = cv.is.map(run => runSpan(run, cellFont)).join('');
      cellRuns = cv.is;
    }
    // 尾端空行：Excel 看不到，帶進來會多撐一行高度（原檔的換行是 \r\n，先正規化）
    t = t.replace(/\r\n?/g, '\n').replace(/(?:\n[^\S\n]*)+$/, '');
    if (xf.h === 'distributed' && t) t = distribute(t);
    const m = x.merges[r + ',' + c] || [1,1];
    const mb = mergedBorder(r, c, m[0], m[1]);
    const o = {t, c: cls(ref, nohz, nobd, mb, num), col: c};
    // 資料列裡「有框線圍起來、卻沒填值」的格：多半是漏填，標淺橘底請人確認。
    // 只認框線內的格，否則表格外圍那一片空白會全部被標起來。
    // 框線可能畫在隔壁格上（Excel 的左框線＝左鄰居的右框線），所以兩邊都要看
    const framed = mb.left || mb.right
                || (c > 1 && bdOf(colName(c - 1) + r).right) || bdOf(colName(c + m[1]) + r).left;
    if (chk && !/\S/.test(t.replace(/<[^>]*>/g, '').replace(/[　 ]/g, ' ')) && framed){ o.c += ' emptycell'; o.emp = ref; }
    // 原檔沒設對齊（Excel 的「通用」），靠左／靠右是這裡猜的，標底色請人確認
    if (!xf.h && t){ o.c += ' nofmt'; o.nf = true; noFmt.add(ref); }
    // Excel 裡不換行的靠左文字會溢到右邊的空格子上（「二、一般建築及設備計畫」放在 C 欄、
    // D E 空著就是這種）。標記候選，實際會不會溢由 pack() 看隔壁有沒有東西決定。
    if (!xf.wrap && !num && (!xf.h || xf.h === 'left') && !/\n/.test(t)) o.nw = true;
    // 一格混排多種字型時，記下「哪段文字用哪個字型」，稍後跟全份的慣例比對
    // （常見慣例：中文一種字型、英數一種；混到第三種多半是貼上來沒清乾淨）
    if (chk && cellRuns){
      const pairs = [];
      cellRuns.forEach(run => {
        const fn = run.f || cellFont.name, s = run.t || '';
        if (!fn) return;
        const pick = re => { const m = s.match(re) || []; const t2 = m.join(''); return t2.length > 8 ? t2.slice(0,8) + '…' : t2; };
        if (CJK.test(s)) pairs.push(['中文', fn, pick(CJKG)]);
        if (/[A-Za-z0-9]/.test(s)) pairs.push(['英數', fn, pick(/[A-Za-z0-9.%()-]+/g)]);
      });
      pairs.forEach(([k, fn]) => { fontUse[k][fn] = (fontUse[k][fn] || 0) + 1; });
      if (new Set(pairs.map(p => p[1])).size > 1){ o.fp = pairs; o.ref = ref; mixedFontCells.push(o); }
    }
    // 對齊一致性檢查用：實際生效的水平對齊（沒設就是 Excel 的「通用」＝數字靠右、文字靠左）
    if (chk && /\S/.test(t.replace(/<[^>]*>/g, '').replace(/[　 ]/g, ' '))){
      o.al = xf.h || (num ? 'right' : 'left'); o.ref = ref;
    }
    if (xf.indent) o.ind = xf.indent;   // 階層驗算要用：標籤的縮排層級
    if (VAL[xf.v]) o.v = VAL[xf.v];
    if (m[0] > 1) o.rs = m[0];
    if (m[1] > 1) o.cs = m[1];
    return o;
  }

  const rowh = r => Math.round((x.rowH[r] || x.defRowH) * 100) / 100;
  const plain = t => t.replace(/<[^>]*>/g, '').replace(/[\s\u3000]/g, '');
  // 有內容、可外溢、而且右邊那格是空的 → 讓文字畫出格子外，跟 Excel 一致
  const markSpill = arr => {
    arr.forEach((c, i) => {
      const nxt = arr[i + 1];
      if (c.nw && plain(c.t) && nxt && !plain(nxt.t)) c.spill = true;
      delete c.nw;
    });
    return arr;
  };
  const pack = (rows, nohz, nobd, chk) => rows.map(r => {
    const l = markSpill(halves.l.map(c => cell(r, c, nohz, nobd, chk)).filter(Boolean));
    const rr = markSpill(halves.r.map(c => cell(r, c, nohz, nobd, chk)).filter(Boolean));
    const all = l.concat(rr), blank = !all.some(c => plain(c.t));
    // 整列空白（原檔拿來當間隔的空列）不算漏填，橘底收回去
    all.forEach(c => { if (!c.emp) return;
      if (blank) c.c = c.c.replace(' emptycell', ''); else empties.add(c.emp); });
    return {
      h: rowh(r), l, r: rr,
      ind: xfOf(colName(halves.l[0]) + r).indent || 0,   // 縮排層級，用來認出群組標題
      blank                                              // 整列空白
    };
  });

  const allc = halves.l.concat(halves.r);
  // 有垂直框線才算表格本體；只有底線（天線）的仍屬標題區
  const framed = r => allc.some(c => { const b = bdOf(colName(c) + r); return b.left || b.right; });
  const titleRows = hdrRows.filter(r => !framed(r));
  const headRows = hdrRows.filter(r => framed(r));

  // 合計列（下框線是粗線）與其後的附註列 -> 釘在天地線位置
  // Excel 裡看不見的列不要輸出：hidden 旗標的，或列高被壓到比字級還小的（原檔拿來當間隔用，
  // 裡面常留著沒清掉的舊資料，撐開來就會冒出不該出現的東西）
  const fontSz = r => ((x.fonts[xfOf(colName(halves.l[0]) + r).fontId] || {}).sz || 11);
  const unseen = r => x.hidden.has(r) || rowh(r) < fontSz(r);

  let pinned = dataRows.filter(r => allc.some(c => bdOf(colName(c) + r).bottom === 'medium'));
  // 有些檔案的合計列沒有粗下框線（國營事業那份整份都沒有 medium），改用標籤認。
  // 只看左半第一個有字的欄位並要求整串等於「總計／合計」，
  // 否則會誤抓到計畫內容描述裡的「合計變電容量…」那種句子。
  if (!pinned.length){
    const rawText = ref => {
      const cv = x.cells[ref];
      if (!cv) return '';
      if (cv.t === 's') return (x.shared[+cv.v] || []).map(rn => rn.t).join('');
      if (cv.is) return cv.is.map(rn => rn.t).join('');
      return cv.v == null ? '' : String(cv.v);
    };
    const label = r => {
      for (const c of halves.l){ const t = rawText(colName(c) + r).trim(); if (t) return t; }
      return '';
    };
    for (let i = dataRows.length - 1; i >= 0; i--){
      const t = label(dataRows[i]).replace(/[\s　]/g, '');
      if (t === '總計' || t === '合計'){ pinned = [dataRows[i]]; break; }
    }
  }
  const footFrom = pinned.length ? pinned[pinned.length-1] : r2 + 1;
  const bodyRows = dataRows.filter(r => r < footFrom && !unseen(r));
  const footRows = dataRows.filter(r => r >= footFrom && !unseen(r));

  const widths = side => {
    const w = halves[side].map(c => x.colW[c] || 8.43), t = w.reduce((a,b) => a+b, 0);
    return w.map(v => Math.round(v / t * 1e6) / 1e4);
  };

  // rowBreaks 的 id 是「這一列之後分頁」，下一頁從 id+1 開始
  const breaks = x.rowBreaks.map(r => bodyRows.indexOf(r) + 1)
                            .filter(i => i > 0 && i < bodyRows.length).sort((a,b) => a-b);

  // Excel fitToPage 的縮放率沒存在檔裡。它是照「欄寬」縮的：把較寬的那半頁縮到版心寬度。
  // 欄寬單位是字元數，換算像素要乘 MDW（預設字型的數字寬度），每欄再加 5px 邊距。
  const ph = x.landscape ? 210 : 297, pw = x.landscape ? 297 : 210;
  const mdw = Math.max(1, Math.round((x.fonts[0] && x.fonts[0].sz || 11) * 96 / 72 * .5));
  const printablePx = (pw - (x.margins.l + x.margins.r) * 25.4) / 25.4 * 96;
  const naturalPx = Math.max(...['l','r'].map(s =>
    halves[s].reduce((a,c) => a + (x.colW[c] || 8.43), 0) * mdw + 5 * halves[s].length));
  const k = x.fitToPage ? Math.min(1, Math.round(printablePx / naturalPx * 1e4) / 1e4)
                        : (x.scale || 100) / 100;

  // 偵測天線粗細：取第一列表頭的上框線樣式，地線要畫成跟它一樣粗
  let topBorderStyle = 'thin';   // 預設 thin
  if (headRows.length) {
    const firstHR = headRows[0];
    for (const c of allc) {
      const b = bdOf(colName(c) + firstHR);
      if (b.top) { topBorderStyle = b.top; break; }
    }
  }
  const topBorderPt = BW[topBorderStyle] || .5;

  // 同一欄裡的對齊方式不一致：多數決，跟多數不同的那幾格標淺紫底（整欄填色太粗，指到格子才找得到）
  // 只看資料列、有字、非跨欄合併的格；合併格本來就常另設對齊，一起算會全欄誤報。
  const bodyPacked = pack(bodyRows, true, false, true),
        footPacked = pack(footRows, false, false, true), mixAlign = [];
  {
    const byCol = new Map();
    bodyPacked.forEach(r => r.l.concat(r.r).forEach(c => {
      if (!c.al || c.cs > 1) return;
      if (!byCol.has(c.col)) byCol.set(c.col, []);
      byCol.get(c.col).push(c);
    }));
    byCol.forEach(list => {
      const cnt = {};
      list.forEach(c => cnt[c.al] = (cnt[c.al] || 0) + 1);
      const kinds = Object.keys(cnt);
      if (kinds.length < 2) return;
      const top = kinds.sort((a,b) => cnt[b] - cnt[a])[0];
      list.forEach(c => { if (c.al !== top){ c.c += ' mixalign'; c.mixTop = top; mixAlign.push(c.ref); } });
    });
  }

  // 一格混排多種字型時，中文段、英數段各自跟全份最常用的那個字型比；
  // 對不上的就是那個「跑進來的字型」，標淺綠底並在 tooltip 指名。
  const badFont = [];
  {
    const top = k2 => Object.keys(fontUse[k2]).sort((a,b) => fontUse[k2][b] - fontUse[k2][a])[0];
    const dom = {中文: top('中文'), 英數: top('英數')};
    mixedFontCells.forEach(c => {
      const bad = c.fp.filter(([k2, fn]) => dom[k2] && fn !== dom[k2]);
      if (!bad.length) return;
      c.c += ' badfont';
      c.badTip = bad.map(([k2, fn, s]) => T(`${k2}「${s}」用了「${fn}」（全份多為「${dom[k2]}」）`,
        `${k2 === '中文' ? 'CJK' : 'Latin'} "${s}" uses "${fn}" (most of the document uses "${dom[k2]}")`)).join(T('；','; '));
      badFont.push(c.ref);
    });
  }

  return {
    name: x.fileName, sheet: x.sheetName, k,
    page: {w: pw, h: ph, ml: +(x.margins.l * 25.4).toFixed(2), mr: +(x.margins.r * 25.4).toFixed(2),
           mt: +(x.margins.t * 25.4).toFixed(2), mb: +(x.margins.b * 25.4).toFixed(2)},
    cols: {l: widths('l'), r: widths('r')},
    title: pack(titleRows, true, true), head: pack(headRows),
    rows: bodyPacked, foot: footPacked,
    rowNums: bodyRows,        // 匯出 xlsx 時要把列高寫回原本的列號
    footNums: footRows,       // 合計＋備註的原始列號，編輯內容寫回時要用
    breaks, css, topBorderPt, noFmt: [...noFmt], empties: [...empties], mixAlign, badFont, splitCol: split, c1, c2, r1, r2, hdrLast: hdrEnd,
    area: colName(c1) + r1 + ':' + colName(c2) + r2
  };
}

/* ============================ 載入流程 ============================ */
const $ = id => document.getElementById(id);
const el = (t,c) => { const e = document.createElement(t); if (c) e.className = c; return e; };

/* ---- 共用 UI：可複製的結果面板 + 右上角可關閉的提示 ---- */
function showPanel(title, body, opts = {}){
  const ov = el('div'); ov.className = 'panel-ov';
  const box = el('div'); box.className = 'panel-box';
  const hd = el('div'); hd.className = 'panel-title';
  const hb = el('b'); hb.textContent = title;
  const x = el('button'); x.className = 'panel-x'; x.textContent = '✕';
  x.onclick = () => close();
  hd.append(hb, x);
  const bd = el('div'); bd.className = 'panel-body';
  if (opts.html) bd.innerHTML = body; else bd.textContent = body;
  const ft = el('div'); ft.className = 'panel-foot';
  const cp = el('button'); cp.textContent = T('複製全文','Copy all');
  cp.onclick = () => {
    const txt = bd.innerText;
    const done = () => { cp.textContent = T('已複製','Copied'); setTimeout(() => cp.textContent = T('複製全文','Copy all'), 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, done);
    } else {   // file:// 或舊瀏覽器沒有非同步剪貼簿 API 時，退回去用選取複製
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch(e){}
      ta.remove(); done();
    }
  };
  const ok = el('button'); ok.textContent = T('關閉','Close'); ok.onclick = () => close();
  ft.append(cp, ok);
  box.append(hd, bd, ft);
  ov.appendChild(box);
  document.body.appendChild(ov);
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  // 不管從哪個出口關掉，都要把 Escape 監聽器一起拔掉，否則開幾次面板就疊幾個
  function close(){ ov.remove(); document.removeEventListener('keydown', onEsc); }
  function onEsc(e){ if (e.key === 'Escape') close(); }
  document.addEventListener('keydown', onEsc);
  return ov;
}
function showNotice(html, auto){
  const n = el('div'); n.className = 'notice';
  n.innerHTML = html + ' <button class="notice-x">✕</button>';
  n.querySelector('.notice-x').onclick = () => n.remove();
  document.body.appendChild(n);
  /* 工具列是 sticky 會捲動，提示固定貼在工具列下方，避免蓋住按鈕 */
  const bar = document.getElementById('bar');
  const top = bar && !bar.classList.contains('hide') ? bar.offsetHeight + 10 : 10;
  n.style.top = top + 'px';
  if (auto) setTimeout(() => n.remove(), auto);
  return n;
}

const zone = $('zone');
zone.onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) load(e.target.files[0]); };
function warnUnload(e){ e.preventDefault(); }   // 具名 → 重複 addEventListener 不會疊加
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); if ($('drop').classList.contains('hide')) return; zone.classList.add('on');
}));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('on'); }));
document.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) load(f); });
$('bnew').onclick = () => {
  // 回到拖曳畫面時要把「還沒存 PDF」的離場提醒一起收掉，
  // 不然畫面上已經沒有檔案了，關分頁時瀏覽器還是會問一次
  removeEventListener('beforeunload', warnUnload);
  $('drop').classList.remove('hide');
  $('bar').classList.add('hide');
  $('doc').innerHTML = '';
  $('err').textContent = '';
};

async function load(file){
  $('err').textContent = '';
  if (/\.xls$/i.test(file.name)){
    $('err').textContent = T('這是舊版 .xls，瀏覽器讀不了。\n請在 Excel 另存為 .xlsx，或用 xls2spread.py 轉。',
      'This is a legacy .xls, which the browser cannot read.\nSave it as .xlsx from Excel, or convert it with xls2spread.py.');
    return;
  }
  try {
    zone.querySelector('h1').textContent = T('讀取中…','Loading…');
    const model = await parseXlsx(await file.arrayBuffer(), file.name);
    start(model);
  } catch (e){
    $('err').textContent = T('讀取失敗：','Could not read the file: ') + e.message;
    console.error(e);
  } finally {
    zone.querySelector('h1').textContent = T('把 .xlsx 拖進來','Drop an .xlsx here');
  }
}

/* ============================ 編輯器 ============================ */
let D, S, dflt, titlePt, headPt, sel = -1;
const MM = 96/25.4, PT = 96/72;
let KEY = '', store = {get: () => ({}), set: () => {}};

function start(model, keepSettings){
  D = model;
  headFitKey = '';   // 換檔／換分欄／改列印範圍／改表頭列數都會換掉整份表頭，要重新量
  if (!D.rows.length) throw new Error(T('列印範圍內沒有資料列','No data rows inside the print range'));
  KEY = 'spread:' + D.name + ':' + D.sheet;
  store = {
    get(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } },
    set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }
  };
  titlePt = D.title.reduce((s,r) => s + r.h, 0);
  headPt  = D.head.reduce((s,r) => s + r.h, 0);
  const shDflt = +((D.page.h - D.page.mt - D.page.mb) - titlePt * D.k / 72 * 25.4).toFixed(1);
  dflt = {h: D.rows.map(r => r.h), breaks: D.breaks.slice(),
          lh: 1.15, fs: 1, zoom: .5, k: D.k, push: true, sh: shDflt, shend: shDflt, linkEnd: true, gap: 0, edits: {},
          footKeep: false, autoReflow: true,
          colAligns: {}, titleAlign: 'seam',
          rowBorders: {}, colBorders: {}, borderPt: Math.max(D.topBorderPt || .5, 1.5), headGap: 3,
          footH: D.foot.map(r => r.h), oneLineH: 20, multiGap: 16};
  const saved = store.get();
  if (keepSettings && S && S.h.length === D.rows.length){
    // 換分欄時保留使用者的列高、分頁、縮放等設定，只清掉可能失效的編輯、欄寬與備註段落
    S.edits = {};
    S.colWidths = null;
    S.notePlan = null;
  } else {
    S = Object.assign({}, dflt, saved);
    S.h = S.h.slice(); S.breaks = S.breaks.slice(); S.edits = Object.assign({}, S.edits);
    if (S.h.length !== D.rows.length){ S.h = dflt.h.slice(); S.breaks = dflt.breaks.slice(); }
  }
  sel = -1;
  let firstTime = !keepSettings && !Object.keys(saved).length;

  $('dyn').textContent = D.css.join('\n')
    + `\n@media print{@page{size:${D.page.w}mm ${D.page.h}mm;margin:0}`
    + `.page{height:calc(${D.page.h}mm - 0.2mm)!important}}`;
  $('fname').textContent = D.name + ' / ' + D.sheet;
  document.title = D.name + T(' – 對開表排版',' – Spread layout');
  $('drop').classList.add('hide');
  $('bar').classList.remove('hide');
  // ponytail: 載入後就攔關頁／重整，調整全在記憶體裡，關掉就沒了。不追 dirty flag，多問一次不痛。
  addEventListener('beforeunload', warnUnload);
  undoStack = []; redoStack = []; lastSnap = null;   // 換檔／換分欄，復原歷史重來
  populateSplitSelect();
  bind(); render();
  const notes = [];
  const some = a => a.slice(0,8).join(T('、',', ')) + (a.length > 8 ? '…' : '');
  if (D.noFmt.length) notes.push(T(
    `⚠ 有 ${D.noFmt.length} 格原檔沒設對齊（Excel 的「通用」），靠左／靠右是依內容猜的（數字靠右、文字靠左）。<br>這些格子已標紅底（列印、PDF 與匯出的 Excel 都看得到），請確認後在原檔補上對齊；不想看到紅底可在「檢視」群組取消勾選。`,
    `⚠ ${D.noFmt.length} cells have no alignment set in the source (Excel's "General"), so left / right was guessed from the content (numbers right, text left).<br>They are flagged with a red background, which does show up in print, the PDF and the exported Excel. Fix the alignment in the source file; to hide the red, uncheck it under View.`));
  if (D.empties.length) notes.push(T(
    `⚠ 有 ${D.empties.length} 格在表格框線內卻沒有值（${some(D.empties)}），已標淺橘底。<br>橘底只在畫面上顯示，列印、PDF 與匯出的 xlsx 都不會有；不想看到可在「檢視」群組取消勾選。`,
    `⚠ ${D.empties.length} cells inside the table rules have no value (${some(D.empties)}); they are flagged light orange.<br>Orange is on screen only — never in print, the PDF or the exported xlsx. To hide it, uncheck it under View.`));
  if (D.mixAlign.length) notes.push(T(
    `⚠ 有 ${D.mixAlign.length} 格的對齊方式跟同一欄的多數不一樣（${some(D.mixAlign)}），已標淺紫底。<br>紫底只在畫面上顯示，列印、PDF 與匯出的 xlsx 都不會有；不想看到可在「檢視」群組取消勾選。`,
    `⚠ ${D.mixAlign.length} cells are aligned differently from the rest of their column (${some(D.mixAlign)}); they are flagged light purple.<br>Purple is on screen only — never in print, the PDF or the exported xlsx. To hide it, uncheck it under View.`));
  if (D.badFont.length) notes.push(T(
    `⚠ 有 ${D.badFont.length} 格混排的字型跟全份慣例對不上（${some(D.badFont)}），已標淺綠底，滑鼠移上去會說是哪個字型。<br>綠底只在畫面上顯示，列印、PDF 與匯出的 xlsx 都不會有；不想看到可在「檢視」群組取消勾選。`,
    `⚠ ${D.badFont.length} cells mix fonts in a way that does not match the document's convention (${some(D.badFont)}); they are flagged light green — hover to see which font.<br>Green is on screen only — never in print, the PDF or the exported xlsx. To hide it, uncheck it under View.`));
  if (notes.length) showNotice(notes.join('<hr style="border:none;border-top:1px solid #7c3aed;margin:8px 0">'));
  if (firstTime) htmlLayout();
}

function populateSplitSelect(){

    o.value = c; o.textContent = colName(c) + ' | ' + colName(c+1);

    selEl.appendChild(o);
  }
}
function populateFootSelect(){

  D.foot.forEach((r, k) => {

// 末頁的備註會把地線往上頂：把「頂多少」寫出來，調高度時才不用來回猜。
// 備註最底部固定貼齊其他頁的地線，所以地線被頂高的量＝備註整塊的高度。
function updateFootInfo(){
  const box = $('footInfo'); if (!box || !D) return;
  const notes = D.foot.length > 1 ? D.foot.length - 1 : 0;
  // 沒有備註列（表尾只有合計）時，這個開關沒有意義，灰掉免得按了沒反應
  if ($('footKeep')) $('footKeep').disabled = !notes;
  if (!notes){ box.textContent = ''; return; }
  const h = D.foot.reduce((s, _, k) => k ? s + footHt(k) : s, 0);
  box.textContent = T(
    `備註 ${notes} 列共 ${h.toFixed(1)}pt：末頁地線比別頁高 ${h.toFixed(1)}pt（${(h * 25.4 / 72).toFixed(1)}mm），備註底部與別頁地線齊。`,
    `${notes} note row(s), ${h.toFixed(1)}pt in total: the last page's bottom rule sits ${h.toFixed(1)}pt (${(h * 25.4 / 72).toFixed(1)}mm) higher, with the notes ending flush with the other pages' rule.`);
}
/* ---- 對開頁的備註：跨頁段落重排 ----------------------------------------
   對開表的備註是「一句話橫跨左右兩張紙」，但原檔在 Excel 裡是左右兩個儲存格各自換行；
   換成瀏覽器字型之後兩邊的行數常常對不上（左邊折成 2 行、右邊只有 1 行），語意就斷了。
   這裡把兩半接成一段，依「左半寬 → 右半寬 → 左半寬…」逐行重排，再把每一行的左段寫回左半、
   右段寫回右半——兩半行數一樣，每一行也落在同一條基線上。
   寫回走 S.edits（跟手動改字同一條路）：⌘Z 還原得到，也會跟著設定存進 localStorage。
   每次重排都從「原檔文字（有改過字就用改過的）」重算，所以按幾次結果都一樣。 */
const NO_LINE_START = '，。、；：！？）〕】》」』〉·…％%"”’';
const NO_LINE_END   = '（〔【《「『〈“‘';
const wordCh = ch => /[0-9A-Za-z@._%+\-]/.test(ch);
// 右半自己是一條新的備註（編號或「註」開頭）時，兩半各自排，不要硬接成一段
const NEW_ITEM = /^[\s\u3000]*[（(]?[\s\u3000]*(?:註|附註|說明)?[\s\u3000]*[0-9０-９一二三四五六七八九十]{1,3}[\s\u3000]*[.．、)）]/;
// 這一格現在的內容：改過字用改過的，否則是原檔（去掉標籤與逃脫字元）
function noteText(c, key){
  const e = S.edits[key];
  const t = e != null ? e : (c && c.t || '');
  return t.replace(/<[^>]*>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
          .replace(/\r\n?/g, '\n');
}
const plainNote = t => (t || '').replace(/<[^>]*>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
                               .replace(/&amp;/g, '&').replace(/\r\n?/g, '\n');
// 這一格該拿哪份文字當段落來源：畫面上的內容若跟原檔只差在換行，那些換行就是「跨頁重排」
// 自己排上去的（不是作者的），用原檔那份、把我們加的換行丟掉；使用者真的改過字才用畫面上那份。
// 少了這一條，舊版排過的三行會被當成作者的硬換行留下來，再怎麼重排都還是那三行。
function noteCellText(c, key){
  const src = plainNote(c && c.t), cur = noteText(c, key);
  const flat = t => t.replace(/[\s\u3000]/g, '');
  return flat(cur) === flat(src) ? src : cur;
}
// 這個寬度裡放得下的字數（二元搜尋；一個字都放不下也回 1，免得外層無窮迴圈）
function fitCount(text, from, width, measure){
  const rest = text.slice(from);
  if (!rest) return 0;
  if (measure(rest) <= width) return rest.length;
  let lo = 1, hi = rest.length;
  while (lo < hi){
    const mid = (lo + hi + 1) >> 1;
    if (measure(rest.slice(0, mid)) <= width) lo = mid; else hi = mid - 1;
  }
  let n = lo;
  // 英文單字（含數字、小數）不要從中間切開
  while (n > 1 && n < rest.length && wordCh(rest[n-1]) && wordCh(rest[n])) n--;
  // 行首不能是收尾標點：把它拉回這一行（放不下就讓那一行稍微擠出去一點，跟 Word 一樣）
  while (n < rest.length && NO_LINE_START.includes(rest[n]) && measure(rest.slice(0, n+1)) <= width * 1.06 + 2) n++;
  // 行尾不能是開頭標點：把它推到下一行
  while (n > 1 && NO_LINE_END.includes(rest[n-1])) n--;
  return n;
}
// 一段文字沿著「左半 → 右半 → 左半…」排（跨頁接排）
function wrapAcross(text, wl, wr, ml, mr){
  const L = [], R = [];
  let i = 0, guard = 0;
  while (i < text.length && guard++ < 500){
    const cutL = text.indexOf('\n', i);
    const nl = fitCount(text, i, wl, ml);
    if (cutL >= 0 && cutL <= i + nl){ L.push(text.slice(i, cutL)); R.push(''); i = cutL + 1; continue; }
    L.push(text.slice(i, i + nl)); i += nl;
    if (i >= text.length){ R.push(''); break; }
    const cutR = text.indexOf('\n', i);
    const nr = fitCount(text, i, wr, mr);
    if (cutR >= 0 && cutR <= i + nr){ R.push(text.slice(i, cutR)); i = cutR + 1; continue; }
    R.push(text.slice(i, i + nr)); i += nr;
  }
  return { L, R };
}
// 只在半頁裡排（另一邊沒有字，或右半是另一條備註時）
function wrapOne(text, w, m){
  const out = []; let i = 0, guard = 0;
  while (i < text.length && guard++ < 500){
    const cut = text.indexOf('\n', i);
    const n = fitCount(text, i, w, m);
    if (cut >= 0 && cut <= i + n){ out.push(text.slice(i, cut)); i = cut + 1; continue; }
    out.push(text.slice(i, i + n)); i += n;
  }
  return out.length ? out : [''];
}
const joinLines = a => { const b = a.slice(); while (b.length > 1 && !b[b.length-1]) b.pop(); return b.join('\n'); };

// 每一列備註的「段落本文」＝接排的唯一來源。只算一次（第一次要排版時），之後都沿用：
//  - flow：一句話橫跨左右兩張紙，text 是整段（左半接右半）
//  - split：兩半各自在自己那半頁排（右半是另一條備註，或只有一邊有字）
// 因為來源固定，按幾次「跨頁重排備註」結果都一樣，不會像接力一樣把文字洗掉；
// 使用者改字時再由 syncNotePara() 把兩半交錯接回段落（接排的反運算）。
function noteParaPlan(k){
  if (!S.notePlan) S.notePlan = {};
  if (S.notePlan[k]) return S.notePlan[k];
  const pick = side => {
    const list = (D.foot[k][side] || [])
      .map((c, ci) => ({ ci, t: noteCellText(c, `f${k}|${side}|${ci}`) })).filter(x => x.t.trim());
    // 前面的格子裡塞了長文字（例如一列放了兩條備註）就認不出哪一格是本文，回 undefined 跳過
    if (list.slice(0, -1).some(x => x.t.replace(/[\s\u3000]/g, '').length > 6)) return undefined;
    return list.length ? list[list.length - 1] : { ci: 0, t: '' };
  };
  const L = pick('l'), R = pick('r');
  if (L === undefined || R === undefined) return null;
  // 本文格右邊的格子是不是空的：是的話原檔是靠「文字往右邊空的格子溢出」顯示的
  //（Excel 沒合併、也沒設自動換行時就是這樣），可用寬度算到半頁右緣，不是那一欄的寬度。
  const canSpill = (side, ci) => !(D.foot[k][side] || []).slice(ci + 1).some(c => plainOf(c.t));
  // 右半空、左半又能往右溢出：原檔在 Excel 裡這句是一路溢到右頁去的，所以照 flow 接排到右半
  const runOn = L.t.trim() && !R.t.trim() && canSpill('l', L.ci) && canSpill('r', R.ci);
  const plan = !runOn && (!L.t.trim() || !R.t.trim() || NEW_ITEM.test(R.t))
    ? { mode: 'split', li: L.ci, ri: R.ci, l: L.t, r: R.t, sl: canSpill('l', L.ci), sr: canSpill('r', R.ci) }
    : { mode: 'flow', li: L.ci, ri: R.ci, text: interleave(L.t, R.t), sl: canSpill('l', L.ci), sr: canSpill('r', R.ci) };
  S.notePlan[k] = plan;
  return plan;
}
const paraText = p => p.mode === 'flow' ? p.text : p.l + '\u0002' + p.r;
// 使用者改了某一半的備註：把兩半逐行交錯接回段落，下次重排才是從正確的本文算起
function syncNotePara(k){
  const plan = S.notePlan && S.notePlan[k];
  if (!plan) return;
  const cur = side => {
    const ci = side === 'l' ? plan.li : plan.ri;
    return noteCellText((D.foot[k][side] || [])[ci], `f${k}|${side}|${ci}`);
  };
  const L = cur('l'), R = cur('r');
  if (plan.mode === 'split'){ plan.l = L; plan.r = R; return; }
  plan.text = interleave(L, R);
}
// 左右兩半逐行交錯接回一段。左半第 2 行起的行首空白是接排補上的懸掛縮排，不是本文，丟掉
function interleave(L, R){
  const Ll = L.split('\n'), Rl = R.split('\n');
  let out = '';
  for (let i = 0; i < Math.max(Ll.length, Rl.length); i++)
    out += (i ? (Ll[i] || '').replace(/^[\s\u3000]+/, '') : (Ll[i] || '')) + (Rl[i] || '');
  return out;
}

// 「會影響接排結果的東西」的指紋：段落本文、字型／字級／行距／縮放比例、每一格的實際寬度。
// 指紋沒變就不重排——否則 render 每次都被拖列高之類的操作叫醒，會一直白做。
let lastAutoWrap = '', suppressAuto = false;
function autoWrapSig(){
  const parts = [];
  D.foot.forEach((row, k) => {
    if (!k) return;
    const p = noteParaPlan(k);
    parts.push(p ? paraText(p) : '\u0003');
  });
  parts.push(S.k, S.fs, S.lh, S.font || '', S.fontFam || '', D.area, D.hdrLast);
  document.querySelectorAll('tr[data-f] .cw').forEach(w => parts.push(w.dataset.key, w.parentElement.clientWidth));
  return parts.join('\u0001');
}

function reflowFootNotes(opts){
  const auto = !!(opts && opts.auto);
  const info = $('wrapInfo');
  const say = s => { if (info && !auto) info.textContent = s; };   // 自動重排不洗掉手動那次的說明
  if (!D || D.foot.length < 2) return say(T('這份檔案沒有備註列。', 'This file has no note rows.'));
  const z = S.zoom || 1;
  const divOf = (k, side, ci) => [...document.querySelectorAll(`tr[data-f="${k}"] .cw`)]
      .find(w => w.dataset.key === `f${k}|${side}|${ci}`);
  const measOf = w => {                       // 量尺借那一格自己的字型與縮放
    const s = el('span');
    s.style.cssText = 'position:absolute;left:0;top:0;width:max-content;white-space:pre;visibility:hidden';
    w.appendChild(s);
    return t => { s.textContent = t; return s.getBoundingClientRect().width / z; };
  };
  // 這一格可以排多寬。spill＝原檔沒合併、右邊的格子又是空的（Excel 是讓文字往右邊溢出的，
  // 例如最後一列備註），這時要把右邊那些空格的寬度一起算進來；只算那一欄會把字折成一堆窄行。
  // 用「自己 + 右邊兄弟格」的實際寬度相加，不要用表格右緣——表格右緣會把框線寬度也算進去，
  // 量出來的可用寬度比真正的大十幾 px，行就會被瀏覽器再折一次。
  const availOf = (w, spill) => {
    const cs = getComputedStyle(w);
    // 用格子（td）的寬，不用 w 自己的：左右對齊時 w 會被設成整段可用寬，量 w 會越量越寬
    const own = Math.max(8, w.parentElement.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0));
    if (!spill) return own;
    const z = S.zoom || 1;
    let rest = 0;
    for (let sib = w.parentElement.nextElementSibling; sib; sib = sib.nextElementSibling)
      rest += sib.getBoundingClientRect().width / z;
    return rest > 1 ? own + rest : own;
  };
  const rows = []; let skipped = 0;
  // 一條備註在原檔常佔好幾列（第 2 列起用空白縮排接續、不以編號開頭）。
  // 每列各排各的，前幾列右半會停在那一列原本的字尾、沒吃滿頁寬，所以整條接成一段排：
  // 前面每一列放一行左＋一行右（跟原檔一樣），最後一列放剩下的。
  const groupRest = {};   // 組頭 k → { text, indent, ks: [後續列] }；後續列 k → 'cont'
  for (let k = 1; k < D.foot.length; k++){
    const p = noteParaPlan(k);
    if (!p || p.mode !== 'flow') continue;
    let j = k + 1;
    const ks = [];
    for (; j < D.foot.length; j++){
      const q = noteParaPlan(j);
      if (!q || q.mode !== 'flow' || NEW_ITEM.test(q.text) || !/^[\s\u3000]/.test(q.text)) break;
      ks.push(j);
    }
    if (!ks.length) continue;
    const indent = noteParaPlan(ks[0]).text.match(/^[\s\u3000]+/)[0];
    groupRest[k] = { text: p.text + ks.map(j => noteParaPlan(j).text.replace(/^[\s\u3000]+/, '')).join(''), indent, ks };
    ks.forEach(j => groupRest[j] = 'cont');
    k = j - 1;
  }
  let carry = null;   // 目前這組還沒排完的字 { text, indent, last }
  const gone = {};    // 整組排完後沒分到字的列：高度收成 0，匯出設成隱藏
  const just = {};    // 左半每一行都接到右頁去的格：左右對齊（值＝可排寬度 px）
  D.foot.forEach((row, k) => {
    if (k === 0) return;                      // k=0 是合計列，不動
    const plan = noteParaPlan(k);
    if (!plan){ skipped++; return; }
    const wl = divOf(k, 'l', plan.li), wr = divOf(k, 'r', plan.ri);
    if (!wl || !wr){ skipped++; return; }
    let ml = measOf(wl), mr = measOf(wr);
    let aw = availOf(wl, plan.sl), bw = availOf(wr, plan.sr);
    let newL, newR;
    const g = groupRest[k];
    if (g && g !== 'cont') carry = { text: g.text, indent: '', last: g.ks[g.ks.length - 1], ind: g.indent, ml, mr, aw, bw };
    // 同一組用組頭那列量的寬度：後面的列可能上次被收成 0 高（display:none），量不到寬度
    if (g) ({ ml, mr, aw, bw } = carry);
    if (g){
      // 左半行首補懸掛縮排：量寬度時一起量，排完再接上
      const pre = carry.indent, mlI = t => ml(pre + t);
      const { L, R } = wrapAcross(carry.text, aw, bw, mlI, mr);
      const Lp = L.map((t, i) => (i ? carry.ind : pre) + t);
      if (!carry.text) gone[k] = 1;
      if (k === carry.last){ newL = joinLines(Lp); newR = joinLines(R); carry = null; }
      else {
        newL = L.length && L[0] ? Lp[0] : ''; newR = R[0] || '';
        carry.text = carry.text.slice((L[0] || '').length + (R[0] || '').length);
        carry.indent = carry.ind;
      }
    } else if (plan.mode === 'flow'){
      const { L, R } = wrapAcross(plan.text, aw, bw, ml, mr);   // 左右接成一段
      newL = joinLines(L); newR = joinLines(R);
    } else {
      // 兩半各自排（右半是另一條備註，或只有一邊有字）：不要拉回左半
      newL = joinLines(plan.l.trim() ? wrapOne(plan.l, aw, ml) : ['']);
      newR = joinLines(plan.r.trim() ? wrapOne(plan.r, bw, mr) : ['']);
    }
    const curL = noteText((row.l || [])[plan.li], `f${k}|l|${plan.li}`);
    const curR = noteText((row.r || [])[plan.ri], `f${k}|r|${plan.ri}`);
    // 左半最後一行後面還接著右半（段落沒在左頁結束）→ 每一行都要撐滿，右緣才齊
    if (newL && (plan.mode === 'flow' || g)){
      const nL = newL.split('\n').length, rl = (newR || '').split('\n');
      if (rl.length >= nL && rl[nL - 1]) just[`f${k}|l|${plan.li}`] = { w: aw, last: 1 };
    }
    // 右半：除了段落最後一行都撐滿；組裡還沒到最後一列時，這一行也接著下一列，要整行撐滿
    if (newR && (plan.mode === 'flow' || g)) just[`f${k}|r|${plan.ri}`] = { w: bw, last: g && carry ? 1 : 0 };
    rows.push({ k, li: plan.li, ri: plan.ri, curL, curR, newL, newR,
                lines: Math.max(newL ? newL.split('\n').length : 0, newR ? newR.split('\n').length : 0) });
  });
  if (!rows.length){
    say(skipped ? T(`有 ${skipped} 列備註分在好幾個格子裡，接不起來，沒有動。`,
                    `${skipped} note row(s) spread over several cells, so they were left alone.`)
                : T('沒有可以重排的備註列。', 'Nothing to re-wrap.'));
    return;
  }
  S.footGone = gone; S.noteJust = just;
  let changed = 0;
  for (const r of rows){
    if (r.newL !== r.curL || r.newR !== r.curR) changed++;
    for (const [side, ci, txt] of [['l', r.li, r.newL], ['r', r.ri, r.newR]]){
      const key = `f${r.k}|${side}|${ci}`;
      const c = (D.foot[r.k][side] || [])[ci];
      const orig = (c && c.t || '').replace(/<[^>]*>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/\r\n?/g, '\n');
      if (txt === orig) delete S.edits[key]; else S.edits[key] = txt;   // 跟手動改字同一條路
    }
  }
  render();                                  // fitFoot 會依新的行數把備註列撐到剛好
  const detail = rows.map(r => T(`第 ${r.k} 列 ${r.lines} 行`, `note ${r.k}: ${r.lines} lines`)).join(T('、', ', '));
  say(T(`已跨頁重排 ${rows.length} 列備註（改了 ${changed} 列）：${detail}。`,
        `Re-wrapped ${rows.length} note row(s), ${changed} of them changed: ${detail}.`)
      + (skipped ? T(`另有 ${skipped} 列分在好幾格，沒有動。`, ` ${skipped} row(s) span several cells and were left alone.`) : '')
      + T('　⌘Z 可還原。', ' ⌘Z undoes it.'));
}
