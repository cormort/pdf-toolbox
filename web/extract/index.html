<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>取出內嵌圖片</title>
<link rel="stylesheet" href="/tool.css">
</head>
<body>
<div class="wrap">
  <h1>取出內嵌圖片</h1>
  <p class="lead">把 PDF 裡原本就嵌著的圖片原樣拿出來，解析度不變。想整頁轉成圖片請用「PDF 轉圖片」。</p>

  <label id="drop" for="file"><strong id="name">拖放 PDF 到這裡，或點一下選擇檔案</strong>
    <span>拿檔案裡原本的圖，不重新取樣</span>
  </label>
  <input id="file" type="file" accept=".pdf,application/pdf">

  <div class="field">
    <span>頁碼</span>
    <input id="pages" type="text" placeholder="全部">
    <small>例如 <code>1-3,5,8-</code>（8- 表示第 8 頁到最後）；留空為全部。</small>
  </div>
  <div class="row">
    <button id="go" disabled>取出圖片</button>
    <a id="dl" class="btn" hidden>下載圖片</a>
    <span id="msg"></span>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let file = null;
function pick(f) {
  if (!f) return;
  file = f;
  $('name').textContent = f.name;
  $('go').disabled = false;
  $('dl').hidden = true;
  $('msg').textContent = '';
  $('msg').className = '';
}
$('file').onchange = e => pick(e.target.files[0]);
const drop = $('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); pick(e.dataTransfer.files[0]); };

$('go').onclick = async () => {
  const body = new FormData();
  body.append('file', file);
  body.append('pages', $('pages').value);
  $('go').disabled = true;
  $('dl').hidden = true;
  $('msg').className = '';
  $('msg').textContent = '處理中…';
  const t0 = Date.now();
  const tick = setInterval(() => $('msg').textContent = `處理中… ${Math.round((Date.now() - t0) / 1000)} 秒`, 500);
  try {
    const res = await (await fetch('/api/extract-images', { method: 'POST', body })).json();
    $('msg').textContent = res.ok ? (res.message || `完成，共 ${res.count} 張`) : res.message;
    $('msg').className = res.ok ? '' : 'warn';
    if (res.ok) {
      $('dl').href = res.download;
      $('dl').textContent = res.download.endsWith('.zip') ? '下載 ZIP' : '下載圖片';
      $('dl').hidden = false;
    }
  } catch (e) {
    $('msg').textContent = '無法連到背景服務：' + e;
    $('msg').className = 'warn';
  } finally {
    clearInterval(tick);
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
