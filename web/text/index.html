<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 轉文字</title>
<style>
  :root { --bg:#fff; --ink:#1d1d1f; --mute:#6e6e73; --line:#dcdcd8; --soft:#f6f6f4; --accent:#1d1d1f; --accent-ink:#fff; --warn:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161617; --ink:#ececec; --mute:#98989d; --line:#3a3a3d; --soft:#1f1f21; --accent:#ececec; --accent-ink:#161617; --warn:#ff8a80; }
  }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.lead { color:var(--mute); margin:0 0 24px; }
  #drop { display:block; border:2px dashed var(--line); border-radius:12px; padding:32px 16px; text-align:center; cursor:pointer; background:var(--soft); }
  #drop.over { border-color:var(--ink); }
  #drop strong { display:block; font-size:1.1rem; }
  #file { display:none; }
  .field { margin:16px 0; }
  .field > span { display:block; font-weight:600; margin-bottom:4px; }
  .field small { display:block; color:var(--mute); }
  input[type=text] { font:inherit; width:100%; max-width:320px; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:20px 0; }
  button, a.btn { font:inherit; padding:8px 18px; border-radius:8px; border:0; background:var(--accent); color:var(--accent-ink); cursor:pointer; text-decoration:none; }
  button:disabled { opacity:.4; cursor:default; }
  #msg.warn { color:var(--warn); }
  #preview { white-space:pre-wrap; font-family:Consolas, "Courier New", monospace; font-size:.85rem; background:var(--soft);
             border:1px solid var(--line); border-radius:10px; padding:12px; max-height:320px; overflow:auto; }
  #preview:empty { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>PDF 轉文字</h1>
  <p class="lead">抽出文字並保留版面（欄位會對齊），適合把表格內容抓下來再貼進 Excel。
    文字是從檔案裡的字型對應表還原的，掃描檔沒有文字層，抽不出東西。</p>

  <label id="drop" for="file"><strong id="name">拖放 PDF 到這裡，或點一下選擇檔案</strong></label>
  <input id="file" type="file" accept=".pdf,application/pdf">

  <div class="field">
    <span>頁碼</span>
    <input id="pages" type="text" placeholder="全部">
    <small>例如 <code>1-3,5,8-</code>；留空為全部。跳號的頁會分段處理後接起來。</small>
  </div>
  <div class="row">
    <button id="go" disabled>轉成文字</button>
    <a id="dl" class="btn" hidden>下載 TXT</a>
    <span id="msg"></span>
  </div>
  <div id="preview"></div>
</div>
<script>
const $ = id => document.getElementById(id);
let file = null;
function pick(f) {
  if (!f) return;
  file = f;
  $('name').textContent = f.name;
  $('go').disabled = false;
  $('dl').hidden = true;
  $('msg').textContent = '';
  $('msg').className = '';
  $('preview').textContent = '';
}
$('file').onchange = e => pick(e.target.files[0]);
const drop = $('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); pick(e.dataTransfer.files[0]); };

$('go').onclick = async () => {
  const body = new FormData();
  body.append('file', file);
  body.append('pages', $('pages').value);
  $('go').disabled = true;
  $('dl').hidden = true;
  $('msg').className = '';
  $('msg').textContent = '轉換中…';
  $('preview').textContent = '';
  try {
    const res = await (await fetch('/api/text', { method: 'POST', body })).json();
    $('msg').textContent = res.ok ? res.message : res.message;
    $('msg').className = res.ok ? '' : 'warn';
    if (res.ok) {
      $('dl').href = res.download;
      $('dl').hidden = false;
      // 順便抓前面一小段顯示，讓使用者確認抽出來的是不是他要的
      const text = await (await fetch(res.download)).text();
      $('preview').textContent = text.slice(0, 2000) + (text.length > 2000 ? '\n…（只預覽前 2000 個字元）' : '');
    }
  } catch (e) {
    $('msg').textContent = '無法連到背景服務：' + e;
    $('msg').className = 'warn';
  } finally {
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
